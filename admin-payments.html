<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ProCraft Admin — Payments</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold:#C9A84C; --green-dark:#3e5a42; --green-mid:#4a6b4f;
      --cream:#F5F2EC; --text:#2C3A32; --muted:#7A8C82; --border:#DDD8CC; --white:#FFFFFF; --error:#C0392B;
      --status-processing:#3B82F6; --status-confirmed:#16A34A; --status-failed:#C0392B; --status-cancelled:#7A8C82;
    }
    html, body { min-height: 100%; font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--text); }

    .page { max-width: 1200px; margin: 0 auto; padding: 32px 20px; }
    .page-header { margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .page-title { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 400; color: var(--green-dark); }

    /* Filters */
    .filters { background: var(--white); border: 1px solid var(--border); border-radius: 4px; padding: 16px 20px; margin-bottom: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; align-items: end; }
    .filter-group { display: flex; flex-direction: column; gap: 5px; }
    .filter-label { font-size: 9px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
    .filter-select, .filter-input { height: 36px; border: 1px solid var(--border); border-radius: 3px; padding: 0 10px; font-family: 'DM Sans', sans-serif; font-size: 12px; color: var(--text); background: var(--cream); }
    .filter-select:focus, .filter-input:focus { outline: none; border-color: var(--gold); }
    .filter-actions { display: flex; gap: 8px; align-items: end; }
    .btn-filter { height: 36px; background: var(--green-dark); color: #fff; border: none; border-radius: 3px; padding: 0 16px; font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer; }
    .btn-filter:hover { background: var(--green-mid); }
    .btn-reset { height: 36px; background: transparent; color: var(--muted); border: 1px solid var(--border); border-radius: 3px; padding: 0 16px; font-family: 'DM Sans', sans-serif; font-size: 11px; cursor: pointer; }
    .btn-reset:hover { color: var(--text); }

    /* Table */
    /* overflow-x:auto — 表頭 white-space:nowrap 使表格 min-content 寬度超出手機視窗;
       原本的 overflow:hidden 會把右側欄位裁掉且無法捲動。overflow-y:hidden 保留
       border-radius 的裁切效果。參照 quotes.html 既有作法。 */
    .table-wrap { background: var(--white); border: 1px solid var(--border); border-radius: 4px; overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; }
    .table-header { padding: 14px 20px; border-bottom: 1px solid var(--border); background: #FAFAF8; display: flex; align-items: center; justify-content: space-between; }
    .table-title { font-size: 10px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--green-dark); }
    .table-count { font-size: 11px; color: var(--muted); }
    table { width: 100%; border-collapse: collapse; }
    thead th { padding: 10px 16px; background: #F5F3EF; border-bottom: 1px solid var(--border); font-size: 9px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); text-align: left; white-space: nowrap; }
    tbody tr { border-bottom: 1px solid var(--border); }
    tbody tr:last-child { border-bottom: none; }
    tbody td { padding: 12px 16px; font-size: 12px; vertical-align: middle; }
    .td-dealer { font-weight: 500; }
    .td-sales { font-size: 12px; }
    .td-unassigned { color: var(--muted); font-style: italic; }
    .td-dealer-sub { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .td-empty { padding: 40px 16px; text-align: center; color: var(--muted); font-size: 12px; }

    /* ===== Awaiting Payment section ===== */
    /* CB-56 U10:列數多時不無限延長 —— 內層捲動容器,滿高後 Y 捲動。
       🔴 CB-89 更新此算式:本區動作鈕由三顆增為四顆(新增 Select Payment
       Method),.await-actions 改為可換行,故單列高度在窄視窗下會增加。
         寬視窗(四顆同一行)  單列 ≈ 66px → 500px ≈ thead 31px + 7 列
         窄視窗(按鈕換行)    單列 ≈ 94px → 500px ≈ thead 31px + 5 列
       max-height 由 430px 調為 500px,讓最壞情況(換行)仍看得到 5 列。
       🔴 日後再增減本區按鈕數量時,必須一併重算此註解 —— 否則它會變成
          與實際不符的死註解(F-164 同類)。
       thead 用 sticky 釘住,捲動時表頭不消失;背景 #F5F3EF 為實色,不會透出列內容。
       捲動容器只包 <table>,不包 .table-header —— 標題與搜尋框必須留在原位。 */
    .await-scroll { max-height: 500px; overflow: auto; -webkit-overflow-scrolling: touch; }
    .await-scroll thead th { position: sticky; top: 0; z-index: 2; }
    .awaiting-head-right { display: flex; align-items: center; gap: 12px; }
    .awaiting-search { height: 30px; border: 1px solid var(--border); border-radius: 3px; padding: 0 10px; font-family: 'DM Sans', sans-serif; font-size: 12px; color: var(--text); background: var(--cream); width: 200px; max-width: 46vw; }
    .awaiting-search:focus { outline: none; border-color: var(--gold); }
    /* CB-89:flex-wrap 由 nowrap 改為 wrap —— 四顆鈕在窄視窗會超出欄寬。
       不加時的後果是整個 .await-scroll 出現水平捲動,PO# 欄被推出視野。
       gap 8px 同時作用於兩軸,換行後的列間距不需另設。 */
    .await-actions { display: flex; flex-wrap: wrap; gap: 8px; white-space: nowrap; }
    .await-wait { font-size: 12px; color: var(--muted); white-space: nowrap; }

    /* ===== Ghost Payments alert (CB-43 幽靈結案) =====
       緊急梯度最高:幽靈 > 催款 > 一般清單。
       色彩沿用既有 error 色(#C0392B = --error):實色用 var(--error),
       半透明用 rgba(192,57,43,α)(同 .modal-error 慣例,非新色);
       Unknown 灰 rgba(122,140,130,α) = --muted(同 s-cancelled badge)。 */
    .ghost-banner { background: rgba(192,57,43,0.06); border: 1px solid rgba(192,57,43,0.30); border-left: 4px solid var(--error); border-radius: 4px; margin-bottom: 16px; overflow: hidden; }
    .ghost-banner-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px; border-bottom: 1px solid rgba(192,57,43,0.18); }
    .ghost-banner-title { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--error); }
    .ghost-banner-title .gb-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--error); flex: 0 0 auto; }
    .ghost-banner-count { font-size: 11px; color: var(--error); white-space: nowrap; }
    .ghost-banner-sub { padding: 10px 20px 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
    .ghost-banner-sub strong { color: var(--text); font-weight: 500; }
    .ghost-steps { margin: 8px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
    .ghost-steps li { font-size: 12px; color: var(--muted); line-height: 1.5; }
    .ghost-list { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
    .ghost-row { background: var(--white); border: 1px solid rgba(192,57,43,0.20); border-radius: 4px; padding: 12px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
    .ghost-row-main { display: flex; flex-direction: column; gap: 3px; min-width: 180px; flex: 1 1 auto; }
    .ghost-row-dealer { font-size: 13px; font-weight: 500; color: var(--text); }
    .ghost-row-po { font-size: 11px; color: var(--muted); }
    .ghost-amount { font-size: 13px; font-weight: 500; color: var(--text); white-space: nowrap; }
    .ghost-cause { display: inline-block; padding: 3px 9px; border-radius: 2px; font-size: 10px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; background: rgba(192,57,43,0.10); color: var(--error); }
    .ghost-cause.c-unknown { background: rgba(122,140,130,0.14); color: var(--muted); }
    .ghost-qb { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--muted); white-space: nowrap; }
    .ghost-qb .qb-id { color: var(--text); font-variant-numeric: tabular-nums; }
    .ghost-resolve { flex: 0 0 auto; background: var(--error); color: #fff; border: none; border-radius: 3px; padding: 7px 16px; font-family: 'DM Sans', sans-serif; font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; }
    .ghost-resolve:hover { opacity: 0.88; }
    .ghost-resolve:disabled { opacity: 0.5; cursor: default; }

    /* Payment status badge */
    .pay-badge { display: inline-block; padding: 3px 10px; border-radius: 2px; font-size: 10px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
    .pay-badge.s-processing { background: rgba(59,130,246,0.1);  color: var(--status-processing); }
    .pay-badge.s-confirmed  { background: rgba(22,163,74,0.1);   color: var(--status-confirmed); }
    .pay-badge.s-failed     { background: rgba(192,57,43,0.1);   color: var(--status-failed); }
    .pay-badge.s-cancelled  { background: rgba(122,140,130,0.14);color: var(--status-cancelled); }

    /* Method label */
    .method-label { font-size: 11px; letter-spacing: 0.04em; }

    /* View button */
    .btn-view { display: inline-flex; align-items: center; gap: 5px; background: transparent; color: var(--green-dark); border: 1px solid var(--border); border-radius: 3px; padding: 5px 12px; font-family: 'DM Sans', sans-serif; font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; text-decoration: none; }
    .btn-view:hover { border-color: var(--gold); color: var(--gold); }

    /* Loading / message */
    .msg-block { padding: 40px 20px; text-align: center; color: var(--muted); font-size: 13px; }

    /* Toast */
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--green-dark); color: #fff; padding: 12px 22px; border-radius: 4px; font-size: 12px; letter-spacing: 0.03em; opacity: 0; pointer-events: none; transition: all 0.25s; z-index: 2000; max-width: 90%; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { background: var(--error); }

    /* ===== Detail page ===== */
    .back-link { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); text-decoration: none; margin-bottom: 18px; }
    .back-link:hover { color: var(--green-dark); }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 720px) { .detail-grid { grid-template-columns: 1fr; } }
    .detail-card { background: var(--white); border: 1px solid var(--border); border-radius: 4px; padding: 20px 22px; }
    .detail-card.full { grid-column: 1 / -1; }
    .section-title { font-size: 10px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--green-dark); margin-bottom: 14px; }
    .detail-row { display: flex; justify-content: space-between; gap: 16px; padding: 7px 0; border-bottom: 1px solid #EFEBE1; font-size: 13px; }
    .detail-row:last-child { border-bottom: none; }
    .detail-row .lbl { color: var(--muted); }
    .detail-row .val { text-align: right; font-weight: 500; word-break: break-word; }
    .view-quote-link { display: inline-flex; align-items: center; gap: 5px; color: var(--green-dark); text-decoration: none; font-weight: 500; }
    .view-quote-link:hover { color: var(--gold); }
    .qb-link-row { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .btn-mini { background: transparent; border: 1px solid var(--border); border-radius: 3px; padding: 4px 10px; font-family: 'DM Sans', sans-serif; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; color: var(--green-dark); text-decoration: none; }
    .btn-mini:hover { border-color: var(--gold); color: var(--gold); }
    .check-img-wrap { margin-top: 6px; }
    .check-img { max-width: 100%; border: 1px solid var(--border); border-radius: 4px; display: block; }
    .check-img-note { font-size: 12px; color: var(--muted); padding: 12px 0; }
    .cancel-hist-item { padding: 10px 0; border-bottom: 1px solid #EFEBE1; font-size: 12px; }
    .cancel-hist-item:last-child { border-bottom: none; }
    .cancel-hist-item .ch-meta { color: var(--muted); font-size: 11px; margin-bottom: 3px; }
    #detail-actions:not(:empty) { margin-bottom: 16px; }
    .detail-actions-bar { display: flex; flex-wrap: wrap; gap: 10px; }

    /* ===== Offline / Reminder form (in #pickerModal, opened from Awaiting rows) ===== */
    .modal.picker { max-width: 560px; }
    .picker-title { font-family: 'Cormorant Garamond', serif; font-size: 20px; color: var(--green-dark); }
    .picker-back { background: none; border: none; color: var(--muted); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; padding: 0; margin-bottom: 14px; }
    .picker-back:hover { color: var(--green-dark); }

    /* ===== CB-89 代選 UI =====
       🔴 每一條都必須明寫 text-transform:none 與 letter-spacing:normal。
          上方 .modal-field label(L163)帶 uppercase + 0.15em 字距,而本區塊
          的元素位於 .modal-field 之內 —— 不重置就會繼承下來,文字被拉長、
          強制大寫、提早換行,選項卡看起來又擠又亂(CB-89 U5 初版的實際症狀)。
          🔴 這是繼承問題,不是排版問題;改 padding / width 都治不好。 */
    .cb89-opt { display: flex; align-items: center; gap: 10px; padding: 11px 13px; border: 1px solid var(--border); border-radius: 3px; margin-bottom: 8px; cursor: pointer; background: var(--white); text-transform: none; letter-spacing: normal; }
    .cb89-opt:hover { border-color: var(--gold); }
    .cb89-opt input { flex: 0 0 auto; margin: 0; }
    .cb89-opt-name { font-size: 13px; font-weight: 500; color: var(--text); }
    .cb89-opt-fee { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; }
    .cb89-note { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 12px; text-transform: none; letter-spacing: normal; }
    .cb89-ack { display: flex; align-items: flex-start; gap: 9px; padding: 11px 13px; border: 1px solid var(--border); border-radius: 3px; background: var(--cream); font-size: 13px; line-height: 1.5; color: var(--text); cursor: pointer; text-transform: none; letter-spacing: normal; }
    .cb89-ack input { flex: 0 0 auto; margin: 2px 0 0; }

    /* Actions 選單(承載於既有 #pickerModal,不新增 modal DOM)。
       🔴 不用絕對定位的下拉:.await-scroll 有 overflow:auto,會把選單裁掉一半。 */
    .cb89-menu { display: flex; flex-direction: column; gap: 8px; }
    .cb89-menu-item { width: 100%; text-align: left; background: var(--white); border: 1px solid var(--border); border-radius: 4px; padding: 12px 14px; cursor: pointer; font-family: 'DM Sans', sans-serif; }
    .cb89-menu-item:hover { border-color: var(--gold); }
    .cb89-menu-item.danger:hover { border-color: var(--error); }
    .cb89-menu-title { display: block; font-size: 13px; font-weight: 500; color: var(--green-dark); margin-bottom: 3px; }
    .cb89-menu-item.danger .cb89-menu-title { color: var(--error); }
    .cb89-menu-desc { display: block; font-size: 11.5px; color: var(--muted); line-height: 1.5; }

    /* ===== Modal shells (used by Stage-2 actions) ===== */
    .modal-overlay { position: fixed; inset: 0; background: rgba(44,58,50,0.45); display: none; align-items: center; justify-content: center; z-index: 1500; padding: 20px; }
    .modal-overlay.show { display: flex; }
    .modal { background: var(--white); border-radius: 6px; width: 100%; max-width: 460px; padding: 24px; box-shadow: 0 12px 40px rgba(0,0,0,0.18); }
    .modal-title { font-family: 'Cormorant Garamond', serif; font-size: 20px; color: var(--green-dark); margin-bottom: 6px; }
    .modal-sub { font-size: 12px; color: var(--muted); margin-bottom: 16px; line-height: 1.5; }
    .modal-field { margin-bottom: 14px; }
    .modal-field label { display: block; font-size: 9px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
    .modal-field textarea, .modal-field input { width: 100%; border: 1px solid var(--border); border-radius: 3px; padding: 9px 11px; font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text); background: var(--cream); }
    .modal-field textarea { min-height: 84px; resize: vertical; }
    .modal-field textarea:focus, .modal-field input:focus { outline: none; border-color: var(--gold); }
    .modal-error { font-size: 12px; color: var(--error); margin-top: 4px; margin-bottom: 10px; display: none; padding: 10px 12px; background: rgba(192,57,43,0.07); border: 1px solid rgba(192,57,43,0.25); border-radius: 3px; }
    .modal-error.show { display: block; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
    .btn-primary { padding: 10px 22px; background: var(--green-dark); border: none; border-radius: 3px; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; color: #fff; }
    .btn-primary:hover { background: var(--green-mid); }
    .btn-primary.danger { background: var(--error); }
    .btn-primary:disabled { opacity: 0.55; cursor: default; }
    .btn-secondary { padding: 10px 22px; background: transparent; border: 1px solid var(--border); border-radius: 3px; font-family: 'DM Sans', sans-serif; font-size: 12px; letter-spacing: 0.05em; cursor: pointer; color: var(--muted); }
    .btn-secondary:hover { color: var(--text); }
  </style>
</head>
<body>

<!-- Unified Navigator (shared component). data-page="payments" matches the Payments
     item in navigator.js ADMIN_NAV, which F9 marks superOnly (super_admin only). -->
<div id="pcd-nav" data-page="payments"></div>

<!-- ============================ LIST VIEW ============================ -->
<div class="page" id="list-view" style="display:none">
<div class="page-header">
    <div class="page-title">Payments</div>
  </div>

  <!-- ===== Ghost Payments alert (CB-43):有未結案幽靈才 render,否則保持空 ===== -->
  <div id="ghostBanner"></div>

  <!-- ===== Awaiting Payment (quotes: status=Pending, no payment yet) ===== -->
  <div class="table-wrap" style="margin-bottom:16px;">
    <div class="table-header">
      <span class="table-title"><span id="awaitingCount">—</span> <span id="awaitingCountNoun">Quotes</span> <span data-pc-status-label="Pending">Waiting for Payment</span></span>
      <div class="awaiting-head-right">
        <input type="text" class="awaiting-search" id="awaitingSearch" placeholder="Search PO# / Dealer"/>
      </div>
    </div>
  <div class="await-scroll">
    <table>
      <thead>
        <tr>
          <th>PO#</th>
          <th>Dealer</th>
          <th>Sales</th>
          <th>Grand Total</th>
          <th>Waiting (approx.)</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="awaitingBody">
        <tr><td colspan="6" class="td-empty">Loading…</td></tr>
      </tbody>
    </table>
    </div>
  </div>

  <div class="filters">
    <div class="filter-group">
      <label class="filter-label">Status</label>
      <select class="filter-select" id="filterStatus">
        <option value="">All Statuses</option>
        <option value="processing">Processing</option>
        <option value="confirmed">Confirmed</option>
        <option value="failed">Failed</option>
        <option value="cancelled">Cancelled</option>
      </select>
    </div>
    <div class="filter-group">
      <label class="filter-label">Method</label>
      <select class="filter-select" id="filterMethod">
        <option value="">All Methods</option>
        <option value="card">Card</option>
        <option value="ach">ACH</option>
        <option value="check">Check</option>
        <option value="offline">Offline</option>
      </select>
    </div>
    <!-- CB-38:Sales filter。options 由 loadSalesList() 動態填入。
         Status/Method 是 payment 屬性,Sales/日期/搜尋是範圍屬性,故置於此。 -->
    <div class="filter-group">
      <label class="filter-label">Sales</label>
      <select class="filter-select" id="filterSales">
        <option value="">All Sales</option>
      </select>
    </div>
    <div class="filter-group">
      <label class="filter-label">From</label>
      <input type="date" class="filter-input" id="filterFrom"/>
    </div>
    <div class="filter-group">
      <label class="filter-label">To</label>
      <input type="date" class="filter-input" id="filterTo"/>
    </div>
    <div class="filter-group">
      <label class="filter-label">Search (PO# / Dealer)</label>
      <input type="text" class="filter-input" id="filterSearch" placeholder="PDC00123 or company name"/>
    </div>
    <div class="filter-actions">
      <button class="btn-filter" id="btnFilter">Filter</button>
      <button class="btn-reset" id="btnReset">Reset</button>
    </div>
  </div>

  <div class="table-wrap">
    <div class="table-header">
      <span class="table-title">Payment Records</span>
      <span class="table-count" id="listCount">—</span>
    </div>
    <table>
      <thead>
        <tr>
          <th>PO#</th>

<script>
// ════════════════════════════════════════════════════════════════════
// admin-payments.html — CB-43 T5 (Admin 付款管理頁)
// Segment 1: Supabase init + 權限 gate + router + 列表頁
// (詳情頁 renderDetail + 4 個 admin actions 於 Segment 2 補入)
// ════════════════════════════════════════════════════════════════════
const { createClient } = window.supabase;
const _supabase = createClient(window.SB_URL, window.SB_KEY);

// ---- state ----
let allPayments = [];          // 全部 payments(created_at DESC)
let quoteMap    = {};          // quote_id  -> quote row
let dealerMap   = {};          // dealer_id -> dealer row

// ── CB-38 ─────────────────────────────────────────────────────────
// 本頁限 super_admin(F9),故 default 恆為 All Sales('')。
// "My Dealers" 仍保留 —— super_admin 本身也可能是某些 dealer 的 sales。
// ⚠️ 本頁為 client-side 過濾,與 admin-quotes 的 server-side 機制不同。
let currentUserId     = null;
let salesList         = [];
let salesNameMap      = {};   // CB-38.1:id -> admin row,列表 Sales 欄反查用
let _salesFilterBuilt = false;   // showList() 每次進列表都會跑,避免重複 append
const SALES_ME   = '__me__';
const SALES_NONE = '__none__';

// ---- 顯示對照 ----
const methodLabel = { card:'Card', ach:'ACH', check:'Check', offline:'Offline' };
const statusLabel = { processing:'Processing', confirmed:'Confirmed', failed:'Failed', cancelled:'Cancelled' };

// ═══════════════════════════════════════════════════════════════════
// CB-89  super_admin 代客戶選付款方式 —— 具名常數
// -------------------------------------------------------------------
// 🔴 為何這一段必須存在:payments 的 admin 與 dealer policy 嚴格度不對稱。
//      dealer_insert_own_payments 的 WITH CHECK 綁死
//        status = 'processing' AND payment_method IN ('card','ach','check')
//      admin_insert_payments  的 WITH CHECK 只有 is_admin() —— 零欄位限制。
//    也就是說本路徑寫錯 status 或 payment_method,RLS 會放行、不報錯、
//    畫面顯示成功,而單子外觀已付款、錢從未收到。
//    🔴 這些常數是該情境下的【唯一防線】,不是風格偏好。
//
// 🔴 這是【既有架構限制】(admin 路徑在 DB 層零欄位保護),非 CB-89 造成。
//    已登記:F-162(前端限 super_admin、RLS 對 admin 放行的防護錯覺)、
//            F-163(admin / dealer policy 嚴格度不對稱)。
//    背景見 CB-66 查出的架構事實。
// ═══════════════════════════════════════════════════════════════════

// 代選可用的付款方式 —— 🔴 與 payment.html 的 dealer 選單完全一致,不多不少。
//   payments_payment_method_check 另外允許 'offline',但那是 Record Offline
//   專用(直接推進 Order Processing、不產生 Receipt),🔴 代選一律不可使用。
//   DB 不會擋它 —— 只有這份白名單會。
//   label 刻意不共用上方的 methodLabel:那份是清單表格的短名(Card / ACH),
//   此處要讓 super_admin 看到與 dealer 完全相同的字面(顯示 ≠ 值)。
const PAY_METHOD_OPTIONS = [
  { value: 'card',  label: 'Credit / Debit Card' },
  { value: 'ach',   label: 'ACH Bank Transfer'   },
  { value: 'check', label: 'Check'               },
];

// 代選寫入 payments 時的 status。DB 有 default 'processing',但仍顯式寫入 ——
// 🔴 依賴 default 等於把正確性交給一個 admin policy 不檢查的欄位。
const PAY_STATUS_ON_SELECT = 'processing';

// quotes 狀態:一律用 DB canonical value,不可用顯示名 'Waiting for Payment'。
const QUOTE_STATUS_PENDING            = 'Pending';
const QUOTE_STATUS_PAYMENT_PROCESSING = 'Payment Processing';

// settings 鍵名 —— 🔴 費率三鍵與 payment.html 的 loadFeeConfig() 讀同一份來源。
const PAY_SETTINGS_KEYS = [
  'fee_card_percent',
  'fee_ach_percent',
  'fee_check_percent',
  'notify_admin_new_payment',
  'payment_notify_email',
  'admin_email',
];

// 費率 fallback —— 值與 payment.html L217 的 feeConfig 預設逐字相同。
// ⚠️ 適用範圍僅限「settings 查詢成功但費率鍵缺漏」;查詢整體失敗時走 fail-closed
//    (見 U5 的 Q-10 處理),不套用本 fallback。兩者刻意分層,勿合併。
const PAY_FEE_FALLBACK = { card: 2.99, ach: 1, check: 0 };

// send-payment-email 的 E1a 由此開關 gate。EF 內判定式為 !== 'false',
// 故任何其他值(含鍵不存在)都代表會寄。此處只認這一個關閉值。
const NOTIFY_DISABLED_VALUE = 'false';

// Q-13:DB 端錯誤訊息 → admin 語境映射用的比對字串。
// 🔴 逐字複製自 quotes 的 trg_block_trial_status_change,【一字不可改】——
//    DB 端維持原樣(CB-76 已上線,dealer 路徑仍在用),映射只在前端。
// 🔴 比對一律用【完全相等】,禁止 includes / 正則模糊比對(F-35 正向識別)。
//    認不出的 42501 一律原樣顯示,不猜。
// ⚠️ 該 trigger 第三種訊息('CB-76: dealer % not found ...')帶 uuid 參數,
//    無法完全相等比對 —— 刻意【不映射】,讓它原樣顯示。那是 FK 失效等級的
//    資料庫故障,原文比任何改寫更有助於排查。
const DB_ERR_TRIAL_BLOCKED =
  'Trial accounts cannot submit orders. Contact ProCraft to activate your account.';
const DB_ERR_NO_DEALER_ID =
  'CB-76: quote has no dealer_id — cannot determine account type.';

// ---- helpers ----
function getParam(k) { return new URLSearchParams(window.location.search).get(k); }

function money(v) {
  const n = Number(v || 0);
  return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// ═══════════════════════════════════════════════════════════════════
// CB-89  代選金額計算 —— round2()
// -------------------------------------------------------------------
// 🔴 本函式是 payment.html L234 round2() 的【逐字複製】,
//    刻意【不】採用 CB-72 定版的 toPrecision(15) 實作。
//
// 為什麼刻意不合規(CB-89 Q-14 = M-A,PM 已拍板):
//   理由 —— admin 代選與 dealer 自選必須對同一張單算出【完全相同】的
//           fee_amount。客戶拿到的 Receipt 上印的手續費,不可以因為
//           「是誰按的按鈕」而不同。
//   後果 —— 若此處改用 CB-72 定版,兩條路徑在極少數金額下會差一分錢,
//           而且不報錯、不當機、沒有任何東西會顯示異常。
//           那正是本票 P0-3 交叉註解存在的理由;在本票內引入它等於
//           親手製造要防的東西。
//   🔴 這是【刻意的不一致】,不是疏漏。請勿「順手對齊」成 CB-72 版
//      —— 那個動作正好會製造出這裡要避免的分岔(F-66 §8)。
//
// 🔴 F-165 修正時,三份必須【一起】改,不可分批:
//      payment.html(dealer 自選)
//      admin-payments.html(本處,admin 代選)
//      CB-72 定版所在處
//    分批會產生「兩種寫法混用」的過渡期,屆時無法分辨既有 payments 列
//    是由哪個版本算出的。
// ═══════════════════════════════════════════════════════════════════
function round2(x) { return Math.round((parseFloat(x || 0) + Number.EPSILON) * 100) / 100; }

// CB-89:費率計算 —— 結構與 payment.html 的 computeFee() 逐項對應。
//   回傳 base 亦經 round2,與 dealer 路徑寫入 payments 的值一致。
//   🔴 pct 找不到時回 0 而非拋錯:與 dealer 路徑同行為,避免兩邊分岔。
function computeFeeForSelect(method, base, feeMap) {
  const pct   = (feeMap && feeMap[method] != null) ? feeMap[method] : 0;
  const fee   = round2(base * (pct / 100));
  const total = round2(base + fee);
  return { pct: pct, fee: fee, total: total, base: round2(base) };
}

// CB-89:一次讀齊代選所需的六支 settings。
//   🔴 X-4 分層(Stage 1 定案,勿合併成單一規則):
//     查詢【整體失敗】     → ok:false → 呼叫端 fail-closed 禁用確認鈕。
//                            理由:通知開關未知,不可假設它是開的。
//     查詢成功、費率鍵缺漏 → 套 PAY_FEE_FALLBACK,不阻擋。
//                            理由:與 payment.html loadFeeConfig() 同行為,
//                            兩路徑必須算出相同費率。
//   ⚠️ 此處與 payment.html loadFeeConfig() 的「讀失敗一律寬鬆回落」刻意
//      不一致:費率算錯有 WF1 與人工複核為第二道保險,E1a 沒寄【沒有】
//      第二道保險。請勿為了一致性把本函式改成寬鬆(CB-89 X-3)。
//
//   notifyRecipient 的回落順序【逐字對應】send-payment-email 內
//   handlePaymentSubmitted() 的寫法:
//     settings['payment_notify_email']?.trim() || settings['admin_email'] || 'ben@procraftdc.com'
//   🔴 此處只用於【顯示】收件人給操作者看,不影響實際寄送。
//      EF 那側若調整回落順序,此處必須同步 —— 否則畫面會顯示一個
//      不是真正收件人的信箱,而那比不顯示更糟。
const EF_ADMIN_EMAIL_FALLBACK = 'ben@procraftdc.com';

async function loadPaySettings() {
  try {
    const { data, error } = await _supabase
      .from('settings')
      .select('key, value')
      .in('key', PAY_SETTINGS_KEYS);
    if (error) throw error;

    const map = {};
    (data || []).forEach(function (r) { map[r.key] = r.value; });

    // 費率:三鍵齊備且皆為有效數字才採用,否則整組退回 fallback。
    // 🔴 部分採用會讓三方式的費率來源不一致 —— 全有或全無。
    const parsed = {
      card:  parseFloat(map['fee_card_percent']),
      ach:   parseFloat(map['fee_ach_percent']),
      check: parseFloat(map['fee_check_percent']),
    };
    const feeComplete = [parsed.card, parsed.ach, parsed.check]
      .every(function (v) { return typeof v === 'number' && !isNaN(v); });
    if (!feeComplete) {
      console.warn('[admin-payments] CB-89 fee settings incomplete, using fallback', parsed);
    }

    // 🔴 正向識別:只有【恰好等於】NOTIFY_DISABLED_VALUE 才算關閉。
    //    與 EF 的 !== 'false' 判定式同義,不用 truthy 推斷。
    const notifyEnabled = (map['notify_admin_new_payment'] !== NOTIFY_DISABLED_VALUE);

    const recipient =
      (map['payment_notify_email'] || '').trim() ||
      (map['admin_email'] || '').trim() ||
      EF_ADMIN_EMAIL_FALLBACK;

    return {
      ok:              true,
      fee:             feeComplete ? parsed : PAY_FEE_FALLBACK,
      feeFromFallback: !feeComplete,
      notifyEnabled:   notifyEnabled,
      notifyRecipient: recipient,
    };
  } catch (err) {
    // 🔴 不回落、不猜。ok:false 由呼叫端轉成禁用 + 明確訊息(Q-10)。
    console.error('[admin-payments] CB-89 loadPaySettings failed:', err);
    return { ok: false };
  }
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function fmtDateTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) +
         ', ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

let _toastTimer = null;
function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function () { t.className = 'toast'; }, 3200);
}

// quote / dealer 讀取(join 後)
function quoteOf(p)  { return quoteMap[p.quote_id] || {}; }
function dealerOf(p) { const q = quoteOf(p); return dealerMap[q.dealer_id] || {}; }

// ---- 幽靈成因推導(定案正則,四條全對稱:正記號判定,認不出標 Unknown)----
//   status='failed'    且 failure_reason='Payment timeout (7 days)' → Timeout(WF3 N12 正記號)
//   status='cancelled' 且 cancellation_reason='Method changed'      → Method changed(WF1 N5c 正記號)
//   status='cancelled' 且 reason 非空且≠上者                          → Admin cancelled
//   其餘(含非正記號的 failed)                                        → Unknown(不猜)
function ghostCause(p) {
  if (p.status === 'failed') {
    if ((p.failure_reason || '').trim() === 'Payment timeout (7 days)') return { label: 'Timeout', cls: '' };
  }
  if (p.status === 'cancelled') {
    var reason = (p.cancellation_reason || '').trim();
    if (reason === 'Method changed') return { label: 'Method changed', cls: '' };
    if (reason)                      return { label: 'Admin cancelled', cls: '' };
  }
  return { label: 'Unknown', cls: 'c-unknown' };
}

// ---- 幽靈警示區:未結案幽靈(detected 有值 且 resolved 為空)才 render ----
//   顯示看 resolved_at(非 detected_at):只要 admin 未按 Resolve,不論 alert 發過幾次都留在此區。
function renderGhostBanner() {
  var host = document.getElementById('ghostBanner');
  if (!host) return;

  var ghosts = allPayments.filter(function (p) {
    return p.ghost_detected_at && !p.ghost_resolved_at;
  });
  if (!ghosts.length) { host.innerHTML = ''; return; }   // 無幽靈:維持現狀,不佔位

  var rows = ghosts.map(function (p) {
    var d = dealerOf(p);
    var q = quoteOf(p);
    var cause = ghostCause(p);
    var invId = p.quickbooks_invoice_id || '—';
    var payId = p.quickbooks_payment_id || '—';   // WF3 偵測者可能為 '—'(V7 反查待辦),屬預期
    return '' +
      '<div class="ghost-row">' +
        '<div class="ghost-row-main">' +
          '<span class="ghost-row-dealer">' + escapeHtml(d.company_name || '—') + '</span>' +
          '<span class="ghost-row-po">PO# ' + escapeHtml(q.po_number || '—') + '</span>' +
        '</div>' +
        '<span class="ghost-amount">' + money(p.total_paid) + '</span>' +
        '<span class="ghost-cause ' + cause.cls + '">' + escapeHtml(cause.label) + '</span>' +
        '<div class="ghost-qb">' +
          '<span>Inv <span class="qb-id">' + escapeHtml(invId) + '</span></span>' +
          '<span>Pay <span class="qb-id">' + escapeHtml(payId) + '</span></span>' +
        '</div>' +
        '<button class="ghost-resolve" title="Only records this as manually handled and removes it from the list. Does not refund or modify QuickBooks." onclick="actResolveGhost(\'' + escapeHtml(p.id) + '\')">Resolve</button>' +
      '</div>';
  }).join('');

  host.innerHTML = '' +
    '<div class="ghost-banner">' +
      '<div class="ghost-banner-head">' +
        '<span class="ghost-banner-title"><span class="gb-dot"></span>Ghost Payments</span>' +
        '<span class="ghost-banner-count">' + ghosts.length + ' unresolved</span>' +
      '</div>' +
      '<div class="ghost-banner-sub">' +
        '<strong>These invoices were cancelled or failed, but were paid — the money is in QuickBooks and usually needs to be refunded.</strong>' +
        '<ol class="ghost-steps">' +
          '<li>Use the Inv / Pay ID on each row to find the invoice in QuickBooks and confirm the balance is $0 (payment received).</li>' +
          '<li>Refund the customer manually in QuickBooks.</li>' +
          '<li>Return here and click <strong>Resolve</strong> to record it as handled — this only records it, it does not refund automatically.</li>' +
        '</ol>' +
      '</div>' +
'<div class="ghost-list">' + rows + '</div>' +
    '</div>';
}

// ---- Resolve Ghost Payment ----
//   admin 在 QBO 對帳/退款後,按此記錄「已處理」→ 寫 ghost_resolved_at + note。
//   只寫 payments 稽核欄,不動 quotes(resolve 是稽核標記,非狀態轉移)、不碰 QBO。
function actResolveGhost(paymentId) {
  const p = allPayments.find(function (x) { return x.id === paymentId; });
  if (!p) { showToast('Payment not found. Please refresh.', true); return; }
  const ph = 'e.g. Refunded ' + money(p.total_paid) + ' in QuickBooks';
  openActionModal({
    title: 'Resolve Ghost Payment',
    sub: 'Mark this as handled after you have reconciled or refunded it in QuickBooks. This only records that it was resolved — it does not refund or modify QuickBooks.',
    fieldsHtml:
      '<div class="modal-field"><label>Resolution Note (optional)</label>' +
      '<textarea id="amGhostNote" placeholder="' + escapeHtml(ph) + '"></textarea></div>',
    confirmLabel: 'Mark as Resolved',
    danger: false,
    onConfirm: async function () {
      const note = (document.getElementById('amGhostNote').value || '').trim();
      const upd = await _supabase.from('payments')
        .update({
          ghost_resolved_at: new Date().toISOString(),
          ghost_resolution_note: note || null,
        }, { count: 'exact' })
        .eq('id', paymentId);
      if (upd.error) throw upd.error;
      if (upd.count === 0) throw new Error("Couldn't mark this payment resolved (0 rows). 狀態可能不一致,請人工核對。");
      showToast('Ghost payment resolved.');
      return true;
    },
    onDone: async function () {
      try {
        await loadData();
        renderList(allPayments);
        renderGhostBanner();
      } catch (err) {
        console.error('[admin-payments] refresh after resolve failed:', err);
        showToast('Resolved, but refresh failed. Please reload.', true);
      }
    },
  });
}

// Init:權限 gate + router
// ════════════════════════════════════════════════════════════════════
(async function init() {
  // 1) 未登入 → login
  const { data: { session } } = await _supabase.auth.getSession();
  if (!session) { window.location.href = 'login.html'; return; }

  // 2) F9:本頁限 super_admin(涉及金流管理)。未授權者按 role 分流 redirect,
  //    避免把一般 admin 丟到 dealer 端的 dashboard.html。
  //    ⚠️ 前端 gate 是 UX 保護,不是安全邊界 —— 實際資料權限由 Supabase RLS 決定。
  const { data: me } = await _supabase.from('dealers').select('role').eq('id', session.user.id).single();
  const role = me && me.role;
  if (role !== 'super_admin') {
    if (!role)                 window.location.href = 'login.html?error=session_expired';
    else if (role === 'admin') window.location.href = 'admin.html';
    else                       window.location.href = 'dashboard.html';
    return;
  }

  // CB-38:記下當前使用者,供 Sales filter 的 "My Dealers" 使用
  currentUserId = session.user.id;

  // 3) router:有 payment_id → 詳情;否則 → 列表
  const pid = getParam('payment_id');
  if (pid) {
    showDetail(pid);
  } else {
    showList();
  }
})();

// ════════════════════════════════════════════════════════════════════
// 資料載入:三段分開撈、client join(零 embed 依賴)
//   ① payments 全撈(created_at DESC)
//   ② 依 quote_id 撈 quotes
//   ③ 依 quotes.dealer_id 撈 dealers
// ════════════════════════════════════════════════════════════════════
async function loadData() {
  const { data: payments, error: pErr } = await _supabase
    .from('payments')
    .select('*')
    .order('created_at', { ascending: false });
  if (pErr) throw pErr;
  allPayments = payments || [];

  // quotes
  quoteMap = {};
  const quoteIds = Array.from(new Set(allPayments.map(function (p) { return p.quote_id; }).filter(Boolean)));
  if (quoteIds.length) {
    const { data: quotes, error: qErr } = await _supabase
      .from('quotes')
      .select('id, po_number, job_name, grand_total, status, dealer_id')
      .in('id', quoteIds);
    if (qErr) throw qErr;
    (quotes || []).forEach(function (q) { quoteMap[q.id] = q; });
  }

  // dealers
  dealerMap = {};
  const dealerIds = Array.from(new Set(Object.values(quoteMap).map(function (q) { return q.dealer_id; }).filter(Boolean)));
  if (dealerIds.length) {
    const { data: dealers, error: dErr } = await _supabase
      .from('dealers')
      .select('id, company_name, contact_name, email, assigned_sales_id')
      .in('id', dealerIds);
    if (dErr) throw dErr;
    (dealers || []).forEach(function (d) { dealerMap[d.id] = d; });
  }
}

// ════════════════════════════════════════════════════════════════════
// CB-38:Sales filter
//   dealerMap 只含「有 payment 的 dealer」,不含 admin 帳號,
//   因此 Sales 名單必須獨立查詢。
// ════════════════════════════════════════════════════════════════════
async function loadSalesList() {
  const { data, error } = await _supabase
    .from('dealers')
    .select('id, contact_name, email, role')
    .in('role', ['admin', 'super_admin'])
    .order('contact_name');

  if (error) {
    console.error('[CB-38] loadSalesList failed:', error);
    salesList = [];
    return;
  }
  salesList = data || [];
  salesNameMap = {};
  salesList.forEach(function (s) { salesNameMap[s.id] = s; });
}

// CB-38.1:列表 Sales 欄。salesNameMap 只含 admin/super_admin,
// 查不到 = 該 id 已不是 admin(Q10 情境)或已被刪除。
function renderSalesCell(id) {
  if (!id) return '<span class="td-unassigned">Unassigned</span>';
  const r = salesNameMap[id];
  if (!r) return '<span class="td-unassigned">(inactive)</span>';
  return escapeHtml(r.contact_name || '(no name)');
}

// 選項順序:My Dealers / All Sales / Unassigned / 各 admin
// 本頁限 super_admin,default 恆為 All Sales('')。
function buildSalesFilter() {
  if (_salesFilterBuilt) return;   // showList() 可能被多次呼叫
  const sel = document.getElementById('filterSales');
  sel.innerHTML = '';

  const add = function (value, label) {
    const opt = document.createElement('option');
    opt.value = value; opt.textContent = label;
    sel.appendChild(opt);
  };

  add(SALES_ME,   'My Dealers');
  add('',         'All Sales');
  add(SALES_NONE, 'Unassigned');
  salesList.forEach(function (s) { add(s.id, salesLabel(s)); });

  sel.value = '';
  _salesFilterBuilt = true;
}

// Q7:contact_name (email)
function salesLabel(s) {
  const name = (s && s.contact_name) ? s.contact_name : '(no name)';
  return (s && s.email) ? (name + ' (' + s.email + ')') : name;
}

// 判斷某個 assigned_sales_id 是否符合目前 Sales filter。
// val 為空 = All Sales(恆為 true)。
function salesMatches(assignedId, val) {
  if (!val) return true;
  if (val === SALES_NONE) return !assignedId;
  const target = (val === SALES_ME) ? currentUserId : val;
  return assignedId === target;
}

// ════════════════════════════════════════════════════════════════════
// 列表頁
// ════════════════════════════════════════════════════════════════════
async function showList() {
  document.getElementById('detail-view').style.display = 'none';
  document.getElementById('list-view').style.display = 'block';

  // 綁定 filter 按鈕(只綁一次)
  document.getElementById('btnFilter').onclick = applyFilters;
  document.getElementById('btnReset').onclick  = resetFilters;
  document.getElementById('filterSearch').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') applyFilters();
  });

  try {
    await loadData();
    await loadSalesList();   // CB-38:Sales 名單需獨立查詢
    buildSalesFilter();      // CB-38:內建 _salesFilterBuilt 防重複 append
    renderList(allPayments);
    renderGhostBanner();
  } catch (err) {
    console.error('[admin-payments] loadData failed:', err);
    document.getElementById('listBody').innerHTML =
      '<tr><td colspan="7" class="td-empty">Failed to load payments. Please refresh.</td></tr>';
    document.getElementById('listCount').textContent = '—';
    showToast('Failed to load payments.', true);
  }

  // Awaiting Payment 區:搜尋(只綁一次)+ 載入
  document.getElementById('awaitingSearch').oninput = function (e) { renderAwaiting(e.target.value); };
  try {
    await loadAwaiting();
    renderAwaiting('');
  } catch (err) {
    console.error('[admin-payments] loadAwaiting failed:', err);
    document.getElementById('awaitingBody').innerHTML =
      '<tr><td colspan="6" class="td-empty">Failed to load awaiting quotes.</td></tr>';
    document.getElementById('awaitingCount').textContent    = '—';
    document.getElementById('awaitingCountNoun').textContent = 'Quotes';
  }
}

function applyFilters() {
  const st     = document.getElementById('filterStatus').value;
  const mt     = document.getElementById('filterMethod').value;
  const sl     = document.getElementById('filterSales').value;   // CB-38
  const from   = document.getElementById('filterFrom').value;   // yyyy-mm-dd or ''
  const to     = document.getElementById('filterTo').value;
  const search = document.getElementById('filterSearch').value.trim().toLowerCase();

  const fromTs = from ? new Date(from + 'T00:00:00').getTime() : null;
  const toTs   = to   ? new Date(to   + 'T23:59:59').getTime() : null;

  const rows = allPayments.filter(function (p) {
    if (st && p.status !== st) return false;
    if (mt && p.payment_method !== mt) return false;

    // CB-38:payment → quote → dealer → assigned_sales_id
    if (sl && !salesMatches(dealerOf(p).assigned_sales_id, sl)) return false;

    if (fromTs || toTs) {
      const ts = p.created_at ? new Date(p.created_at).getTime() : 0;
      if (fromTs && ts < fromTs) return false;
      if (toTs && ts > toTs) return false;
    }

    if (search) {
      const q  = quoteOf(p);
      const d  = dealerOf(p);
      const po = (q.po_number || '').toLowerCase();
      const cn = (d.company_name || '').toLowerCase();
      if (po.indexOf(search) === -1 && cn.indexOf(search) === -1) return false;
    }
    return true;
  });

  renderList(rows);
  renderAwaiting(_awaitingTerm);   // CB-38 Q4:上方 Awaiting 區塊同步套用 Sales filter
}

function resetFilters() {
  document.getElementById('filterStatus').value = '';
  document.getElementById('filterMethod').value = '';
  document.getElementById('filterFrom').value   = '';
  document.getElementById('filterTo').value     = '';
  document.getElementById('filterSearch').value = '';
  // CB-38 Q3:本頁限 super_admin,default 恆為 All Sales
  document.getElementById('filterSales').value  = '';
  renderList(allPayments);
  renderAwaiting(_awaitingTerm);   // CB-38 Q4
}

// CB-38 Q6:payments 列表空結果文案(Sales 情境優先於通用訊息)
function listEmptyMessage() {
  const el = document.getElementById('filterSales');
  const sl = el ? el.value : '';
  if (sl === SALES_ME)   return 'No payments from your dealers.';
  if (sl === SALES_NONE) return 'No payments from unassigned dealers.';
  if (sl)                return 'No payments from this sales\u2019 dealers.';
  return 'No payments match your filters.';
}

function renderList(rows) {
  const body = document.getElementById('listBody');
  document.getElementById('listCount').textContent =
    rows.length + (rows.length === 1 ? ' payment' : ' payments');

  if (!rows.length) {
    body.innerHTML = '<tr><td colspan="7" class="td-empty">' + listEmptyMessage() + '</td></tr>';
    return;
  }

  body.innerHTML = rows.map(function (p) {
    const q  = quoteOf(p);
    const d  = dealerOf(p);
    const sc = 's-' + (p.status || '');
    return '<tr>' +
      '<td>' + escapeHtml(q.po_number || '—') +
        (q.job_name ? '<div class="td-dealer-sub">' + escapeHtml(q.job_name) + '</div>' : '') + '</td>' +
      '<td><div class="td-dealer">' + escapeHtml(d.company_name || '—') + '</div>' +
        '<div class="td-dealer-sub">' + escapeHtml(d.contact_name || '') + '</div></td>' +
      '<td class="td-sales">' + renderSalesCell(d.assigned_sales_id) + '</td>' +
      '<td><span class="method-label">' + escapeHtml(methodLabel[p.payment_method] || p.payment_method || '—') + '</span></td>' +
      '<td>' + money(p.total_paid) + '</td>' +
      '<td><span class="pay-badge ' + sc + '">' + escapeHtml(statusLabel[p.status] || p.status || '—') + '</span>' +
        '<div class="td-dealer-sub">' + escapeHtml(fmtDate(p.created_at)) + '</div></td>' +
      '<td><a class="btn-view" href="admin-payments.html?payment_id=' + encodeURIComponent(p.id) + '">View</a></td>' +
'</tr>';
  }).join('');
}

// ════════════════════════════════════════════════════════════════════
// Awaiting Payment(quotes: status='Pending',尚無 payment 列)
//   排序與「已等待天數」同源 admin_notified_at ASC(等最久排最上;NULL 墊底、顯示 —;近似值)。
//   列動作複用 picker 的 Offline/Reminder 表單(pickerSelected + #pickerModal)。
// ════════════════════════════════════════════════════════════════════
let awaitingQuotes  = [];
let awaitingDealers = {};
let _awaitingTerm   = '';

async function loadAwaiting() {
  const { data: quotes, error } = await _supabase
    .from('quotes')
    .select('id, po_number, job_name, grand_total, dealer_id, admin_notified_at')
    .eq('status', 'Pending')
    .order('admin_notified_at', { ascending: true, nullsFirst: false });   // 等最久排最上;NULL 墊底
  if (error) throw error;
  awaitingQuotes = quotes || [];

  awaitingDealers = {};
  const ids = Array.from(new Set(awaitingQuotes.map(function (q) { return q.dealer_id; }).filter(Boolean)));
  if (ids.length) {
    const { data: dealers, error: dErr } = await _supabase
      .from('dealers').select('id, company_name, assigned_sales_id').in('id', ids);
    if (dErr) throw dErr;
    (dealers || []).forEach(function (d) { awaitingDealers[d.id] = d; });
  }
}

function waitingDays(iso) {
  if (!iso) return null;
  const t = new Date(iso).getTime();
  if (isNaN(t)) return null;
  return Math.max(0, Math.floor((Date.now() - t) / 86400000));
}

// CB-38 Q6:Awaiting 區空結果文案。區分「無資料」「搜尋無果」「Sales 過濾無果」。
function awaitingEmptyMessage(term, sl) {
  if (!awaitingQuotes.length) return 'No quotes awaiting payment.';
  if (term) return 'No quotes match your search.';
  if (sl === SALES_ME)   return 'No quotes awaiting payment from your dealers.';
  if (sl === SALES_NONE) return 'No quotes awaiting payment from unassigned dealers.';
  if (sl)                return 'No quotes awaiting payment from this sales\u2019 dealers.';
  return 'No quotes awaiting payment.';
}

function renderAwaiting(term) {
  _awaitingTerm = term || '';
  const t  = _awaitingTerm.trim().toLowerCase();
  const sl = document.getElementById('filterSales').value;   // CB-38 Q4

  const rows = awaitingQuotes.filter(function (q) {
    const d = awaitingDealers[q.dealer_id] || {};
    // CB-38 Q4:與下方 payments 列表共用同一個 Sales filter
    if (sl && !salesMatches(d.assigned_sales_id, sl)) return false;
    if (!t) return true;
    return (q.po_number || '').toLowerCase().indexOf(t) !== -1
        || (d.company_name || '').toLowerCase().indexOf(t) !== -1;
  });

  // CB-56 U10:數量移進標題 —— 「11 Quotes Waiting for Payment」。
  // 分兩個 textContent 寫入(不用 innerHTML),data-pc-status-label 的
  // 水合標記才不會被覆蓋掉。
  document.getElementById('awaitingCount').textContent    = rows.length;
  document.getElementById('awaitingCountNoun').textContent = (rows.length === 1 ? 'Quote' : 'Quotes');

  const body = document.getElementById('awaitingBody');
  if (!rows.length) {
    body.innerHTML = '<tr><td colspan="6" class="td-empty">' +
      awaitingEmptyMessage(t, sl) + '</td></tr>';
    return;
  }
  body.innerHTML = rows.map(function (q) {
    const d = awaitingDealers[q.dealer_id] || {};
    const days = waitingDays(q.admin_notified_at);
    const daysStr = (days == null) ? '—' : ('~' + days + (days === 1 ? ' day' : ' days'));
    return '<tr>' +
      '<td>' + escapeHtml(q.po_number || '(no PO#)') +
        (q.job_name ? '<div class="td-dealer-sub">' + escapeHtml(q.job_name) + '</div>' : '') + '</td>' +
      '<td class="td-dealer">' + escapeHtml(d.company_name || '—') + '</td>' +
      '<td class="td-sales">' + renderSalesCell(d.assigned_sales_id) + '</td>' +
      '<td>' + money(q.grand_total) + '</td>' +
      '<td><span class="await-wait">' + daysStr + '</span></td>' +
      '<td><div class="await-actions">' +
        // CB-89:代選付款方式。刻意排在第一順位 —— 它是【常態】動作
        //   (客戶要走完流程拿 Receipt),Record Offline 才是例外(錢已收到、
        //   不需 Receipt)。兩者後果差很多但外觀相近,把常態的放前面可降低誤觸。
        '<button class="btn-mini" onclick="awaitingSelectMethod(\'' + q.id + '\')">Select Payment Method</button>' +
        '<button class="btn-mini" onclick="awaitingOffline(\'' + q.id + '\')">Record Offline</button>' +
        '<button class="btn-mini" onclick="awaitingResend(\'' + q.id + '\')">Send Reminder</button>' +
        '<button class="btn-mini danger" onclick="awaitingClose(\'' + q.id + '\')">Close Order</button>' +
      '</div></td>' +
    '</tr>';
  }).join('');
}

// 列動作:設定 pickerSelected → 開既有 Offline/Reminder 表單(邏輯複用,契約一致)
function awaitingOffline(id) {
  pickerSelected = awaitingQuotes.find(function (q) { return q.id === id; }) || null;
  if (!pickerSelected) return;
  document.getElementById('pickerModal').classList.add('show');
  pickerOffline();
}

function awaitingResend(id) {
  pickerSelected = awaitingQuotes.find(function (q) { return q.id === id; }) || null;
  if (!pickerSelected) return;
  document.getElementById('pickerModal').classList.add('show');
  pickerResend();
}

// ═══════════════════════════════════════════════════════════════════
// CB-89  super_admin 代客戶選付款方式
// -------------------------------------------------------------------
// 業務情境:客戶人在 office,直接把卡交給 sales。理論流程是客戶自己登入
//   payment.html 選方式,但他不會為了這件事掏出手機登入。
// 🔴 為何不能走捷徑直接推到 Order Processing:客戶要的是標示手續費的
//   Receipt,而那張只有走完 portal 付款流程才會產生。
//
// 🔴 與同區「Record Offline」的差別 —— 兩顆鈕長得像,結果完全不同:
//     Record Offline        Pending → Order Processing,payment 直接 confirmed
//                           【不產生 Receipt】,用於錢已經收到的離線付款。
//     Select Payment Method Pending → Payment Processing,payment 為 processing
//                           走完整流程,會產生 Receipt。本函式。
//   用錯不會報錯 —— 單子照樣前進,只是客戶永遠等不到 Receipt。
//
// 寫入規格來源:Payment PM(CB-89)。dealer 側對應實作在
//   payment.html 的 submitSimplifiedPayment()。🔴 兩處必須同步維護。
// ═══════════════════════════════════════════════════════════════════

// 代選待確認狀態 —— openActionModal 的 onConfirm 需要它。
// 每次開啟 modal 時整個覆寫,不累加。
let cb89Pending = null;   // { quote, settings, feeByMethod }

// modal 內的 radio / checkbox 變動時呼叫(fieldsHtml 以 inline onchange 綁定,
// 與本檔既有的 inline onclick 慣例一致)。
// 🔴 正向識別:必須【同時】選了方式且勾了確認,才啟用 Confirm。
//    任一缺席即禁用 —— 不用 toggle、不用反向條件。
function cb89SyncConfirm() {
  const btn = document.getElementById('amConfirm');
  if (!btn) return;
  const picked  = document.querySelector('input[name="cb89pm"]:checked');
  const ackEl   = document.getElementById('cb89Ack');
  const checked = !!(ackEl && ackEl.checked);
  btn.disabled = !(picked && checked);
}

// 阻擋畫面(Q-10)—— 不渲染任何付款方式選項,Confirm 恆為禁用。
// 🔴 兩種成因用兩段【不同】的文字:成因不同、處置不同,不可長成同一句(F-35)。
function cb89BlockedHtml(reason) {
  const text = (reason === 'notify_off')
    ? 'Admin payment notifications are turned off, so no one would be told to create the QuickBooks invoice. This is a settings issue — not something you did wrong. Please turn notifications back on before using this action.'
    : 'The notification settings could not be read, so this action is blocked. This is a settings or connection issue — not something you did wrong. Please refresh and try again.';
  return '<div class="modal-error show" style="margin-bottom:0;">' + escapeHtml(text) + '</div>';
}

// Q-13:DB 端 42501 錯誤 → admin 語境訊息。
// 🔴 DB 那側【一字不改】—— CB-76 已上線,dealer 路徑仍在用那些文字。
//    admin 看到「Contact ProCraft to activate your account」會困惑:他就是 ProCraft。
// 🔴 正向識別(F-35):code 必須是 '42501',且訊息【完全相等】。
//    禁止 includes / 正則模糊比對 —— 認不出的一律原樣回傳,不猜。
//    ⚠️ 該 trigger 第三種訊息帶 uuid 參數,無法完全相等比對,刻意不映射:
//       那是 FK 失效等級的故障,原文比任何改寫更有助於排查。
function cb89MapDbError(err) {
  const raw = (err && err.message) ? String(err.message) : '';
  if (err && err.code === '42501') {
    if (raw === DB_ERR_TRIAL_BLOCKED) {
      return 'This dealer account is on a trial plan, so its orders cannot be advanced. Activate the account first.';
    }
    if (raw === DB_ERR_NO_DEALER_ID) {
      return 'This order has no dealer assigned and cannot be advanced. Please report this to the developer.';
    }
  }
  return raw || 'Action failed. Please try again.';
}

async function awaitingSelectMethod(id) {
  const q = awaitingQuotes.find(function (x) { return x.id === id; }) || null;
  if (!q) { showToast('Order not found. Please refresh.', true); return; }

  // 🔴 Q-10:寫入【之前】預檢。E1a 是 gated 的,而 send-payment-email 回傳的
  //    sent 是 E1a + E1b 的合計 —— 開關被關時 dealer 信照寄,sent 仍 >= 1,
  //    事後判不出 E1a 沒寄。故必須在動作前擋,不能等做完才發現。
  const st = await loadPaySettings();

  const d      = awaitingDealers[q.dealer_id] || {};
  const base   = parseFloat(q.grand_total || 0);
  const blocked = (!st.ok) ? 'read_fail' : (!st.notifyEnabled ? 'notify_off' : null);

  // 費率表:阻擋時不計算(也不顯示選項)。
  const feeByMethod = {};
  if (!blocked) {
    PAY_METHOD_OPTIONS.forEach(function (o) {
      feeByMethod[o.value] = computeFeeForSelect(o.value, base, st.fee);
    });
  }

  cb89Pending = blocked ? null : { quote: q, settings: st, feeByMethod: feeByMethod };

  let fields = '' +
    '<div class="modal-field">' +
      '<label>Order</label>' +
      '<div style="font-size:13px;color:var(--text);">' +
        escapeHtml(q.po_number || '(no PO#)') +
        (q.job_name ? ' — ' + escapeHtml(q.job_name) : '') +
        '<div style="font-size:12px;color:var(--muted);margin-top:3px;">' +
          escapeHtml(d.company_name || '—') + ' &nbsp;·&nbsp; Order Total ' + money(base) +
        '</div>' +
      '</div>' +
    '</div>';

  if (blocked) {
    fields += cb89BlockedHtml(blocked);
  } else {
    // 付款方式 —— 🔴 選項與費率皆來自單一來源(PAY_METHOD_OPTIONS + settings),
    //    與 dealer 端讀同一組 settings 鍵。此處不得硬寫任何費率數字。
    // 🔴 樣式一律走 .cb89-* class,不用 inline style:選項是 <label>,會繼承
    //    .modal-field label 的 uppercase 與 0.15em 字距。重置寫在 CSS 那側,
    //    改回 inline style 就會把繼承問題帶回來(CB-89 U10)。
    fields += '<div class="modal-field"><label>Payment Method</label>';
    PAY_METHOD_OPTIONS.forEach(function (o) {
      const f = feeByMethod[o.value];
      fields += '' +
        '<label class="cb89-opt">' +
          '<input type="radio" name="cb89pm" value="' + escapeHtml(o.value) + '" onchange="cb89SyncConfirm()"/>' +
          '<span>' +
            '<span class="cb89-opt-name">' + escapeHtml(o.label) + '</span>' +
            '<span class="cb89-opt-fee">' +
              'Transaction Fee (' + escapeHtml(String(f.pct)) + '%): ' + money(f.fee) +
              ' &nbsp;·&nbsp; Total to Pay: ' + money(f.total) +
            '</span>' +
          '</span>' +
        '</label>';
    });
    fields += '</div>';

    // 費率來源透明化:走 fallback 時明說,不靜默。
    if (st.feeFromFallback) {
      fields += '<div class="cb89-note">Fee rates could not be read from settings; showing default rates.</div>';
    }

    // 🔴 正向顯示收件人 —— 讓操作者當場看到 E1a 會寄到哪,而不是假設它會寄。
    fields += '<div class="cb89-note">A New Payment Submitted notification will be sent to ' +
      '<strong style="color:var(--text);">' + escapeHtml(st.notifyRecipient) + '</strong>.</div>';

    // 確認勾選(CB-89 Q-15 = 合併版)。防手滑 + 儀式性提醒,純前端,不留紀錄。
    fields += '' +
      '<label class="cb89-ack">' +
        '<input type="checkbox" id="cb89Ack" onchange="cb89SyncConfirm()"/>' +

// 分派 —— 刻意複用既有的 awaitingOffline / awaitingResend / awaitingClose,
//   不重寫任何一條路徑,行為與四顆鈕時期完全相同。
// 🔴 select / close 走 #actionModal,必須先關掉 #pickerModal,
//    否則兩層 overlay 疊加,下層的點擊區會蓋住上層。
function cb89MenuPick(action, id) {
  if (action === 'offline') { awaitingOffline(id); return; }   // 同一個 modal 內換內容
  if (action === 'remind')  { awaitingResend(id); return; }
  closePendingPicker();
  if (action === 'select')  { awaitingSelectMethod(id); return; }
  if (action === 'close')   { awaitingClose(id); return; }
}

// 代選寫入 —— openActionModal 的 onConfirm。
// -------------------------------------------------------------------
// 🔴 寫入順序(P0-2,與 payment.html submitSimplifiedPayment() 同序):
//      ① UPDATE quotes(只寫 status 一欄 + Pending 前態守衛 + count:'exact')
//      ② INSERT payments
//      ③ E1a
//    順序不可顛倒 —— 先寫 payments 再更新 quotes,一旦 quotes 失敗就留下孤兒列。
//
// 🔴 為何 UPDATE 只帶 status 一欄(CB-89 Q-12):
//    【不是】因為 F2 要求。S-3 已查證 trg_enforce_dealer_quote_transition 在
//    auth.uid() <> OLD.dealer_id 時直接放行,super_admin 不受整列凍結拘束。
//    真正理由是爆炸半徑最小:不碰任何金額欄位,自動避開 CB-70 新增的三個
//    調整項(account_credit / manager_discount / handling_fee)。
//    updated_at 有 DB default,不需手動帶。
//
// 🔴 count:'exact' + .eq('status', Pending) 是唯一的併發與前態防線:
//    RLS 擋下的 UPDATE 會回 200 與空結果,「被擋」與「真的沒資料」在應用層
//    無法區分 —— 只能靠 row-count,不可靠「沒有 error」。
// -------------------------------------------------------------------
async function doAwaitingSelectMethod() {
  if (!cb89Pending) {
    amShowError('This action is not ready. Please close this window and try again.');
    return false;
  }

  const picked = document.querySelector('input[name="cb89pm"]:checked');
  const ackEl  = document.getElementById('cb89Ack');
  if (!picked || !ackEl || !ackEl.checked) {
    amShowError('Please choose a payment method and tick the confirmation box.');
    return false;
  }

  const method = picked.value;

  // 🔴 縱深防禦:DOM 可被竄改,而 admin_insert_payments 的 WITH CHECK 只有
  //    is_admin() —— payment_method 寫成 'offline' 時 DB 會照單全收(F-163)。
  //    白名單在此再驗一次,不信任畫面送上來的值。
  const allowed = PAY_METHOD_OPTIONS.some(function (o) { return o.value === method; });
  const f = cb89Pending.feeByMethod[method];
  if (!allowed || !f) {
    amShowError('That payment method is not available here. Please close this window and try again.');
    return false;
  }

  const q = cb89Pending.quote;

  // ── ① UPDATE quotes ────────────────────────────────────────────────
  const upd = await _supabase.from('quotes')
    .update({ status: QUOTE_STATUS_PAYMENT_PROCESSING }, { count: 'exact' })
    .eq('id', q.id)
    .eq('status', QUOTE_STATUS_PENDING);

  if (upd.error) {
    amShowError(cb89MapDbError(upd.error));
    return false;
  }
  if (upd.count === 0) {
    // 尚未建立 payment 列 —— 中止是乾淨的,不留孤兒。
    amShowError('This order is no longer Pending — its status was changed by someone else. Nothing was saved. 請重新整理後再試。');
    return false;
  }

  // ── ② INSERT payments ──────────────────────────────────────────────
  //    status 與 payment_method 皆走具名常數。金額四欄全部來自 computeFeeForSelect,
  //    與 dealer 路徑同一套 round2 —— 同一張單不論誰操作,fee_amount 必須相同。
  //    quickbooks_* / check_image_url / confirmed_* / cancelled_* 刻意不寫(留 NULL),
  //    與 dealer 路徑一致;submitted_at / created_at / updated_at 走 DB default。
  const ins = await _supabase.from('payments')
    .insert({
      quote_id:       q.id,
      payment_method: method,
      base_amount:    f.base,
      fee_percentage: f.pct,
      fee_amount:     f.fee,
      total_paid:     f.total,
      status:         PAY_STATUS_ON_SELECT,
    })
    .select('id')
    .single();

  if (ins.error) {
    // 🔴 quotes 已推進且【不回滾】。必須明示狀態不一致,且不得出現任何成功字樣。
    //    刻意關閉 modal 而非留在原地:留著會誘使重試,而重試必然撞上
    //    count===0 的「不再是 Pending」訊息 —— 那會把「狀態不一致」
    //    誤導成「別人改過了」,兩件完全不同的事。
    console.error('[admin-payments] CB-89 payments insert failed:', ins.error);
    window.alert(
      'The order advanced to Payment Processing, but the payment record was NOT created.\n\n' +
      'PO# ' + (q.po_number || '(no PO#)') + '\n' +
      'Reason: ' + cb89MapDbError(ins.error) + '\n\n' +
      'The order status and the payment records are now inconsistent. Please check this order manually before doing anything else. Do not repeat this action.'
    );
    cb89Pending = null;
    return true;
  }

  // ── ③ E1a ──────────────────────────────────────────────────────────
  //    🔴 寫入已成功。此後不論寄信結果如何,都【不可】把整個動作講成失敗(X-1)。
  //       三態訊息一律以 "Payment method saved." 開頭,再說通知的狀況。
  const mailed = await sendPaymentEmailStrict({
    type:       'payment_submitted',
    quote_id:   q.id,
    payment_id: ins.data.id,
  });

  if (mailed === 'ok') {
    showToast('Payment method saved. Notification sent.');
  } else if (mailed === 'skipped') {
    // Q-11:CB-76 對 location 帳號全域停信,E1a 必然不寄。
    // 🔴 訊息要說【該做什麼】,不只是說發生了什麼。
    window.alert(
      'Payment method saved.\n\n' +
      'PO# ' + (q.po_number || '(no PO#)') + '\n\n' +
      'This dealer account has email notifications disabled, so no notification was sent. ' +
      'Please tell accounting to create the QuickBooks invoice manually.'
    );
  } else {
    // 🔴 非原子:EF 先寄 E1a 再寄 E1b,任一失敗整體回 500。
    //    故此處【不可】寫「未寄出」—— 只能說無法確認。
    window.alert(
      'Payment method saved.\n\n' +
      'PO# ' + (q.po_number || '(no PO#)') + '\n\n' +
      'The notification email could not be confirmed as sent. ' +
      'Please tell accounting to create the QuickBooks invoice manually.'
    );
  }

  cb89Pending = null;
  return true;
}

// CB-57:Close Pending Order(super_admin only,終態 Cancelled,不可逆)。
//   走既有 openActionModal 確認彈窗。寫序 quotes(Pending 守衛 + count:exact)
//   先 → payments 後。onDone 傳 refreshAll,避免 wireActionModal fallback 去
//   showDetail(stale pid)(B5)。
function awaitingClose(id) {
  const q = awaitingQuotes.find(function (x) { return x.id === id; }) || null;
  if (!q) return;
  openActionModal({
    title: 'Close Order (Cancel)',
    sub: 'PO# ' + (q.po_number || '(no PO#)') + ' will be permanently cancelled and the dealer notified. This cannot be undone.',
    fieldsHtml: '',
    confirmLabel: 'Close Order',
    danger: true,
    onDone: refreshAll,
    onConfirm: async function () {
      // ① quotes → Cancelled(Pending 守衛 + count:exact)。
      //    affected===0 → 單已不在 Pending → 立即中止,不碰 payment。
      const upd = await _supabase.from('quotes')
        .update({ status: 'Cancelled' }, { count: 'exact' })
        .eq('id', q.id)
        .eq('status', 'Pending');
      if (upd.error) throw upd.error;
      if (upd.count === 0) {
        amShowError("This order is no longer Pending — its status was changed by someone else. Nothing was cancelled. 請重新整理後再試。");
        return false;
      }

      // ② pre-SELECT 候選 payment 列(B9,唯讀):存 invoice id 供錯誤文案。
      //    候選為空 = 無 invoice = 純狀態 close → 整段跳過(B1/B8:count 0 正常,不 throw)。
      const cand = await _supabase.from('payments')
        .select('id, quickbooks_invoice_id')
        .eq('quote_id', q.id)
        .eq('status', 'processing')
        .not('quickbooks_invoice_id', 'is', null);
      if (cand.error) throw cand.error;

      // ③ 有 invoice → 標 cancelled(cancelled_at 必寫,A1 教訓:漏寫則 Void Cleanup 抓不到)。
      let cleanupFailedInvoices = '';
      if (cand.data && cand.data.length) {
        const updP = await _supabase.from('payments')
          .update({
            status:              'cancelled',
            cancelled_at:        new Date().toISOString(),
            cancelled_by:        currentUserId,
            cancellation_reason: 'Order cancelled by admin (Pending close)',
          }, { count: 'exact' })
          .eq('quote_id', q.id)
          .eq('status', 'processing')
          .not('quickbooks_invoice_id', 'is', null);

        // Q1:部分 commit 錯誤 —— quote 已 Cancelled 不回滾。記下 invoice id,稍後 alert
        //     指向 QBO 人工核對(避免退化成靜默的活 invoice)。不 return —— 見 ④。
        if (updP.error || updP.count === 0) {
          cleanupFailedInvoices = cand.data
            .map(function (r) { return r.quickbooks_invoice_id; })
            .filter(Boolean).join(', ');
        }
      }

      // ④ 通知 dealer(非阻斷)。order 已取消,dealer 一律通知,與 invoice 清理成敗無關。
      //    send-followup-email 內部重撈驗 status==='Cancelled'。
      await sendFollowupEmail({ notification_type: 'order_cancelled', quote_id: q.id });

      // ⑤ 若 payment/invoice 清理失敗 → alert admin 去 QBO 手動核對(dealer 已另行通知)。
      if (cleanupFailedInvoices) {
        window.alert(
          "Order was cancelled and the dealer notified, but the payment/invoice cleanup FAILED.\n\n" +
          "Please open QuickBooks and manually check whether these invoices need voiding:\n" +
          cleanupFailedInvoices + "\n\n(The order is already Cancelled and cannot be rolled back.)"
        );
      } else {
        showToast('Order cancelled.');
      }
      return true;
    }
  });
}

// 動作成功後同時刷新兩區(Payment Records + Awaiting)
async function refreshAll() {
  await loadData(); applyFilters();
  await loadAwaiting(); renderAwaiting(_awaitingTerm);
}

async function showDetail(paymentId) {
  document.getElementById('list-view').style.display = 'none';
  const view = document.getElementById('detail-view');
  view.style.display = 'block';
  view.innerHTML = '<div class="msg-block">Loading…</div>';

  try {
    await loadDetail(paymentId);
    renderDetail();
  } catch (err) {
    console.error('[admin-payments] loadDetail failed:', err);
    view.innerHTML =
      '<a class="back-link" href="admin-payments.html">← Back to Payments</a>' +
      '<div class="msg-block">Failed to load this payment. It may not exist, or please refresh.</div>';
  }
}

async function loadDetail(paymentId) {
  // 1) 這筆 payment
  const { data: pay, error: pErr } = await _supabase
    .from('payments').select('*').eq('id', paymentId).single();
  if (pErr) throw pErr;
  detailPayment = pay;

  // 2) 對應 quote
  detailQuote = null;
  if (pay.quote_id) {
    const { data: q, error: qErr } = await _supabase
      .from('quotes').select('id, po_number, job_name, grand_total, status, dealer_id')
      .eq('id', pay.quote_id).single();
    if (qErr) throw qErr;
    detailQuote = q;
  }

  // 3) 對應 dealer
  detailDealer = null;
  if (detailQuote && detailQuote.dealer_id) {
    const { data: d, error: dErr } = await _supabase
      .from('dealers').select('id, company_name, contact_name, email')
      .eq('id', detailQuote.dealer_id).single();
    if (dErr) throw dErr;
    detailDealer = d;
  }

  // 4) 同 quote 的所有 payments(供 Cancellation History + 最新判定)
  detailQuotePayments = [];
  if (pay.quote_id) {
    const { data: list, error: lErr } = await _supabase
      .from('payments').select('*').eq('quote_id', pay.quote_id)
      .order('created_at', { ascending: false });
    if (lErr) throw lErr;
    detailQuotePayments = list || [];
  }
}

      cancelHtml +
    '</div>';

  renderActions();

  // Check 圖 signed URL(async 補;private bucket 存 path,需簽名才可顯示)
  if (p.payment_method === 'check' && p.check_image_url) {
    loadCheckImage(p.check_image_url);
  }
}

async function loadCheckImage(path) {
  const wrap = document.getElementById('checkImgWrap');
  if (!wrap) return;
  try {
    const { data, error } = await _supabase.storage.from('payment-checks').createSignedUrl(path, 3600);
    if (error || !data || !data.signedUrl) throw (error || new Error('no signed url'));
    const img = document.createElement('img');
    img.className = 'check-img';
    img.alt = 'Check image';
    img.src = data.signedUrl;
    wrap.innerHTML = '';
    wrap.appendChild(img);
  } catch (err) {
    console.error('[admin-payments] createSignedUrl failed:', err);
    wrap.innerHTML = '<div class="check-img-note">Unable to load check image.</div>';
  }
}

function copyQbLink() {
  const link = detailPayment && detailPayment.quickbooks_payment_link;

  navigator.clipboard.writeText(link).then(

// send-payment-email:Bearer only(無 apikey),失敗只 log、不阻斷、不 throw。

// ═══════════════════════════════════════════════════════════════════
// CB-89  send-payment-email 嚴格版 —— 僅供代選路徑使用
// -------------------------------------------------------------------
// 🔴 為何不改上方的 sendPaymentEmail():那支有四個已上線的呼叫端
//    (actCancel / actConfirm / actResolveGhost / doPickerOffline)。
//    改它等於同時動四條路徑,本票不做。嚴格判定只用於 CB-89。
//    (全站呼叫端都不檢查回應這件事已登記為 F-161,本票不修。)
//
// 🔴 為何需要嚴格判定(P0-1):代選成功但 E1a 沒寄 → 專人不知道要開
//    QBO invoice → 客戶等 Receipt 等不到,而他人就在現場。
//    這條路徑上沒有任何東西會報錯。
//
// 實測證實的 send-payment-email 回應契約(Stage 0 Q-2):
//    正常      200 + { ok:true, type, sent }              ← jsonOk()
//    CB-76 停信 200 + { ok:true, type, sent:0, skipped:'account_type' }
//    任何 throw 500 + { error }   (含 Brevo 非 2xx)
//
// 回傳三態,不 throw —— 寫入已成功,不可因寄信失敗而把整個動作講成失敗:
//    'ok'      res.ok 且 無 skipped 且 Number(sent) >= 1
//    'skipped' res.ok 且 skipped 有值(CB-76 停信帳戶)
//    'failed'  其餘全部(網路 reject / 500 / sent 缺席或為 0 / body 非 JSON)
//
// 🔴 「缺席即失敗」:sent 讀不到、body 解析失敗、形狀非預期 —— 一律 failed,
//    不猜。沒有正向訊號就不算成功(對齊 CB-84 Q-13)。
//
// ⚠️ sent 是【合計】:E1a(admin,gated)+ E1b(dealer,force)。
//    故 sent >= 1 【證明不了】E1a 個別寄出 —— notify_admin_new_payment
//    被關時,dealer 信照寄使 sent 仍為 1。這個缺口由呼叫端的【寫入前】
//    預檢補上(loadPaySettings().notifyEnabled,Q-10),不在本函式。
//    要求 EF 回傳分項計數已登記為 F-166。
//
// ⚠️ 非原子:EF 內 E1a 先寄、E1b 後寄,sendEmail() 於 Brevo 非 2xx 時 throw
//    → 整體回 500。故 'failed' 【不代表】E1a 必然未寄。
//    🔴 呼叫端的訊息用語必須是「無法確認已寄出」,不可寫「未寄出」。
// ═══════════════════════════════════════════════════════════════════
async function sendPaymentEmailStrict(payload) {
  try {
    const { data: { session } } = await _supabase.auth.getSession();
    const res = await fetch(window.SB_URL + '/functions/v1/send-payment-email', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + (session ? session.access_token : ''),
      },
      body: JSON.stringify(payload),
    });

    // body 解析失敗不拋錯,留給下方的正向判定處理 —— null 自然落入 failed。
    let body = null;
    try { body = await res.json(); } catch (parseErr) { body = null; }

    if (!res.ok) {
      console.error('[admin-payments] CB-89 E1a HTTP ' + res.status, body);
      return 'failed';
    }
    if (!body) {
      console.error('[admin-payments] CB-89 E1a: response body not JSON');
      return 'failed';
    }
    if (body.skipped != null) {
      console.warn('[admin-payments] CB-89 E1a skipped:', body.skipped, body);
      return 'skipped';
    }
    // 🔴 正向訊號:sent 必須是可轉數字且 >= 1。
    //    undefined / null / '' / NaN 一律落入 failed。
    const sent = Number(body.sent);
    if (!isNaN(sent) && sent >= 1) return 'ok';

    console.error('[admin-payments] CB-89 E1a: no positive sent signal', body);
    return 'failed';

  } catch (emailErr) {
    console.error('[admin-payments] CB-89 E1a request failed:', emailErr);
    return 'failed';
  }
}

// 依 quote / payment 狀態條件渲染 action bar
function renderActions() {
  const host = document.getElementById('detail-actions');
  if (!host) return;
  const q = detailQuote || {};
  const p = detailPayment;
  const latest = detailQuotePayments[0] || null;
  const isThisLatest = !!(latest && p && latest.id === p.id);

  const btns = [];

  // Confirm / Cancel:quote=Payment Processing 且「這筆」就是最新且 processing
  //（Offline / Resend 已移至列表頁 picker;詳情頁只留 Confirm / Cancel)
  if (q.status === 'Payment Processing' && p.status === 'processing' && isThisLatest) {
    btns.push('<button class="btn-primary" onclick="actConfirm()">Confirm Payment Received</button>');
    btns.push('<button class="btn-primary danger" onclick="actCancel()">Cancel This Payment</button>');
  }

  host.innerHTML = btns.length
    ? '<div class="detail-card full"><div class="section-title">Admin Actions</div>' +
      '<div class="detail-actions-bar">' + btns.join('') + '</div></div>'
    : '';
}

// ---- 共用 modal controller ----
let _amOnConfirm = null;
let _amOnDone = null;

function openActionModal(cfg) {
  document.getElementById('amTitle').textContent = cfg.title || '';
  document.getElementById('amSub').textContent   = cfg.sub || '';
  document.getElementById('amFields').innerHTML  = cfg.fieldsHtml || '';
  const errEl = document.getElementById('amError');
  errEl.textContent = ''; errEl.className = 'modal-error';
  const confirmBtn = document.getElementById('amConfirm');
  confirmBtn.textContent = cfg.confirmLabel || 'Confirm';
  confirmBtn.className = 'btn-primary' + (cfg.danger ? ' danger' : '');
  confirmBtn.disabled = false;
  _amOnConfirm = cfg.onConfirm || null;
  _amOnDone    = cfg.onDone || null;
  document.getElementById('actionModal').classList.add('show');
}

function closeActionModal() {
  document.getElementById('actionModal').classList.remove('show');
  _amOnConfirm = null;
  _amOnDone    = null;
}

function amShowError(msg) {
  const errEl = document.getElementById('amError');
  errEl.textContent = msg;
  errEl.className = 'modal-error show';
}

function wireActionModal() {
  document.getElementById('amCancel').onclick = closeActionModal;
  document.getElementById('amConfirm').onclick = async function () {
    if (!_amOnConfirm) return;
    const btn = document.getElementById('amConfirm');
    document.getElementById('amError').className = 'modal-error';  // 清錯誤
    btn.disabled = true;
    try {
      const ok = await _amOnConfirm();
      if (ok === false) { btn.disabled = false; return; }   // 驗證未過:錯誤已顯示,留在 modal
      const onDone = _amOnDone;                             // 先捕捉(closeActionModal 會清空)
      const pid = detailPayment ? detailPayment.id : null;
      closeActionModal();
      if (onDone)   { onDone(); }                           // list 情境:刷新幽靈區+主表
      else if (pid) { showDetail(pid); }                    // detail 情境(Confirm/Cancel):維持原樣
    } catch (err) {
      console.error('[admin-payments] action failed:', err);
      amShowError(err.message || 'Action failed. Please try again.');
      btn.disabled = false;
    }
  };
}

// ---- Cancel This Payment ----
  
function actCancel() {
  openActionModal({
    title: 'Cancel This Payment',
    sub: 'The order will return to Pending and the dealer will be notified. This cannot be undone.',
    fieldsHtml: '<div class="modal-field"><label>Cancellation Reason</label>' +
      '<textarea id="amReason" placeholder="Why is this payment being cancelled?"></textarea></div>',
    confirmLabel: 'Cancel Payment',
    danger: true,
    onConfirm: async function () {
      const reason = (document.getElementById('amReason').value || '').trim();
      if (!reason) { amShowError('Please enter a cancellation reason.'); return false; }

      // ① quotes → Pending
      //   CB-55 B-10a:補 status 守衛。
      //   renderActions() 只在 quote='Payment Processing' 時渲染此按鈕,但那是
      //   【開啟 modal 當下的快照】——detailQuote 之後不再重撈。若 modal 停留期間
      //   WF2 確認了付款(→Order Processing)、super_admin 再按 Complete
      //   (→Order Completed),此處無守衛的 UPDATE 會把終局態拖回 Pending。
      //   守衛把前端的前置條件搬到寫入當下,順帶擋住兩個 admin 同時操作。
      //   值刻意與 renderActions() 的判斷一致,不引入新語意。
      const upd = await _supabase.from('quotes')
        .update({ status: 'Pending' }, { count: 'exact' })
        .eq('id', detailQuote.id)
        .eq('status', 'Payment Processing');
      if (upd.error) throw upd.error;
      if (upd.count === 0) throw new Error("This order is no longer awaiting payment confirmation — its status was changed by someone else. Nothing was cancelled. 請重新整理後再試。");

      // ② payments → cancelled
      const { data: { session } } = await _supabase.auth.getSession();
      const updP = await _supabase.from('payments')
        .update({
          status: 'cancelled',
          cancellation_reason: reason,
          cancelled_by: session.user.id,
          cancelled_at: new Date().toISOString(),
        }, { count: 'exact' })
        .eq('id', detailPayment.id);
      if (updP.error) throw updP.error;
      if (updP.count === 0) throw new Error("Order returned to Pending but the payment row didn't update (0 rows). 狀態可能不一致,請人工核對。");

      // ③ email(非阻斷)
      await sendPaymentEmail({ type: 'payment_cancelled', quote_id: detailQuote.id, payment_id: detailPayment.id });
      showToast('Payment cancelled.');
      return true;
    }
  });
}

// ---- 3. Confirm Payment Received ----
function actConfirm() {
  openActionModal({
    title: 'Confirm Payment Received',
    sub: 'This marks the payment as confirmed and advances the order to Order Processing. The dealer will be notified.',
    fieldsHtml: '',
    confirmLabel: 'Confirm Payment',
    danger: false,
    onConfirm: async function () {
      // ① quotes → Order Processing
      //   CB-55 B-10a:補 status 守衛(理由同 actCancel)。
      //   這一處風險更高:無守衛時會把 Order Completed 拖回 Order Processing,
      //   而感謝信已經寄給 dealer —— 狀態與對外承諾不一致,且靜默無警。
      const upd = await _supabase.from('quotes')
        .update({ status: 'Order Processing' }, { count: 'exact' })
        .eq('id', detailQuote.id)
        .eq('status', 'Payment Processing');
      if (upd.error) throw upd.error;
      if (upd.count === 0) throw new Error("This order is no longer awaiting payment confirmation — its status was changed by someone else. Nothing was confirmed. 請重新整理後再試。");

      // ② payments → confirmed
      const { data: { session } } = await _supabase.auth.getSession();
      const updP = await _supabase.from('payments')
        .update({
          status: 'confirmed',
          confirmed_by: session.user.id,
          confirmed_at: new Date().toISOString(),
        }, { count: 'exact' })
        .eq('id', detailPayment.id);
      if (updP.error) throw updP.error;
      if (updP.count === 0) throw new Error("Order advanced but the payment row didn't update (0 rows). 狀態可能不一致,請人工核對。");

      // ③ email(非阻斷)
      await sendPaymentEmail({ type: 'payment_confirmed', quote_id: detailQuote.id, payment_id: detailPayment.id });
      showToast('Payment confirmed.');
      return true;
    }
  });
}
