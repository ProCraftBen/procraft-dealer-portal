<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ProCraft — Change Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold:       #C9A84C;
      --green-dark: #3e5a42;
      --green-mid:  #4a6b4f;
      --cream:      #F5F2EC;
      --text:       #2C3A32;
      --muted:      #7A8C82;
      --border:     #DDD8CC;
      --white:      #FFFFFF;
      --error:      #C0392B;
      --success:    #16A34A;
    }
    html, body { min-height: 100%; font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--text); }

    /* Page */
    .page { max-width: 480px; margin: 0 auto; padding: 60px 20px; }
    .page-title { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 400; color: var(--green-dark); margin-bottom: 8px; }
    .page-sub { font-size: 13px; color: var(--muted); margin-bottom: 32px; line-height: 1.6; }

    /* Card */
    .card { background: var(--white); border: 1px solid var(--border); border-radius: 4px; padding: 28px; }

    /* Form */
    .form-group { margin-bottom: 20px; }
    .form-label { font-size: 9px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 6px; }
    .input-wrap { position: relative; }
    .form-input { width: 100%; height: 44px; border: 1px solid var(--border); border-radius: 3px; padding: 0 44px 0 14px; font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text); background: var(--white); transition: border-color 0.2s; }
    .form-input:focus { outline: none; border-color: var(--gold); }
    .toggle-pw { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--muted); padding: 4px; transition: color 0.2s; }
    .toggle-pw:hover { color: var(--text); }
    .toggle-pw svg { width: 16px; height: 16px; fill: currentColor; display: block; }

    /* Password strength */
    .pw-strength { margin-top: 8px; }
    .pw-bars { display: flex; gap: 4px; margin-bottom: 4px; }
    .pw-bar { flex: 1; height: 3px; background: var(--border); border-radius: 2px; transition: background 0.2s; }
    .pw-bar.weak   { background: #E74C3C; }
    .pw-bar.fair   { background: #F39C12; }
    .pw-bar.good   { background: #3B82F6; }
    .pw-bar.strong { background: var(--success); }
    .pw-label { font-size: 10px; color: var(--muted); }

    /* Rules */
    .pw-rules { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; }
    .pw-rule { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; transition: color 0.2s; }
    .pw-rule.met { color: var(--success); }
    .pw-rule svg { width: 12px; height: 12px; fill: currentColor; flex-shrink: 0; }

    /* Messages */
    .error-msg { background: rgba(192,57,43,0.07); border: 1px solid rgba(192,57,43,0.25); border-radius: 3px; padding: 10px 14px; font-size: 12px; color: var(--error); margin-bottom: 16px; display: none; }
    .error-msg.show { display: block; }
    .success-msg { background: rgba(22,163,74,0.07); border: 1px solid rgba(22,163,74,0.25); border-radius: 3px; padding: 14px; font-size: 13px; color: var(--success); text-align: center; display: none; }
    .success-msg.show { display: block; }

    /* Button */
    .btn-submit { width: 100%; height: 48px; background: var(--green-dark); color: #fff; border: none; border-radius: 3px; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer; transition: background 0.2s; margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-submit:hover { background: var(--green-mid); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
    .btn-submit.loading .btn-text { display: none; }
    .btn-submit.loading .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* CB-76: Trial 帳號擋頁面板 */
    /* 🔴 中性資訊色(金色系),刻意【不用】紅色 —— 這不是錯誤,是帳號狀態說明。
       new-quote-step3.html 的 trial 訊息走紅色 .error-msg,那裡是「你剛做的
       動作被擋下了」的錯誤回饋;本面板是一進頁面就看到的狀態說明,沒有失敗
       動作可回饋。兩者情境不同,刻意不一致。(CB-76 Q-30 = A) */
    .trial-block { display: none; background: rgba(201,168,76,0.07); border: 1px solid rgba(201,168,76,0.3); border-left: 3px solid var(--gold, #C9A84C); border-radius: 3px; padding: 24px; text-align: center; }
    .trial-block.show { display: block; }
    .trial-block .tb-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 400; color: var(--green-dark); margin-bottom: 10px; }
    .trial-block .tb-body { font-size: 13px; line-height: 1.7; color: var(--text); margin-bottom: 18px; }
    .trial-block .tb-back { display: inline-block; font-size: 12px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--green-dark); text-decoration: none; border-bottom: 1px solid var(--green-dark); padding-bottom: 2px; }
    .trial-block .tb-back:hover { color: var(--green-mid); border-color: var(--green-mid); }
  </style>
</head>
<body>

<div id="pcd-nav" data-page="change-password"></div>

<div class="page">
  <div class="page-title" data-i18n="password.title">Change Password</div>
  <div class="page-sub" data-i18n="password.subtitle">Enter your current password and choose a new one.</div>

  <div class="card">
    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg" data-i18n="password.success">
      ✓ Password updated successfully. Redirecting...
    </div>

    <!-- CB-76: Trial 帳號擋頁面板。預設隱藏,由 showTrialBlock() 開啟。
         入口(navigator / dashboard)刻意不隱藏 —— 隱藏會讓產品看起來
         功能較少;顯示但擋住,傳達的是「功能都在,只是此帳號需啟用」。 -->
    <div class="trial-block" id="trialBlock">
      <div class="tb-title" data-i18n="trial.block.title">Trial Account</div>
      <div class="tb-body"  data-i18n="trial.block.body">Trial accounts cannot modify account settings. Contact ProCraft to activate your account.</div>
      <a class="tb-back" href="dashboard.html" data-i18n="trial.block.back">Back to Dashboard</a>
    </div>

    <div id="formContent">
      <!-- Current Password -->
      <div class="form-group">
        <label class="form-label" data-i18n="password.field.current">Current Password</label>
        <div class="input-wrap">
          <input class="form-input" type="password" id="currentPw" placeholder="Enter current password" data-i18n-placeholder="password.ph.current"/>
          <button class="toggle-pw" type="button" onclick="toggleVisibility('currentPw', this)">
            <svg id="eye-currentPw" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          </button>
        </div>
      </div>

      <!-- New Password -->
      <div class="form-group">
        <label class="form-label" data-i18n="password.field.new">New Password</label>
        <div class="input-wrap">
          <input class="form-input" type="password" id="newPw" placeholder="Enter new password" data-i18n-placeholder="password.ph.new" oninput="checkStrength()"/>
          <button class="toggle-pw" type="button" onclick="toggleVisibility('newPw', this)">
            <svg id="eye-newPw" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          </button>
        </div>
        <div class="pw-strength" id="pwStrength" style="display:none;">
          <div class="pw-bars">
            <div class="pw-bar" id="bar1"></div>
            <div class="pw-bar" id="bar2"></div>
            <div class="pw-bar" id="bar3"></div>
            <div class="pw-bar" id="bar4"></div>
          </div>
          <div class="pw-label" id="pwLabel"></div>
        </div>
        <div class="pw-rules">
          <div class="pw-rule" id="rule-len">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
            <span data-i18n="password.rule.len">At least 8 characters</span>
          </div>
          <div class="pw-rule" id="rule-upper">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
            <span data-i18n="password.rule.upper">One uppercase letter</span>
          </div>
          <div class="pw-rule" id="rule-num">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
            <span data-i18n="password.rule.num">One number</span>
          </div>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label class="form-label" data-i18n="password.field.confirm">Confirm New Password</label>
        <div class="input-wrap">
          <input class="form-input" type="password" id="confirmPw" placeholder="Repeat new password" data-i18n-placeholder="password.ph.confirm"/>
          <button class="toggle-pw" type="button" onclick="toggleVisibility('confirmPw', this)">
            <svg id="eye-confirmPw" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          </button>
        </div>
      </div>

      <button class="btn-submit" id="btnSubmit" onclick="changePassword()">
        <span class="btn-text" data-i18n="password.btn.submit">Update Password</span>
        <div class="spinner"></div>
      </button>
    </div>
  </div>
</div>

<div id="pcd-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="components/i18n.js?v=cb62c"></script>
<script src="components/lang-switch.js?v=cb62c"></script>
<script src="components/navigator.js?v=cb62c"></script>
<script src="components/footer.js?v=cb62c"></script>
<script>
const { createClient } = window.supabase;
const _supabase = createClient(
  window.SB_URL,
  window.SB_KEY
);

let currentUserRole = null;

// ═══════════════════════════════════════════════════════════════════
// CB-62 B2|i18n 區域輔助
// -------------------------------------------------------------------
// pcT 在 i18n.js 未載入或字典未就緒時回 null → 一律帶英文保底,
// 絕不讓畫面出現 "null"。命名用 pc 前綴避免 global 碰撞(B-1 教訓)。
// ═══════════════════════════════════════════════════════════════════
function pcTxt(key, fallback) {
  return (typeof window.pcT === 'function' && window.pcT(key)) || fallback;
}

// 錯誤訊息:把 key 記在節點上,語言切換時可重新翻譯。
function pcShowErr(key, fallback) {
  const el = document.getElementById('errorMsg');
  el.dataset.pcErrKey = key;
  el.dataset.pcErrEn  = fallback;
  el.textContent = pcTxt(key, fallback);
  el.classList.add('show');
}

async function init() {
  const { data: { session } } = await _supabase.auth.getSession();
  if (!session) { window.location.href = 'login.html'; return; }

  const { data: me } = await _supabase
    .from('dealers')
    .select('role, account_type')
    .eq('id', session.user.id)
    .single();

  currentUserRole = me?.role || 'dealer';

  // ── CB-76: Trial 帳號擋頁 ──────────────────────────────────────────────
  //   🔴 刻意 fail-open(讀不到 account_type 即放行),與 new-quote-step3.html
  //      同一分層方向。但【此處與 step3 不同:沒有 DB 層兜底】——
  //      step3 的送出攔截後面接著 quotes 的 trg_block_trial_status_change
  //      (SECURITY DEFINER + RAISE EXCEPTION);本頁沒有對應的 trigger。
  //      這是刻意的(CB-76 Q-31 = A):改密碼對 trial 不是危險動作,不產生
  //      PO 號、不污染任何編號池。Q-9 已定調此處是【UX 訊號而非安全邊界】
  //      —— forget password 本就是旁路,補 DB 層等於為零風險付出 RLS 改動的代價。
  //      🔴 請勿因為「step3 有兩層、這裡只有一層」就順手補上。
  //   正向識別(F-35):=== 'trial' 命中,而非排除其他值。
  if (me?.account_type === 'trial') {
    showTrialBlock();
    return;
  }
}

// CB-76: 隱藏表單、顯示說明面板。change-password 的表單全在單一
//   #formContent 內,故只需藏一個節點。(dealer-profile 的 6 個 card
//   無共用包裹,實作方式不同 —— 見該檔的同名函式。)
function showTrialBlock() {
  const form  = document.getElementById('formContent');
  const block = document.getElementById('trialBlock');
  if (form)  form.style.display = 'none';
  if (block) block.classList.add('show');
}

function toggleVisibility(inputId, btn) {
  const input = document.getElementById(inputId);
  const isText = input.type === 'text';
  input.type = isText ? 'password' : 'text';
  btn.querySelector('svg').innerHTML = isText
    ? '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>'
    : '<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>';
}

function checkStrength() {
  const pw = document.getElementById('newPw').value;
  const strengthEl = document.getElementById('pwStrength');

  if (!pw) { strengthEl.style.display = 'none'; return; }
  strengthEl.style.display = 'block';

  const hasLen   = pw.length >= 8;
  const hasUpper = /[A-Z]/.test(pw);
  const hasNum   = /[0-9]/.test(pw);
  const hasSpec  = /[^A-Za-z0-9]/.test(pw);

  document.getElementById('rule-len').classList.toggle('met', hasLen);
  document.getElementById('rule-upper').classList.toggle('met', hasUpper);
  document.getElementById('rule-num').classList.toggle('met', hasNum);

  const score  = [hasLen, hasUpper, hasNum, hasSpec].filter(Boolean).length;
  const bars   = ['bar1','bar2','bar3','bar4'];
  const levels = ['weak','fair','good','strong'];
  // CB-62 B2:顯示名改查語言檔;英文原值作為保底,行為與改動前一致。
  const labels = [
    pcTxt('password.strength.weak',   'Weak'),
    pcTxt('password.strength.fair',   'Fair'),
    pcTxt('password.strength.good',   'Good'),
    pcTxt('password.strength.strong', 'Strong')
  ];

  bars.forEach((id, i) => {
    const el = document.getElementById(id);
    el.className = 'pw-bar';
    if (i < score) el.classList.add(levels[score - 1]);
  });
  document.getElementById('pwLabel').textContent = labels[score - 1] || '';
}

async function changePassword() {
  const btn     = document.getElementById('btnSubmit');
  const errMsg  = document.getElementById('errorMsg');
  const current = document.getElementById('currentPw').value;
  const newPw   = document.getElementById('newPw').value;
  const confirm = document.getElementById('confirmPw').value;

  errMsg.classList.remove('show');

  if (!current || !newPw || !confirm) {
    pcShowErr('password.err.required', 'Please fill in all fields.');
    return;
  }
  if (newPw.length < 8) {
    pcShowErr('password.err.min_length', 'New password must be at least 8 characters.');
    return;
  }
  if (newPw !== confirm) {
    pcShowErr('password.err.mismatch', 'New passwords do not match.');
    return;
  }
  if (current === newPw) {
    pcShowErr('password.err.same_as_current', 'New password must be different from your current password.');
    return;
  }

  btn.classList.add('loading');
  btn.disabled = true;

  try {
    const { data: { session } } = await _supabase.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }

    const { error: signInErr } = await _supabase.auth.signInWithPassword({
      email: session.user.email,
      password: current,
    });

    if (signInErr) {
      pcShowErr('password.err.current_incorrect', 'Current password is incorrect.');
      btn.classList.remove('loading');
      btn.disabled = false;
      return;
    }

    const { error: updateErr } = await _supabase.auth.updateUser({ password: newPw });
    if (updateErr) throw updateErr;

    document.getElementById('formContent').style.display = 'none';
    document.getElementById('successMsg').classList.add('show');

    const target = ['admin', 'super_admin'].includes(currentUserRole)
      ? 'admin.html'
      : 'dashboard.html';
    setTimeout(() => { window.location.href = target; }, 2500);

  } catch (err) {
    // err.message 來自 Supabase,維持原文(非介面文字)
    if (err && err.message) {
      errMsg.dataset.pcErrKey = '';
      errMsg.textContent = err.message;
      errMsg.classList.add('show');
    } else {
      pcShowErr('common.err.unexpected', 'Something went wrong. Please try again.');
    }
    btn.classList.remove('loading');
    btn.disabled = false;
  }
}

// 語言切換 → 重譯強度標籤與目前顯示中的錯誤訊息
// (靜態節點由 i18n.js 自行重繪,這裡只處理 JS 寫入的文字)
document.addEventListener('pc:i18n-changed', function () {
  // 無條件重算:checkStrength() 本身在密碼欄為空時會收起強度區塊,
  // 加空值判斷反而會讓標籤停在舊語言。
  checkStrength();
  const el = document.getElementById('errorMsg');
  if (el.dataset.pcErrKey) el.textContent = pcTxt(el.dataset.pcErrKey, el.dataset.pcErrEn || '');
});

init();
</script>
</body>
</html>
