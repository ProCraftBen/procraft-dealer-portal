<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ProCraft Dealer Portal — Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold:       #C9A84C;
      --gold-light: #E2C97E;
      --green-dark: #3e5a42;
      --green-mid:  #4a6b4f;
      --cream:      #F5F2EC;
      --text:       #2C3A32;
      --muted:      #7A8C82;
      --border:     #DDD8CC;
      --bg:         #F5F2EC;
      --white:      #FFFFFF;
      --status-draft:      #9B59B6;
      --status-pending:    #C9A84C;
      --status-processing: #3B82F6;
      --status-complete:   #16A34A;
      --status-closed:     #6B7280;
      --status-returned:   #E07B39;
      --status-payment:    #64748B;
      --status-stock-review: #0891B2;  /* CB-43 T14-1 */
      --status-order-completed: #0F766E;  /* CB-55 Q-4 */
      --status-cancelled: #B91C1C;  /* CB-57 Q-2:終態,灰紅 */
    }
    html, body { min-height: 100%; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); }

    .page { max-width: 1100px; margin: 0 auto; padding: 32px 20px; }
    .page-header { margin-bottom: 28px; }
    .page-header .greeting { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .page-header h1 { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 400; color: var(--green-dark); }

    .btn-new-quote { display: inline-flex; align-items: center; gap: 8px; background: var(--green-dark); color: #fff; border: none; border-radius: 3px; padding: 12px 20px; font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer; transition: background 0.2s; text-decoration: none; min-height: 44px; }
    .btn-new-quote:hover { background: var(--green-mid); }
    .btn-new-quote svg { width: 14px; height: 14px; fill: currentColor; }

    .dashboard-grid { display: grid; grid-template-columns: 1fr; gap: 24px; }
    @media (min-width: 768px) { .dashboard-grid { grid-template-columns: 1fr 1fr; } }

    .panel { background: var(--white); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
    .panel-header { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .panel-title { font-size: 11px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--green-dark); }
    .panel-action { font-size: 11px; color: var(--gold); text-decoration: none; letter-spacing: 0.05em; transition: opacity 0.2s; }
    .panel-action:hover { opacity: 0.7; }

    .quote-list { padding: 0; }
    .quote-item { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: background 0.15s; gap: 12px; }
    .quote-item:last-child { border-bottom: none; }
    .quote-item:hover { background: #FAFAF8; }
    .quote-item.is-draft { background: rgba(155,89,182,0.03); }
    .quote-item.is-draft:hover { background: rgba(155,89,182,0.08); }
    .quote-info { flex: 1; min-width: 0; }
    /* Line 1: PO# (or Draft label for drafts) */
    .quote-po-line { font-size: 13px; font-weight: 500; color: var(--green-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .quote-po-line.draft-label { color: var(--status-draft); font-style: italic; font-weight: 500; }
    /* Line 2: Job Name */
    .quote-job-line { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .quote-right { text-align: right; flex-shrink: 0; }
    .quote-status { font-size: 10px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
    .quote-status.draft      { color: var(--status-draft); }
    .quote-status.pending    { color: var(--status-pending); }
    .quote-status.stock-review { color: var(--status-stock-review); }  /* CB-43 T14-1 */
    .quote-status.processing { color: var(--status-processing); }
    .quote-status.complete   { color: var(--status-complete); }
    .quote-status.closed     { color: var(--status-closed); }
    .quote-status.payment-processing { color: var(--status-payment); }
    .quote-status.order-processing   { color: var(--status-complete); }
    .quote-status.order-completed    { color: var(--status-order-completed); }  /* CB-55 */
    .quote-status.cancelled          { color: var(--status-cancelled); }  /* CB-57 */
    .quote-status.returned   { color: var(--status-returned); }
    .quote-date { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .empty-state { padding: 40px 20px; text-align: center; color: var(--muted); font-size: 13px; }
    .empty-state svg { width: 32px; height: 32px; fill: var(--border); margin-bottom: 10px; }

    .loading-rows { padding: 20px; }
    .loading-row { height: 16px; background: linear-gradient(90deg, #eee 25%, #f5f5f5 50%, #eee 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 3px; margin-bottom: 12px; }
    .loading-row:nth-child(2) { width: 80%; }
    .loading-row:nth-child(3) { width: 90%; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
    .stat-card { background: var(--white); border: 1px solid var(--border); border-radius: 4px; padding: 16px; text-align: center; }
    .stat-num { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 500; color: var(--green-dark); line-height: 1; }
    .stat-label { font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }

    .action-row { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
  </style>
</head>
<body>

<!-- Unified Navigator (replaces old <nav> and mobile menu) -->
<div id="pcd-nav" data-page="dashboard"></div>

<div class="page">
  <div class="page-header">
    <div id="pcd-lang-switch"></div>
    <div class="greeting" data-i18n="dashboard.welcome">Welcome back</div>
    <!-- ⚠️ #companyName 由 JS 寫入公司名稱。data-i18n 只作為載入中的佔位,
         寫入公司名時會【移除該屬性】,否則切換語言會把公司名蓋成「載入中」。 -->
    <h1 id="companyName" data-i18n="dashboard.loading">Loading...</h1>
  </div>

  <div class="stats-bar">
    <div class="stat-card"><div class="stat-num" id="statTotal">—</div><div class="stat-label" data-i18n="dashboard.stat.total_quotes">Total Quotes</div></div>
    <div class="stat-card"><div class="stat-num" id="statPending">—</div><div class="stat-label" data-pc-status-short="Pending">Waiting</div></div>
    <div class="stat-card"><div class="stat-num" id="statInProgress">—</div><div class="stat-label" data-i18n="dashboard.stat.in_progress">In Progress</div></div>
  </div>

  <div class="action-row">
    <a href="new-quote.html" class="btn-new-quote">
      <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      <span data-i18n="dashboard.action.new_estimate">New Estimate</span>
    </a>
    <a href="change-password.html" class="btn-new-quote" style="background:transparent;color:var(--green-dark);border:1px solid var(--border);">
      <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
      <span data-i18n="dashboard.action.change_password">Change Password</span>
    </a>
    <a href="dealer-profile.html" style="display:inline-flex;align-items:center;gap:8px;background:transparent;color:var(--green-dark);border:1px solid var(--border);border-radius:3px;padding:12px 20px;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;letter-spacing:0.2em;text-transform:uppercase;text-decoration:none;min-height:44px;">
      <span data-i18n="dashboard.action.edit_profile">Edit Profile</span>
    </a>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span class="panel-title" data-i18n="dashboard.recent.title">Recent Quotes</span>
      <a href="quotes.html" class="panel-action" data-i18n="dashboard.recent.view_all">View All →</a>
    </div>
    <div class="quote-list" id="quoteList">
      <div class="loading-rows"><div class="loading-row"></div><div class="loading-row"></div><div class="loading-row"></div></div>
    </div>
  </div>
</div>

<!-- Unified Footer -->
<div id="pcd-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="components/status-label.js?v=1.1"></script>
<script src="components/i18n.js?v=cb62b"></script>
<script src="components/lang-switch.js?v=cb62b"></script>
<script src="components/navigator.js"></script>
<script src="components/footer.js"></script>
<script>
  const SUPABASE_URL = window.SB_URL;
  const SUPABASE_KEY = window.SB_KEY;
  const { createClient } = window.supabase;
  const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  const statusClass = {
    'Draft': 'draft',
    'Stock Review': 'stock-review',
    'Pending': 'pending',
    'Payment Processing': 'payment-processing',
    'Order Processing': 'order-processing',
    'Order Completed': 'order-completed',   // CB-55
    'Closed': 'closed',
    'Returned': 'returned',
    'Cancelled': 'cancelled'   // CB-57
  };

  // CB-56: quote status 顯示名改由 components/status-label.js 提供(單一真相)。
  //   原本此處的 inline `const statusLabel` 已移除 —— 各頁不得再 hardcode。
  //   'Pending' → 'Waiting for Payment'、'Returned' → 'Revising' 皆在該檔。
  //   ⚠️ 上方 statusClass 是 CSS class 對照表,與顯示名無關,維持不動。

  function formatDate(str) {
    const d = new Date(str);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  // HTML-escape helper for any user-provided text we inject into the DOM
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  async function init() {
    const { data: { session } } = await _supabase.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }

    const userId = session.user.id;
    const { data: me } = await _supabase.from('dealers').select('role, is_active').eq('id', userId).single();
    if (['admin','super_admin'].includes(me?.role)) { window.location.href = 'admin.html'; return; }
    if (!me?.is_active) { await _supabase.auth.signOut(); window.location.href = 'login.html'; return; }

    setInterval(async () => {
      const { data: check } = await _supabase.from('dealers').select('is_active').eq('id', userId).single();
      if (!check?.is_active) { await _supabase.auth.signOut(); window.location.href = 'login.html'; }
    }, 60000);

    const { data: dealer } = await _supabase.from('dealers').select('*').eq('id', userId).single();
    if (dealer) {
      const nameEl = document.getElementById('companyName');
      // 🔴 先移除 data-i18n 再寫入:此後 i18n.js 不會再碰這個節點,
      //    切換語言時公司名不會被「載入中」蓋掉(CB-62 B1)。
      nameEl.removeAttribute('data-i18n');
      nameEl.textContent = dealer.company_name;
    }

    const { data: quotes } = await _supabase
      .from('quotes')
      .select('*')
      .eq('dealer_id', userId)
      // CB-36: 擋掉 admin 建但未通知的 Internal Draft(admin_notified_at IS NULL 且 status=Draft)。
      // 顯示條件:已通知(admin_notified_at 有值)OR 非 Draft(已 Submit/Pending/等)。
      // dealer 自建 Draft 因 Option A 已寫 NOW() → 看得到;既有單因 migration 補 created_at → 看得到。
      .or('admin_notified_at.not.is.null,status.neq.Draft')
      .order('created_at', { ascending: false })
      .limit(8);

    const all        = quotes || [];
    const pending    = all.filter(q => q.status === 'Pending').length;
    // CB-43 T14-1 (Q4): Stock Review 併入 In Progress。否則 dealer submit 完回
    // dashboard 會看到 Total +1 但 Pending / In Progress 都沒動 → 單子像消失了。
    const inProgress = all.filter(q => q.status === 'Stock Review' || q.status === 'Payment Processing' || q.status === 'Order Processing').length;
    document.getElementById('statTotal').textContent      = all.length;
    document.getElementById('statPending').textContent    = pending;
    document.getElementById('statInProgress').textContent = inProgress;

    pcQuotes = all;
    renderQuotes();
  }

  // ═══════════════════════════════════════════════════════════════════
  // 🔴 CB-62 B1|語言切換重繪(Stage B 各頁的參考實作)
  // -------------------------------------------------------------------
  // 責任三分線:
  //   靜態 data-i18n 節點        → i18n.js 自己重繪
  //   靜態 data-pc-status-* 節點 → status-label.js 自己重繪
  //   【JS 動態產生的內容】       → 由本頁負責,就是下面這段
  //
  // 作法:資料存模組層變數、渲染抽成函式、監聽 pc:i18n-changed 再呼叫一次。
  // 不重新查 DB —— 換語言不該產生額外查詢。
  // ═══════════════════════════════════════════════════════════════════
  let pcQuotes = [];

  // pcT 在 i18n.js 未載入或字典未就緒時回 null,故一律帶英文保底,
  // 絕不讓畫面出現 "null"。
  // ⚠️ 命名用 pc 前綴(B-1 教訓):頂層宣告會進 global scope,
  //    短名稱如 t / tt 極易與其他 script 碰撞。
  function pcTxt(key, fallback) {
    return (typeof window.pcT === 'function' && window.pcT(key)) || fallback;
  }

  function renderQuotes() {
    const all = pcQuotes;
    const quoteList = document.getElementById('quoteList');
    if (!quoteList) return;
    if (!all.length) {
      quoteList.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6zm-1 1.5L18.5 9H13V3.5zM6 20V4h5v7h7v9H6z"/></svg>${escapeHtml(pcTxt('dashboard.recent.empty', 'No quotes yet. Create your first quote!'))}</div>`;
    } else {
      quoteList.innerHTML = all.map(q => {
        const isDraft = q.status === 'Draft';

        // Drafts route to new-quote.html?draft=xxx (continue editing — matches quotes.html behavior)
        // Submitted quotes route to quote-detail.html?id=xxx
        const href = isDraft
          ? `new-quote.html?draft=${q.id}`
          : `quote-detail.html?id=${q.id}`;

        // Line 1: PO# for submitted quotes; Draft label for drafts (no PO# yet)
        const line1Class = isDraft ? 'quote-po-line draft-label' : 'quote-po-line';
        const line1Text  = isDraft ? pcTxt('dashboard.quote.draft_line', '\u270E Draft (continue editing)') : (q.po_number || '—');

        const safeJob   = escapeHtml(q.job_name || '—');
        const safeLine1 = escapeHtml(line1Text);
        const sc        = statusClass[q.status] || 'pending';
        const itemClass = isDraft ? 'quote-item is-draft' : 'quote-item';

        return `
          <div class="${itemClass}" onclick="window.location.href='${href}'">
            <div class="quote-info">
              <div class="${line1Class}">${safeLine1}</div>
              <div class="quote-job-line">${safeJob}</div>
            </div>
            <div class="quote-right">
              <div class="quote-status ${sc}">${pcQuoteStatusLabel(q.status)}</div>
              <div class="quote-date">${formatDate(q.created_at)}</div>
            </div>
          </div>`;
      }).join('');
    }
  }

  // 語言變更 → 重繪動態清單(靜態節點由各自的水合器處理)
  document.addEventListener('pc:i18n-changed', renderQuotes);

  init();
</script>
<script src="components/feedback-widget.js?v=1.1"></script>
</body>


  
</html>
