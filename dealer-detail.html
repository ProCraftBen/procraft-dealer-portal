<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ProCraft Admin — Dealer Detail</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold:       #C9A84C;
      --green-dark: #3e5a42;
      --green-mid:  #4a6b4f;
      --cream:      #F5F2EC;
      --text:       #2C3A32;
      --muted:      #7A8C82;
      --border:     #DDD8CC;
      --white:      #FFFFFF;
      --error:      #C0392B;
      --stale:      #8A6D24;   /* 停滯 / 需注意,非錯誤 */
    }
    html, body { min-height: 100%; font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--text); }
    .page { max-width: 1100px; margin: 0 auto; padding: 32px 20px; }
    .page-header { margin-bottom: 24px; display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .page-title { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 400; color: var(--green-dark); line-height: 1.15; }
    .page-sub { font-size: 12px; color: var(--muted); margin-top: 6px; }
    a { color: var(--green-mid); }

    .btn-primary { display: inline-flex; align-items: center; gap: 8px; background: var(--green-dark); color: #fff; border: none; border-radius: 3px; padding: 12px 20px; font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer; transition: background 0.2s; min-height: 44px; }
    .btn-primary:hover { background: var(--green-mid); }
    .btn-plain { background: none; border: 1px solid var(--border); border-radius: 3px; padding: 6px 12px; font-family: 'DM Sans', sans-serif; font-size: 11px; color: var(--muted); cursor: pointer; }
    .btn-plain:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
    .btn-plain:disabled { opacity: 0.4; cursor: default; }
    .btn-plain.danger:hover { color: var(--error); border-color: rgba(192,57,43,0.4); }
    button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }

    .card { background: var(--white); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 20px; }
    .card-head { padding: 13px 20px 13px 17px; border-bottom: 1px solid var(--border); border-left: 3px solid var(--green-dark); background: var(--cream); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .card-title { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 500; letter-spacing: 0.01em; text-transform: none; color: var(--green-dark); line-height: 1.2; }
    .card-note { font-size: 11px; color: var(--muted); }
    .card-tools { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
    .card-body { padding: 18px 20px; }
    .card.hero { border-color: rgba(138,109,36,0.45); }
    .card.hero .card-head { background: #FBF4E3; border-left-color: var(--stale); }

    .list-search { height: 30px; width: 190px; border: 1px solid var(--border); border-radius: 3px; padding: 0 9px; font-family: 'DM Sans', sans-serif; font-size: 12px; color: var(--text); background: var(--white); }
    .list-search:focus { outline: none; border-color: var(--gold); }
    .pager-bar { display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 10px 20px; border-top: 1px solid var(--border); background: #FAFAF8; }
    .pager-bar.hidden { display: none; }
    .pager-info { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

    table { width: 100%; border-collapse: collapse; }
    thead th { padding: 10px 16px; background: #F5F3EF; border-bottom: 1px solid var(--border); font-size: 9px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); text-align: left; white-space: nowrap; }
    tbody tr { border-bottom: 1px solid var(--border); }
    tbody tr:last-child { border-bottom: none; }
    tbody td { padding: 12px 16px; font-size: 12px; vertical-align: top; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

    .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 18px 24px; }
    .fact-label { font-size: 9px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .fact-value { font-size: 14px; }
    .fact-value.big { font-family: 'Cormorant Garamond', serif; font-size: 24px; color: var(--green-dark); line-height: 1.1; }
    .fact-value.big.stale { color: var(--stale); }
    .fact-sub { font-size: 10px; color: var(--muted); margin-top: 3px; line-height: 1.4; }

    .idle { font-variant-numeric: tabular-nums; font-weight: 500; color: var(--stale); white-space: nowrap; }
    .chip { display: inline-block; padding: 2px 7px; border-radius: 2px; font-size: 9px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; }
    .chip-stale    { background: #FBF3DE; color: #6B5318; }
    .chip-active   { background: #E7F0E8; color: var(--green-dark); }
    .chip-internal { background: #EEEDE9; color: var(--muted); }
    .chip-void     { background: #F7E7E4; color: var(--error); }
    .chip-ref      { background: #EFEDE6; color: var(--text); font-family: inherit; letter-spacing: 0.05em; }
    .styles-line { font-size: 11px; color: var(--muted); margin-top: 3px; }

    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
    .split > div { padding: 18px 20px; }
    .split > div + div { border-left: 1px solid var(--border); }
    .split h4 { font-size: 9px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
    .style-row { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; font-size: 12px; border-bottom: 1px dotted var(--border); }
    .style-row:last-child { border-bottom: none; }
    .style-row b { font-weight: 500; font-variant-numeric: tabular-nums; }
    .style-meta { font-size: 10px; color: var(--muted); }
    @media (max-width: 760px) {
      .split { grid-template-columns: 1fr; }
      .split > div + div { border-left: none; border-top: 1px solid var(--border); }
    }

    .chart-tools input[type="date"] { height: 30px; border: 1px solid var(--border); border-radius: 3px; padding: 0 8px; font-family: 'DM Sans', sans-serif; font-size: 12px; color: var(--text); background: var(--white); }
    .canvas-box { position: relative; height: 230px; }
    .legend { display: flex; gap: 20px; margin-top: 12px; font-size: 11px; color: var(--muted); }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 1px; margin-right: 6px; transform: translateY(1px); }

    .note { border-bottom: 1px solid var(--border); padding: 14px 0; }
    .note:first-of-type { padding-top: 0; }
    .note:last-of-type { border-bottom: none; padding-bottom: 0; }
    .note-meta { font-size: 10px; color: var(--muted); margin-bottom: 5px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .note-body { font-size: 13px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
    .note-actions { margin-top: 7px; display: flex; gap: 8px; }
    textarea { width: 100%; min-height: 72px; border: 1px solid var(--border); border-radius: 3px; padding: 9px 10px; font-family: 'DM Sans', sans-serif; font-size: 13px; line-height: 1.55; color: var(--text); background: var(--white); resize: vertical; }
    .note-form-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
    .note-counter { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .note-error { font-size: 11px; color: var(--error); margin-top: 7px; }
    .note-error.hidden { display: none; }

    .empty { padding: 26px 0; text-align: center; font-size: 12px; color: var(--muted); }
    .picker { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .picker select { height: 38px; min-width: 300px; max-width: 100%; border: 1px solid var(--border); border-radius: 3px; padding: 0 9px; font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text); background: var(--white); }

    #gate { padding: 70px 20px; text-align: center; font-size: 13px; color: var(--muted); line-height: 1.7; }
    .hidden { display: none !important; }
  </style>
</head>

<!-- 🔴 data-page="dealers" —— 本頁是 Dealers 的子頁,沿用既有導覽項。

      <!-- 1 · Trading summary -->

        <div class="card-head">

      <!-- 2 · Drafts sitting over N days -->

      <!-- 4 · Quotes raised per day -->
      <div class="card">
        <div class="card-head">

            <input type="date" id="chartFrom" aria-label="From"/>
            <input type="date" id="chartTo"   aria-label="To"/>

        </div>
        <div class="card-body">
          <div class="canvas-box"><canvas id="chartDaily"></canvas></div>
          <div class="legend">
            <span><i style="background:#3e5a42"></i>Submitted</span>
            <span><i style="background:#B9C4BB"></i>Still a draft</span>
          </div>
        </div>
      </div>

      <!-- 4 · Door styles -->
      <div class="card">
        <div class="card-head">
          <span class="card-title">Door styles</span>
          <span class="card-note" id="stylesNote"></span>
        </div>
        <div class="split">
          <div><h4>Bought</h4><div id="stylesBought"></div></div>
          <div><h4>In draft</h4><div id="stylesDraft"></div></div>
        </div>
      </div>

      <!-- 5 · Notes -->
      <div class="card">
        <div class="card-head">
          <span class="card-title">Notes</span>
          <span class="card-note" id="notesNote"></span>
        </div>
        <div class="card-body">

          <div class="note-form-row">

          <div class="note-error hidden" id="noteError"></div>
          <div id="notesList" style="margin-top:18px"></div>
        </div>
      </div>

      <!-- 6 · Returns -->
      <div class="card">
        <div class="card-head">
          <span class="card-title">Returns</span>
          <div class="card-tools">
            <input class="list-search" type="search" id="returnsSearch" placeholder="Search returns…" aria-label="Search returns"/>
            <span class="card-note" id="returnsNote"></span>
          </div>
        </div>
        <div id="returnsBody"></div>
        <div class="pager-bar hidden" id="returnsPager"></div>
      </div>

      <!-- 7 · Reminders -->
      <div class="card">
        <div class="card-head">
          <span class="card-title">Reminders</span>
          <span class="card-note" id="remindersNote"></span>
        </div>
        <div id="remindersBody"></div>
      </div>

      <!-- 8 · Current discount rules -->
      <div class="card">
        <div class="card-head">
          <span class="card-title">Current discount rules</span>
          <span class="card-note" id="rulesNote"></span>
        </div>

      <!-- 9 · Deleted drafts -->

          <span class="card-title">Deleted drafts</span>

      <!-- 10 · All quotes -->
      <div class="card">
        <div class="card-head">
          <span class="card-title">All quotes</span>
          <div class="card-tools">
            <input class="list-search" type="search" id="allSearch" placeholder="Search quotes…" aria-label="Search quotes"/>
            <span class="card-note" id="allNote"></span>

    </div><!-- /#detail -->

</div><!-- /.page -->

<script>
(function () {
'use strict';

/* ═══════════════════════════════════════════════════════════════════════
   CB-100 · dealer-detail.html  (U2 rev.2)
   ---------------------------------------------------------------------
   業務打電話前看的那一頁:這個客戶安靜多久了、卡了哪幾張單、買過什麼、
   有沒有人跟進過。

   🔴 存取:admin + super_admin。dealer 不可進入 —— 本頁顯示單一客戶的
      完整訂單與金額,若 dealer 可見等同客戶之間互相看到報價。
      ⚠️ 已知上限:F-101 未修之前,dealer 可自行把 role 改成 super_admin,
         之後前端守衛與 RLS 都會放行。本頁的保證上限受該債限制(CB-100
         票面已載明)。本頁單獨未增加曝險 —— 這些訂單與金額 admin 本來
         就從 admin-dealers 與 admin-quotes 看得到。

   rev.2(2026-09-29,業主逐項指定):
     · Trading summary 移到第一,新增 Silent for
     · 停滯 Draft 移到第二,加分頁(10/頁)與搜尋
     · 日柱狀圖改為 Draft / Submitted 兩段
     · Returns、All quotes 加分頁與搜尋
     · Reminders 明確標示 PO# / Draft#
     · 折扣規則標題改 Current,並註明歷史邊界
   ═══════════════════════════════════════════════════════════════════════ */

/* ── 🔴 F-214 · Internal Draft 判斷的第四份 ───────────────────────────
   同一條規則(status = 'Draft' 且 admin_notified_at IS NULL)目前存在於
   四處。四處【必須同步修改】,任一處不同步的症狀是「同一張單在一個頁面
   算內部草稿、在另一個頁面不算」,而且不報錯。

     dealer-detail.html   isInternalDraft()          ← 本處
     admin-quotes.html    isInternalDraft() / buildQuotesQuery()
     dashboard.html       init()
     quotes.html          loadQuotes()

   本票【不】抽共用元件:那要改 admin-quotes.html 的顯示端與篩選端兩處,
   而那兩處 CB-97 才剛處理完並互相指認過。在一張業務工具票裡重構訂單頁,
   風險與目的不成比例(PM4 2026-09-25 裁示)。
   收斂由 F-214 本票處理。 */

/* ── 定版判準(CB-100 Stage 1)──────────────────────────────────────── */

// 🔴 停滯判準用 created_at,不是「最後變動時間」—— 因為沒有可靠的後者:
//    quotes 沒有 updated_at(28 欄逐欄確認);snapshot_at 只在【品項寫入】
//    時更新,只改狀態、只改 job name、品項被清空都不會更新。
const STALE_DAYS = 14;

// 🔴 已入帳 = 狀態測試,不是 join payments。production 實查:Order
//    Processing 與 Order Completed 皆 100% 有確認付款,其他狀態 0。
const PAID_STATUSES = ['Order Processing', 'Order Completed'];

// 顯示名 ≠ 儲存值(CB-62:不翻譯 DB 值)。篩選一律用儲存值。
const STATUS_LABEL = { 'Returned': 'Revising', 'Pending': 'Waiting for Payment' };

// 三條資料流的起始日。各區塊須標示,否則「沒紀錄」會被讀成「沒發生」。
const DATA_SINCE = {
  orders: '2026-08-13',   // portal 上線
  views:  '2026-09-01'    // CB-85 page_views 開始記錄
};

const PAGE_SIZE   = 1000;   // PostgREST 讀取分頁
const PER_PAGE    = 10;     // 畫面清單每頁列數(業主指定)
const FEED_DAYS   = 90;     // 活動時間流回溯幾天
                            // 🔴 業主 2026-09-29 改為翻頁 + 摺疊,所以
                            //    不再設「只顯示前 N 筆」的上限:90 天內
                            //    全部進來,由分頁承接。回溯天數才是量的閘門。
const NOTE_MAX    = 2000;
const CHART_SENT  = '#3e5a42';
const CHART_DRAFT = '#B9C4BB';

/* ── 🔴 日期:一律走 ProCraftDate,本頁不自寫任何日曆運算 ────────────
   F-174 硬規則②:區間端點必須各自獨立換算,絕不可由起點加固定時長。
   2026-11-01 是 25 小時、2027-03-14 是 23 小時。
   使用前先確認函式存在,不存在即明確報錯 —— 【絕不 fallback 自算】。 */
const D = window.ProCraftDate;

function dateModuleReady() {
  return !!D
    && typeof D.todayET              === 'function'
    && typeof D.etYMD                === 'function'
    && typeof D.shiftYMD             === 'function'
    && typeof D.etDayStartUTC        === 'function'
    && typeof D.etDayEndExclusiveUTC === 'function'
    && typeof D.formatETDate         === 'function'
    && typeof D.formatETDateTime     === 'function';
}

/* 兩個 ET 日曆日相差幾天。
   🔴 只用已匯出的 etDayStartUTC,本頁不含任何日曆加減。
   🔴 Math.round 是必要的,不是保險:跨越 DST 的兩個 ET 午夜之間,實際
      毫秒數不是 86400000 的整數倍(相差最多一小時)。直接整除會在那些
      區間少算一天。誤差上限 1/24 天,四捨五入後必然精確。 */
function daysBetweenYMD(fromYMD, toYMD) {
  const a = D.etDayStartUTC(fromYMD);
  const b = D.etDayStartUTC(toYMD);
  if (!a || !b) return null;
  return Math.round((Date.parse(b) - Date.parse(a)) / 86400000);
}

// YMD 字串 → "Sep 8, 2026"。UTC 正午必定落在該 ET 日曆日,故可安全轉換。
function prettyYMD(ymd) { return ymd ? D.formatETDate(ymd + 'T12:00:00Z') : '—'; }

function money(n) { return '$' + Math.round(Number(n) || 0).toLocaleString('en-US'); }
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function statusLabel(v) { return STATUS_LABEL[v] || (v || '(no status)'); }

/* 🔴 單號的顯示必須標示【那是什麼號碼】。
   雙編號制:Draft 階段只有 draft_number,送出後才配 po_number。
   兩者混在同一格而不標示,看的人分不出「PDC09057」與「D00391」的差別,
   也就無從判斷這張單送出了沒有。 */
function refHTML(q) {
  if (!q) return '<span class="chip chip-void">Deleted quote</span>';
  if (q.po_number)    return 'PO <b>' + esc(q.po_number) + '</b>';
  if (q.draft_number) return 'Draft <b>' + esc(q.draft_number) + '</b>';
  return '<span class="styles-line">(no number)</span>';
}
function refText(q) {
  if (!q) return '';
  return (q.po_number || '') + ' ' + (q.draft_number || '');
}

/* ── 🔴 CB-97 · Internal Draft。== null 同時涵蓋 null 與 undefined,
      沿用 CB-97 原碼的比較方式,不改為 ===:select 欄位缺席時 undefined
      應視同未通知。見上方 F-214 四方對照。 */
function isInternalDraft(q) {
  return q.status === 'Draft' && q.admin_notified_at == null;
}

const sb = window.supabase.createClient(window.SB_URL, window.SB_KEY);
const el = (id) => document.getElementById(id);

function stopWith(html) {
  el('gate').innerHTML = html;
  el('gate').classList.remove('hidden');
  el('app').classList.add('hidden');
}

/* 分頁讀取。PostgREST 上限 1000 列且截斷時【不回錯誤】,單次 select
   在資料長大之後會靜默少拿。 */
async function readAll(table, columns, build) {
  const out = [];
  for (let from = 0; ; from += PAGE_SIZE) {
    let q = sb.from(table).select(columns);
    if (build) q = build(q);
    const { data, error } = await q.order('id', { ascending: true })
                                   .range(from, from + PAGE_SIZE - 1);
    if (error) throw new Error(table + ': ' + error.message);
    out.push.apply(out, data);
    if (data.length < PAGE_SIZE) return out;
    if (from > 200000) return out;   // 結構性守衛
  }
}

  feed: [], feedOpen: false,

async function enter() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.replace('login.html'); return false; }

  const { data: me, error } = await sb.from('dealers')
    .select('id,role,company_name,contact_name').eq('id', session.user.id).single();

  // 🔴 正向識別(F-35):確認角色【是】admin 或 super_admin。
  //    不寫 role !== 'dealer' —— 那在 role 為 null、空字串、或未來新增
  //    第四種角色時會放行,而且不報錯。
  // 🔴 CB-82 缺陷二:被 RLS 擋住與查無此列在應用層無法區分,兩者都導回。
  //    fail-closed 是對的:錯誤的「拒絕」成本是一次導向,錯誤的「放行」
  //    成本是資料外洩。
  const ALLOWED = ['admin', 'super_admin'];
  if (error || !me || ALLOWED.indexOf(me.role) === -1) {
    window.location.replace('dashboard.html');
    return false;
  }

  // 🔴 CB-82 授權出口。get_quote_stats() 在非 admin 時拋 42501,所以它
  //    回答「我有沒有讀取權」而不需要讀本頁要報告的任何一張表。通過之後,
  //    下面任何空結果才可安全解讀為「真的沒資料」—— 直接 select 永遠做
  //    不到這件事,因為 RLS 擋住時回的是 200 + []。
  const probe = await sb.rpc('get_quote_stats');
  if (probe.error) {
    stopWith('Your account cannot read order data.<br/>Ask a super admin to check your role.');
    return false;
  }

  S.me      = me.id;
  S.meName  = me.contact_name || me.company_name || 'Admin';
  S.isSuper = me.role === 'super_admin';
  return true;
}

async function loadDealers() {
  // 🔴 刻意不選任何定價欄位(stock_multiplier / non_stock_multiplier /
  //    frameless_multiplier / tax_rate / 九項 asm_fee_*)。本頁不需要,
  //    也不讓它們進到瀏覽器。
  const rows = await readAll('dealers',
    'id,company_name,contact_name,email,phone,city,state,role,account_type,assigned_sales_id,created_at,is_active');
  rows.forEach(d => S.dealers.set(d.id, d));
}

async function loadDealerData(dealerId) {
  const quotes = await readAll('quotes',
    'id,dealer_id,status,close_reason_type,grand_total,created_at,admin_notified_at,fulfillment_date,po_number,draft_number,job_name',
    q => q.eq('dealer_id', dealerId));

  // 🔴 Q-15(a):作廢的 Closed 排除。那是「改開新單」,舊單與新單同時存在,
  //    不排除就把同一筆生意算兩次。
  //    Cancelled 不排除 —— 那是生意真的沒了,只算過一次。
  S.quotes = quotes.filter(q => !(q.status === 'Closed' && q.close_reason_type));
  S.qById  = new Map(S.quotes.map(q => [q.id, q]));

  const ids = S.quotes.map(q => q.id);

  // 🔴 品項走 quote_items(live),【不】走 quote_item_snapshots。
  //    快照表的單層欄位每列重複,production 金額膨脹 32 倍;而且它只在
  //    品項寫入時刷新,對 Draft 可能是舊的。現存單的即時真相在 live 表。
  //    快照表在本頁只用於「已刪除的草稿」—— 那是它唯一無可取代之處。
  const items = ids.length
    ? await readAll('quote_items', 'id,quote_id,style_code,sku_code,quantity', q => q.in('quote_id', ids))
    : [];
  S.items = new Map();
  items.forEach(it => {
    if (!S.items.has(it.quote_id)) S.items.set(it.quote_id, []);
    S.items.get(it.quote_id).push(it);
  });

  // 門板目錄。style_code 唯一(CB-101 S-03 兩環境確認),165 列全取。
  // 🔴 只 join door_styles,不碰 skus_framed / skus_frameless —— 那兩表有
  //    123 個重疊 sku_code,必須經 construction_type 分岔。本頁不需要 SKU
  //    層屬性,所以那個坑在這裡不存在。
  const styles = await readAll('door_styles', 'style_code,style_name,brand,construction_type,is_stock');
  styles.forEach(s => S.styles.set(s.style_code, s));

  const [credits, reminders, rules, notes, views, events, feedViews, snaps] = await Promise.all([
    ids.length ? readAll('quote_store_credits',
      'id,quote_id,memo_number,reason,net_store_credit_amount,restocking_fee,created_at,created_by_name,voided_at',
      q => q.in('quote_id', ids)) : [],
    ids.length ? readAll('quote_reminders',
      'id,quote_id,type,subject,description,status,reminder_date,solved_date,created_at',
      q => q.in('quote_id', ids)) : [],
    readAll('dealer_discount_rules',
      'id,name,construction_type,door_styles,sku_codes,types,discount_type,discount_value,updated_at',
      q => q.eq('dealer_id', dealerId)),
    readAll('dealer_notes',
      'id,body,created_by,created_by_name,created_at,edited_at',
      q => q.eq('dealer_id', dealerId).is('deleted_at', null)),
    // 🔴 order desc + limit 1。單一客戶最多 3,261 筆瀏覽(實測),
    //    全撈會撞 PostgREST 上限;只要最後一筆就不受影響。
    sb.from('page_views').select('viewed_at,page')
      .eq('dealer_id', dealerId).order('viewed_at', { ascending: false }).limit(1),
    /* 🔴 活動時間流的兩個來源。
       ① account_events:【只取這個客戶自己做的事】(actor_id = dealerId)。
          業主 2026-09-29:「我只看 dealer 的行為」。
          ⚠️ 因此 admin 在這個客戶單上的操作【不會出現】—— 那些事件的
             actor_id 是 admin。這是刻意的範圍,不是遺漏。
          🟢 本表無 FK(CB-83 C-1 刻意設計),所以單被刪之後事件還在 ——
             「刪掉過幾張草稿」只有這裡看得到。
       ② page_views:回溯 FEED_DAYS 天。
          🔴 不能全撈 —— 單一客戶最多 3,261 筆(實測),會撞 PostgREST
             的 1000 上限,而 readAll 雖然能分頁,把三千多筆拉回來只為了
             顯示 20 行也不划算。用日期界線把量壓住。
          🔴 起點用 etDayStartUTC(ET 午夜),不是 now() 減毫秒 ——
             F-174 硬規則②。 */
    readAll('account_events',
      'id,occurred_at,event_type,status_value,po_number,draft_number,quote_id',
      q => q.eq('actor_id', dealerId)),
    readAll('page_views', 'id,viewed_at,page',
      q => q.eq('dealer_id', dealerId)
             .gte('viewed_at', D.etDayStartUTC(D.shiftYMD(S.today, -FEED_DAYS)))),
    readAll('quote_item_snapshots',
      'id,quote_id,draft_number,grand_total,status,snapshot_at,written_by_role',
      q => q.eq('dealer_id', dealerId))
  ]);

  S.credits   = credits;
  S.reminders = reminders.sort((a, b) => (a.created_at < b.created_at ? 1 : -1));
  S.rules     = rules;
  S.notes     = notes.sort((a, b) => (a.created_at < b.created_at ? 1 : -1));
  S.lastView  = (views && views.data && views.data[0]) || null;

  /* 活動時間流:把兩種來源合併成同一條流。
     🔴 page_views 【按 ET 日聚合成一行】,不逐筆列。
        逐筆的話,一天十幾次瀏覽會把建單、送出、刪單這些真正的動作完全
        淹沒 —— 而那些才是業務要看的。聚合後每天最多佔一行。
     🔴 日期分組用 etYMD(美東),不是 UTC ——
        美東 20:00 後的瀏覽用 UTC 分組會掉到隔天(F-174)。 */
  const feed = [];

  events.forEach(e => {
    feed.push({ at: e.occurred_at, kind: e.event_type, ev: e });
  });

  const viewsByDay = new Map();
  feedViews.forEach(v => {
    const d = D.etYMD(v.viewed_at);
    if (!d) return;
    if (!viewsByDay.has(d)) viewsByDay.set(d, { ymd: d, n: 0, last: v.viewed_at, pages: new Map() });
    const b = viewsByDay.get(d);
    b.n += 1;
    if (v.viewed_at > b.last) b.last = v.viewed_at;
    b.pages.set(v.page, (b.pages.get(v.page) || 0) + 1);
  });
  viewsByDay.forEach(b => feed.push({ at: b.last, kind: 'views', views: b }));

  S.feed = feed.sort((a, b) => (a.at < b.at ? 1 : a.at > b.at ? -1 : 0));

  /* 🔴 「客戶還在弄」的判準 —— 近 STALE_DAYS 天內品項有真實變動。
     兩個條件都是【正向識別】:

     ① written_by_role === 'authenticated'
        確認這【是】一次真實的 portal 寫入。
        🔴 不寫 !== 'backfill' —— 那是負向排除,未來多一種寫入來源
           (例如匯入工具)就會被誤當成客戶在改。
        必要性:production 的快照 89.9% 是 backfill,snapshot_at 全部
        是 2026-09-08 20:21:58 那一秒。少了這個條件,只要窗口長度超過
        (今天 − 2026-09-08),停滯單會【全部】變成「近期有動」。
        用正向條件讓窗口長度與正確性脫鉤。

     ② Date.parse 比較,不是字串比較
        PostgREST 回的是 "2026-09-08T20:21:58.93873+00:00",而
        etDayStartUTC 回的是 "2026-09-15T04:00:00.000Z"。兩種格式的
        字串序【不等於】時序,直接比大小會給出錯誤答案而且不報錯。

     ⚠️ 語意邊界:snapshot_at 只在【品項寫入】時刷新(trigger 掛
        quote_items 的 AFTER INSERT)。客戶只改 job name、或把品項清空
        (只 DELETE 無 INSERT)都不會刷新。所以這是「有動」的下界 ——
        沒被標記不代表客戶完全沒碰。 */
  const touchedFromMs = Date.parse(D.etDayStartUTC(S.cutoff));
  S.touched = new Set();
  snaps.forEach(s => {
    if (s.written_by_role !== 'authenticated') return;
    if (!s.snapshot_at) return;
    if (Date.parse(s.snapshot_at) < touchedFromMs) return;
    S.touched.add(s.quote_id);
  });

  // 已刪除的草稿 = 快照有、母體沒有。
  // 🔴 grand_total 是單層欄位,每一列都重複帶一份 → 必須先去重到一單一列,
  //    否則金額被放大成品項列數倍(production 實測 32 倍)。
  const live = new Set(ids);
  const goneMap = new Map();
  snaps.forEach(s => {
    if (live.has(s.quote_id)) return;
    if (!goneMap.has(s.quote_id)) {
      goneMap.set(s.quote_id, {
        quote_id: s.quote_id, draft_number: s.draft_number,
        grand_total: s.grand_total, status: s.status,
        snapshot_at: s.snapshot_at, rows: 0
      });
    }
    goneMap.get(s.quote_id).rows += 1;
  });
  S.gone = Array.from(goneMap.values())
    .sort((a, b) => (a.snapshot_at < b.snapshot_at ? 1 : -1));
}

/* ═══════════════════════════════════════════════════════════════════════
   清單元件 —— 搜尋 + 分頁
   一份實作供三個清單共用(停滯 Draft / Returns / All quotes)。
   🔴 搜尋與分頁都在【記憶體】進行:資料在 load 階段已全部取回,
      單一客戶的量級(最多數十列)不需要伺服端分頁。
   🔴 搜尋改變時 page 必須歸零 —— 否則在第 3 頁輸入條件會得到一個空畫面,
      而使用者看不出那是「這一頁沒有」還是「沒有符合的」。
   ═══════════════════════════════════════════════════════════════════════ */

function defineList(key, cfg) {
  S.lists[key] = {
    rows: cfg.rows, cols: cfg.cols, search: cfg.search,
    empty: cfg.empty, noteText: cfg.noteText || '',
    unit: cfg.unit || 'record',
    page: 0, term: '',
    bodyId: key + 'Body', noteId: key + 'Note',
    pagerId: key + 'Pager', searchId: key + 'Search'
  };
  paintList(key);
}

function filteredRows(L) {
  if (!L.term) return L.rows;
  const t = L.term.toLowerCase();
  return L.rows.filter(r => String(L.search(r) || '').toLowerCase().indexOf(t) !== -1);
}

function paintList(key) {
  const L = S.lists[key];
  if (!L) return;
  const rows  = filteredRows(L);
  const total = rows.length;
  const pages = Math.max(1, Math.ceil(total / PER_PAGE));
  if (L.page > pages - 1) L.page = pages - 1;
  if (L.page < 0) L.page = 0;

  const start = L.page * PER_PAGE;
  const slice = rows.slice(start, start + PER_PAGE);

  // 標題列:總數 + 搜尋中的說明。
  // 🔴 搜尋有結果與沒結果必須分得出來,否則使用者不知道是條件太窄還是真的沒有。
  const noteEl = el(L.noteId);
  if (noteEl) {
    noteEl.textContent = L.term
      ? total + ' of ' + L.rows.length + ' match'
      : (L.rows.length
          ? L.rows.length + ' ' + L.unit + (L.rows.length === 1 ? '' : 's')
            + (L.noteText ? ' · ' + L.noteText : '')
          : L.noteText);
  }

  const body = el(L.bodyId);
  if (!total) {
    body.innerHTML = '<div class="empty">' +
      esc(L.term ? 'Nothing matches “' + L.term + '”.' : L.empty) + '</div>';
  } else {
    body.innerHTML =
      '<table><thead><tr>' + L.cols.map(c =>
        '<th' + (c.num ? ' class="num"' : '') + '>' + esc(c.label) + '</th>').join('') +
      '</tr></thead><tbody>' +
      slice.map(r => '<tr>' + L.cols.map(c =>
        '<td' + (c.num ? ' class="num"' : '') + '>' + c.get(r) + '</td>').join('') + '</tr>').join('') +
      '</tbody></table>';
  }

  const pager = el(L.pagerId);
  if (!pager) return;
  if (total <= PER_PAGE) { pager.classList.add('hidden'); pager.innerHTML = ''; return; }
  pager.classList.remove('hidden');
  pager.innerHTML =
    '<span class="pager-info">' + (start + 1) + '–' + Math.min(start + PER_PAGE, total)
      + ' of ' + total + '</span>' +
    '<button class="btn-plain" type="button" data-nav="prev"' + (L.page === 0 ? ' disabled' : '') + '>Prev</button>' +
    '<button class="btn-plain" type="button" data-nav="next"' + (L.page >= pages - 1 ? ' disabled' : '') + '>Next</button>';
}

function wireList(key) {
  const L = S.lists[key];
  if (!L) return;
  const input = el(L.searchId);
  if (input) {
    input.addEventListener('input', () => {
      L.term = input.value.trim();
      L.page = 0;              // 🔴 見上:條件改變必須回第一頁
      paintList(key);
    });
  }
  const pager = el(L.pagerId);
  if (pager) {
    pager.addEventListener('click', e => {
      const b = e.target.closest('button[data-nav]');
      if (!b || b.disabled) return;
      L.page += (b.getAttribute('data-nav') === 'next' ? 1 : -1);
      paintList(key);
    });
  }
}

/* 不需要搜尋分頁的簡單表格(Reminders / 折扣規則 / 已刪草稿)。 */
function plainTable(bodyId, noteId, rows, cols, emptyText, noteText) {
  const n = el(noteId);
  if (n) n.textContent = rows.length
    ? rows.length + ' record' + (rows.length === 1 ? '' : 's') + (noteText ? ' · ' + noteText : '')
    : (noteText || '');
  if (!rows.length) { el(bodyId).innerHTML = '<div class="empty">' + esc(emptyText) + '</div>'; return; }
  el(bodyId).innerHTML =
    '<table><thead><tr>' + cols.map(c =>
      '<th' + (c.num ? ' class="num"' : '') + '>' + esc(c.label) + '</th>').join('') +
    '</tr></thead><tbody>' +
    rows.map(r => '<tr>' + cols.map(c =>
      '<td' + (c.num ? ' class="num"' : '') + '>' + c.get(r) + '</td>').join('') + '</tr>').join('') +
    '</tbody></table>';
}

/* ═══════════════════════════════════════════════════════════════════════
   Render
   ═══════════════════════════════════════════════════════════════════════ */

function dealerName(d) {
  if (!d) return 'Unassigned';
  return d.company_name || d.contact_name || '(unnamed)';
}

function stylesOf(quoteIds) {
  const counts = new Map();
  quoteIds.forEach(qid => (S.items.get(qid) || []).forEach(it => {
    if (!it.style_code) return;
    counts.set(it.style_code, (counts.get(it.style_code) || 0) + (Number(it.quantity) || 0));
  }));
  return Array.from(counts.entries())
    .map(([code, qty]) => ({ code, qty, row: S.styles.get(code) || null }))
    .sort((a, b) => b.qty - a.qty);
}

/* 5 · Door styles —— 與上方圖表的日期區間【連動】(業主 2026-09-29)。

   🔴 共用的軸是 created_at(開單日),與圖表同一根。
      所以「Bought」的語意是【在這段期間開的單當中,後來成交的那些】,
      不是「在這段期間成交的」。八月開、九月成交的單算在八月。
      兩個區塊若各用各的軸(一個開單日、一個出貨日),同一個畫面上會出現
      兩個對不起來的期間,而且看不出來。共用一根軸是刻意的取捨。

   🔴 生效區間必須顯示在本卡片的標題列上。
      控制項在上一張卡片裡,改了之後這裡跟著變 —— 不標出來,使用者會
      以為看到的是全期間。 */
function renderDoorStyles() {
  const from = el('chartFrom').value, to = el('chartTo').value;
  const inRange = (q) => {
    const d = D.etYMD(q.created_at);
    return d && (!from || d >= from) && (!to || d <= to);
  };

  const scoped = S.quotes.filter(inRange);
  renderStyleList('stylesBought', stylesOf(
    scoped.filter(q => PAID_STATUSES.indexOf(q.status) !== -1).map(q => q.id)));
  renderStyleList('stylesDraft', stylesOf(
    scoped.filter(q => q.status === 'Draft').map(q => q.id)));

  el('stylesNote').textContent =
    'Quotes raised ' + prettyYMD(from) + ' – ' + prettyYMD(to)
    + ' · follows the date range above';
}

function renderStyleList(target, list) {
  if (!list.length) { el(target).innerHTML = '<div class="empty">Nothing yet.</div>'; return; }
  el(target).innerHTML = list.map(s => {
    const r = s.row;
    // 🔴 is_stock 只作中性標示,【不】當警示旗標:production 165 個門板
    //    風格中 155 個是 non-stock,亮燈會 94% 都亮。它影響的是交期,
    //    業務會被問「什麼時候能到」,所以值得顯示,但不該是紅字。
    const meta = r
      ? esc(r.brand || '') + (r.construction_type ? ' · ' + esc(r.construction_type) : '')
        + (r.is_stock === true ? ' · stock' : r.is_stock === false ? ' · non-stock' : '')
      : 'not in catalog';
    return '<div class="style-row"><span>' + esc(r ? (r.style_name || s.code) : s.code)
         + '<div class="style-meta">' + meta + '</div></span><b>' + s.qty + '</b></div>';
  }).join('');
}

/* 1 · Trading summary ─────────────────────────────────────────────────── */
function renderSummary() {
  const paid   = S.quotes.filter(q => PAID_STATUSES.indexOf(q.status) !== -1);
  const drafts = S.quotes.filter(q => q.status === 'Draft');

  // 退貨淨額。🔴 net_store_credit_amount 存的是【負值】(與
  //    quotes.account_credit_amount 同慣例),所以是【加】不是減。
  // 🔴 已作廢的 memo 不可計入 —— 那是被撤銷的退貨,扣了等於算兩次。
  const creditSum = S.credits.filter(c => !c.voided_at)
    .reduce((s, c) => s + (Number(c.net_store_credit_amount) || 0), 0);
  const paidValue = paid.reduce((s, q) => s + (Number(q.grand_total) || 0), 0) + creditSum;

  /* 🔴 Silent for —— 業主指定 B 案:以 fulfillment_date 為基準。
     ⚠️ 語意是【出貨】不是【付款】。剛付完錢、還在排產的單不會更新
        fulfillment_date,所以一個很活躍的客戶也可能顯示很大的沉默天數。
        因此下方必須同時顯示「已付款待出貨」的張數 —— 那個數字存在時,
        沉默天數就不可單獨解讀。
     📌 真正的付款日在 payments.confirmed_at,本頁刻意不讀該表(業主
        2026-09-29 決定 B 案,維持本頁的資料源不變)。 */
  const shipped = paid.filter(q => q.fulfillment_date)
                      .sort((a, b) => (a.fulfillment_date < b.fulfillment_date ? 1 : -1));
  const lastShip  = shipped[0] || null;
  const silentFor = lastShip ? daysBetweenYMD(lastShip.fulfillment_date, S.today) : null;
  const inFlight  = paid.filter(q => !q.fulfillment_date).length;

  const viewYMD   = S.lastView ? D.etYMD(S.lastView.viewed_at) : null;
  const sinceView = viewYMD ? daysBetweenYMD(viewYMD, S.today) : null;

  const facts = [
    { label: 'Silent for',
      value: lastShip ? silentFor + (silentFor === 1 ? ' day' : ' days') : 'Never ordered',
      cls:   'big' + (lastShip && silentFor > 60 ? ' stale' : (lastShip ? '' : ' stale')),
      sub:   (lastShip ? 'since last order shipped, ' + prettyYMD(lastShip.fulfillment_date) : 'no shipped order on record')
             + (inFlight ? ' · ' + inFlight + ' paid, awaiting shipment' : '') },
    { label: 'Paid value', value: money(paidValue), cls: 'big',
      sub: paid.length + ' paid ' + (paid.length === 1 ? 'quote' : 'quotes') },
    { label: 'Quotes', value: String(S.quotes.length),
      sub: drafts.length + ' still a draft' },
    { label: 'Last seen in portal',
      value: viewYMD ? sinceView + (sinceView === 1 ? ' day' : ' days') + ' ago' : 'No record',
      sub: viewYMD ? prettyYMD(viewYMD) : 'visits recorded since ' + prettyYMD(DATA_SINCE.views) }
  ];

  el('summaryFacts').innerHTML = facts.map(f =>
    '<div><div class="fact-label">' + esc(f.label) + '</div>' +
    '<div class="fact-value ' + (f.cls || '') + '">' + f.value + '</div>' +
    (f.sub ? '<div class="fact-sub">' + f.sub + '</div>' : '') + '</div>'
  ).join('');

  // 🔴 「沒紀錄」不等於「沒發生」。瀏覽紀錄 2026-09-01 才開始,
  //    而 login 事件是 best-effort(CB-83 C-3),缺漏不代表沒登入。
  el('summaryNote').textContent =
    'Paid means Order Processing or Order Completed. Orders tracked since '
    + prettyYMD(DATA_SINCE.orders) + '.';
}

/* 2 · 停滯 Draft ──────────────────────────────────────────────────────── */
function buildStuck() {
  // 🔴 門檻比較用 YMD 字串。"YYYY-MM-DD" 的字串序等於時序,所以篩選邊界
  //    與日期分組用的是同一組單位 —— 這是邊界不會差一天的原因。
  return S.quotes
    .filter(q => q.status === 'Draft' && D.etYMD(q.created_at) < S.cutoff)
    .map(q => {
      const ymd   = D.etYMD(q.created_at);
      const items = S.items.get(q.id) || [];
      const codes = Array.from(new Set(items.map(i => i.style_code).filter(Boolean)));
      return {
        q, ymd, age: daysBetweenYMD(ymd, S.today),
        touched: S.touched.has(q.id),
        itemCount: items.reduce((s, i) => s + (Number(i.quantity) || 0), 0),
        styles: codes.map(c => { const r = S.styles.get(c); return r ? (r.style_name || c) : c; })
      };
    })
    .sort((a, b) => (b.age || 0) - (a.age || 0));
}

function renderStuck() {
  el('stuckDays').textContent = String(STALE_DAYS);
  const rows = buildStuck();
  const total = rows.reduce((s, x) => s + (Number(x.q.grand_total) || 0), 0);
  const internal = rows.filter(x => isInternalDraft(x.q)).length;
  const touched  = rows.filter(x => x.touched).length;

  defineList('stuck', {
    rows: rows,
    unit: 'draft',
    noteText: money(total)
      + (internal ? ' · ' + internal + ' built internally' : '')
      + (touched  ? ' · ' + touched  + ' still being edited' : ''),
    empty: 'No draft has been sitting more than ' + STALE_DAYS + ' days.',
    search: x => refText(x.q) + ' ' + (x.q.job_name || '') + ' ' + x.styles.join(' '),
    cols: [
      { label: 'Draft', get: x =>
          '<a href="quote-detail.html?id=' + encodeURIComponent(x.q.id) + '">' + refHTML(x.q) + '</a>'
          + (x.q.job_name ? '<div class="styles-line">' + esc(x.q.job_name) + '</div>' : '') },
      { label: 'Idle', num: true, get: x =>
          '<span class="idle">' + (x.age == null ? '—' : x.age + 'd') + '</span>'
          + '<div class="styles-line">' + esc(prettyYMD(x.ymd)) + '</div>' },
      { label: 'Value', num: true, get: x => money(x.q.grand_total) },
      { label: 'Items', num: true, get: x =>
          x.itemCount + (x.styles.length
            ? '<div class="styles-line">' + esc(x.styles.slice(0, 3).join(', '))
              + (x.styles.length > 3 ? ' +' + (x.styles.length - 3) : '') + '</div>'
            : '') },
      // 三個旗標全部正向識別 —— 確認它【是】某種情形,不用「不是 X」排除。
      { label: 'Where it stands', get: x =>
          isInternalDraft(x.q) ? '<span class="chip chip-internal">Built internally</span>'
        : x.touched            ? '<span class="chip chip-active">Customer still editing</span>'
        :                        '<span class="chip chip-stale">Untouched</span>' }
    ]
  });
}

/* 3 · Recent activity ─────────────────────────────────────────────────── */

/* 事件 → 一句話。
   🔴 event_type 的四個值由 record_account_event() 以字面值產生,不由資料
      衍生(CB-83 欄位 COMMENT),所以可以正向列舉。
   🔴 查無對應時印出【DB 原值】,不吞掉 —— 日後新增第五種事件會看得見,
      而不是靜默消失。 */
function feedLabel(e) {
  const ref = e.po_number   ? 'PO <b>' + esc(e.po_number) + '</b>'
            : e.draft_number ? 'draft <b>' + esc(e.draft_number) + '</b>'
            : 'a quote';
  switch (e.event_type) {
    case 'login':         return 'Logged in';
    case 'quote_created': return 'Created ' + ref;
    case 'quote_deleted': return 'Deleted ' + ref;
    case 'status_change': return 'Moved ' + ref + ' to <b>'
                               + esc(statusLabel(e.status_value)) + '</b>';
    default:              return esc(e.event_type) + ' · ' + ref;
  }
}

/* 🔴 摺疊預設【收起】(業主 2026-09-29:這張表太長)。
   收起狀態下標題列仍必須說出「有多少、到哪一天、範圍是什麼」——

function renderFeed() {
  /* 🔴 警語貼在【缺口】上,不貼在資料上。
     login 由前端呼叫寫入,網路失敗就漏(CB-83 C-3 best-effort)。
     但那描述的是「查不到」的可信度,不是「查得到的那幾筆」的可信度 ——
     所以只在這段期間【一筆登入都沒有】時才講,因為只有那時候看的人
     會從「沒有」推論出東西。 */
  const hasLogin = S.feed.some(r => r.kind === 'login');
  const caveat = hasLogin ? '' : ' · no login recorded, and logins are best-effort';

  defineList('feed', {
    rows: S.feed,
    unit: 'entry',
    noteText: 'last ' + FEED_DAYS + ' days · this dealer’s own actions only' + caveat,
    empty: 'No activity recorded. Visits are logged since ' + prettyYMD(DATA_SINCE.views) + '.',
    // 本清單刻意沒有搜尋框(DOM 裡沒有 feedSearch),wireList 會自動略過。
    search: () => '',
    cols: [
      { label: 'When', get: r =>
          '<span style="white-space:nowrap">' + esc(D.formatETDate(r.at)) + '</span>'
          + '<div class="styles-line">' + esc(D.formatETDateTime(r.at).split(', ').slice(-1)[0]) + '</div>' },
      { label: 'What', get: r => {
          if (r.kind === 'views') {
            const b = r.views;
            // 當天看最多的三個頁面。🔴「到過 new-quote-step3」是最接近
            // 「按了送出前一刻」的訊號 —— portal 沒有任何點擊記錄。
            const top = Array.from(b.pages.entries())
              .sort((a, c) => c[1] - a[1]).slice(0, 3).map(p => p[0]);
            return 'Viewed ' + b.n + (b.n === 1 ? ' page' : ' pages')
              + '<div class="styles-line">' + esc(top.join(', '))
              + (b.pages.size > 3 ? ' +' + (b.pages.size - 3) : '') + '</div>';
          }
          // 🔴 login 這一列【不加】任何 best-effort 警語。
          //    那句話描述的是「沒有紀錄」的意思,不是「這筆紀錄」的意思。
          //    掛在每一筆真實發生的登入上,等於叫人連看得到的資料都不要信 ——
          //    意思剛好相反。警語只在【完全沒有登入紀錄】時出現一次,
          //    見下方 renderFeed() 的 noteText。
          return feedLabel(r.ev);
        } }
    ]
  });
}

/* 4 · 日柱狀圖 ────────────────────────────────────────────────────────── */
function renderChart() {
  const from = el('chartFrom').value, to = el('chartTo').value;
  if (!from || !to || from > to) return;

  /* 🔴 兩段的定義(業主 2026-09-29 指定改為 Draft / Submitted):
       Still a draft = status === 'Draft'(含 Internal Draft —— 它也是草稿)
       Submitted     = 其餘全部
     作廢的 Closed 已在 load 階段排除,所以剩下的非 Draft 都確實送出過。 */
  const labels = [], sent = [], draft = [];
  const byDay = new Map();
  S.quotes.forEach(q => {
    const d = D.etYMD(q.created_at);
    if (!d || d < from || d > to) return;
    if (!byDay.has(d)) byDay.set(d, { s: 0, d: 0 });
    if (q.status === 'Draft') byDay.get(d).d += 1; else byDay.get(d).s += 1;
  });

  // 完整日期序列,沒有單的日子補 0。
  // 🔴 只給圖表「有資料的日子」會讓 x 軸自己壓縮,看起來像天天有單。
  // 🔴 逐日推進一律用 shiftYMD(日曆加減),不可用毫秒累加。
  let cur = from, guard = 0;
  while (cur <= to && guard++ < 4000) {
    const b = byDay.get(cur) || { s: 0, d: 0 };
    labels.push(prettyYMD(cur)); sent.push(b.s); draft.push(b.d);
    cur = D.shiftYMD(cur, 1);
    if (!cur) break;
  }

  if (S.chart) { S.chart.destroy(); S.chart = null; }
  S.chart = new Chart(el('chartDaily'), {
    type: 'bar',
    data: { labels: labels, datasets: [
      { label: 'Submitted',     data: sent,  backgroundColor: CHART_SENT,  borderWidth: 0 },
      { label: 'Still a draft', data: draft, backgroundColor: CHART_DRAFT, borderWidth: 0 }
    ]},
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: 'index', intersect: false },
      scales: {
        x: { stacked: true, grid: { display: false },
             ticks: { color: '#7A8C82', maxRotation: 0, autoSkipPadding: 18, font: { size: 10 } } },
        y: { stacked: true, beginAtZero: true, border: { display: false },
             grid: { color: '#ECEAE3' },
             ticks: { color: '#7A8C82', precision: 0, font: { size: 10 } } }
      },
      plugins: { legend: { display: false },
                 tooltip: { backgroundColor: '#2C3A32', padding: 10 } }
    }
  });
}

    rows: S.quotes.slice().sort((a, b) => (a.created_at < b.created_at ? 1 : -1)),
    unit: 'quote',
    noteText: 'Voided quotes reissued as new ones are left out.',
    empty: 'This dealer has no quotes.',
    search: q => refText(q) + ' ' + (q.job_name || '') + ' '
               + (q.status || '') + ' ' + statusLabel(q.status),
    cols: [
      { label: 'Quote', get: q =>
          '<a href="quote-detail.html?id=' + encodeURIComponent(q.id) + '">' + refHTML(q) + '</a>'
          + (q.job_name ? '<div class="styles-line">' + esc(q.job_name) + '</div>' : '') },
      { label: 'Status', get: q => esc(statusLabel(q.status))
          + (isInternalDraft(q) ? ' <span class="chip chip-internal">Internal</span>' : '') },
      { label: 'Value', num: true, get: q => money(q.grand_total) },
      { label: 'Raised', get: q => esc(D.formatETDate(q.created_at)) },
      { label: 'Shipped', get: q => esc(q.fulfillment_date ? prettyYMD(q.fulfillment_date) : '—') }
    ]
  });
}

function renderAll() {
  renderHeader();
  renderSummary();
  renderStuck();
  renderFeed();
  renderNotes();
  renderRest();

  ['stuck', 'feed', 'returns', 'all'].forEach(wireList);
  setFeedOpen(false);   // 預設收起

  resetRange();
}

/* 日期區間是【兩個區塊共用】的:圖表與 Door styles。
   🔴 一律經由 applyRange() 觸發,不要有任何地方只呼叫 renderChart() ——
      漏掉的那一處會讓兩個區塊顯示不同期間,而且畫面上看不出來。 */
function applyRange() {
  renderChart();
  renderDoorStyles();
}

function resetRange() {
  const days = S.quotes.map(q => D.etYMD(q.created_at)).filter(Boolean).sort();
  el('chartFrom').value = days[0] || D.shiftYMD(S.today, -60);
  el('chartTo').value   = S.today;
  applyRange();
}

/* ═══════════════════════════════════════════════════════════════════════
   Notes · 寫入
   🔴 F-124:每頁三個 GoTrueClient,token 失效期間的寫入會被 RLS 擋下並
      回 HTTP 200 + 0 列。所以每一次寫入都必須帶 count: 'exact' 並斷言
      列數 —— 【不可】以 error === null 判斷成功,那會讓使用者看到
      「已儲存」而實際沒存進來。
   ═══════════════════════════════════════════════════════════════════════ */

function noteError(msg) {
  const box = el('noteError');
  if (!msg) { box.classList.add('hidden'); box.textContent = ''; return; }
  box.textContent = msg;
  box.classList.remove('hidden');
}

async function addNote() {
  const body = el('noteInput').value.trim();
  noteError('');
  if (!body) { noteError('Type something first.'); return; }

  const { data, error, count } = await sb.from('dealer_notes')
    .insert({
      dealer_id: S.dealerId, body: body,
      created_by: S.me,                 // RLS 要求 created_by = auth.uid()
      created_by_name: S.meName         // 快照,不記 auth.role()(F-195)
    }, { count: 'exact' })
    .select('id,body,created_by,created_by_name,created_at,edited_at');

  if (error) { noteError('Not saved: ' + error.message); return; }
  if (count !== 1 || !data || data.length !== 1) {
    noteError('Not saved — the database accepted nothing. Reload the page and sign in again.');
    return;
  }

  el('noteInput').value = '';
  updateCounter();
  S.notes.unshift(data[0]);
  renderNotes();
}

async function saveEdit(id, body) {
  noteError('');
  if (!body.trim()) { noteError('A note cannot be empty. Delete it instead.'); return; }

  // 🔴 edited_at 刻意【不】送 —— 由 DB 的 trigger 在 body 變動時蓋上。
  //    前端送會有漏送的可能,而漏送的症狀是「改過的註記看起來沒被改過」。
  const { data, error, count } = await sb.from('dealer_notes')
    .update({ body: body.trim() }, { count: 'exact' })
    .eq('id', id)
    .select('id,body,created_by,created_by_name,created_at,edited_at');

  if (error) { noteError('Not saved: ' + error.message); return; }
  if (count !== 1) { noteError('Not saved — only the author can edit a note.'); return; }

  const i = S.notes.findIndex(n => n.id === id);
  if (i !== -1) S.notes[i] = data[0];
  S.editingNote = null;
  renderNotes();
}

async function deleteNote(id) {
  noteError('');
  if (!window.confirm('Delete this note? It disappears from the page for everyone.')) return;

  // 🔴 軟刪除,不是真 DELETE。表上沒有 DELETE policy、也沒有 DELETE GRANT。
  //    deleted_at 與 deleted_by 必須同時寫(CHECK 配對)。
  const { error, count } = await sb.from('dealer_notes')
    .update({ deleted_at: new Date().toISOString(), deleted_by: S.me }, { count: 'exact' })
    .eq('id', id);

  if (error) { noteError('Not deleted: ' + error.message); return; }
  if (count !== 1) {
    noteError('Not deleted — only the author or a super admin can remove a note.');
    return;
  }
  S.notes = S.notes.filter(n => n.id !== id);
  renderNotes();
}

function updateCounter() {
  el('noteCounter').textContent = el('noteInput').value.length + ' / ' + NOTE_MAX;
}

/* ═══════════════════════════════════════════════════════════════════════
   Wiring
   ═══════════════════════════════════════════════════════════════════════ */

function buildPicker() {
  const list = [];
  // 🔴 正向識別:只列 role === 'dealer' 的帳號。員工帳號不是客戶。
  S.dealers.forEach(d => { if (d.role === 'dealer') list.push(d); });
  list.sort((a, b) => dealerName(a).localeCompare(dealerName(b)));
  el('pickerSelect').innerHTML = '<option value="">— pick a dealer —</option>' + list.map(d =>
    '<option value="' + esc(d.id) + '">' + esc(dealerName(d))
    + (d.is_active ? '' : ' (inactive)') + '</option>').join('');
}

function wire() {
  el('pickerGo').addEventListener('click', () => {
    const v = el('pickerSelect').value;
    if (v) window.location.search = '?dealer=' + encodeURIComponent(v);
  });
  el('pickerSelect').addEventListener('keydown', e => { if (e.key === 'Enter') el('pickerGo').click(); });

  el('chartFrom').addEventListener('change', applyRange);
  el('chartTo').addEventListener('change', applyRange);
  el('chartReset').addEventListener('click', resetRange);

  el('feedToggle').addEventListener('click', () => setFeedOpen(!S.feedOpen));

  el('noteInput').addEventListener('input', updateCounter);
  el('noteSave').addEventListener('click', addNote);

  el('notesList').addEventListener('click', e => {
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    const act = btn.getAttribute('data-act');
    const id  = btn.getAttribute('data-id');
    if (act === 'edit')             { S.editingNote = id; renderNotes(); }
    else if (act === 'cancel-edit') { S.editingNote = null; renderNotes(); }
    else if (act === 'save-edit')   {
      const ta = el('notesList').querySelector('.note-edit');
      if (ta) saveEdit(id, ta.value);
    }
    else if (act === 'delete')      { deleteNote(id); }
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   Boot
   ═══════════════════════════════════════════════════════════════════════ */

(async function boot() {
  try {
    // 🔴 日期模組檢查必須在任何日期運算之前,且【不可】fallback 自算。
    //    自算的症狀是 2026-11-01 那天算錯一天,而且不報錯。
    if (!dateModuleReady()) {
      stopWith('The date module is out of date (components/date-utils.js).<br/>' +
               'Hard-reload the page (Ctrl+Shift+R). If that does not help, this page needs ' +
               'etYMD and shiftYMD, which were added in CB-100.');
      return;
    }
    if (typeof window.Chart !== 'function') {
      stopWith('The chart library did not load. Check the network connection and reload.');
      return;
    }

    if (!(await enter())) return;

    S.today  = D.todayET();
    S.cutoff = D.shiftYMD(S.today, -STALE_DAYS);
    if (!S.today || !S.cutoff) {
      stopWith('Could not work out today&rsquo;s date in US Eastern. Reload the page.');
      return;
    }

    await loadDealers();

    const wanted = new URLSearchParams(window.location.search).get('dealer');

    el('gate').classList.add('hidden');
    el('app').classList.remove('hidden');

    if (!wanted || !S.dealers.get(wanted)) {
      // 🔴 授權出口已通過,所以「查不到」在這裡確實是「不存在」,
      //    不是「被 policy 擋住」。這個區分是 CB-82 缺陷二的重點。
      if (wanted) el('pickerTitle').textContent = 'That dealer no longer exists — pick another';
      buildPicker();
      el('pickerCard').classList.remove('hidden');
      wire();
      return;
    }

    S.dealer   = S.dealers.get(wanted);
    S.dealerId = wanted;
    await loadDealerData(wanted);

    el('detail').classList.remove('hidden');
    wire();
    updateCounter();
    renderAll();

  } catch (e) {
    console.error('[CB-100]', e);
    stopWith('Could not load this dealer: ' + esc(e && e.message ? e.message : 'unknown error') +
             '<br/>Reload the page; if it keeps failing, the database may be unreachable.');
  }
})();

})();
</script>
