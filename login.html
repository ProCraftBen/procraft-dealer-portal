<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ProCraft Dealer Portal — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    /* ── DESIGN PREVIEW ONLY ──────────────────────────────────────────
       視覺外殼展示用,無任何 auth / reCAPTCHA / config.js。
       用 Ben 現有 brand tokens,只調 layout + 字級 + 間距。 */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold:        #C9A84C;
      --gold-soft:   #d8bd6e;
      --green-deep:  #24352a;   /* new: brand panel base, deeper than green-dark */
      --green-dark:  #3e5a42;
      --green-mid:   #4a6b4f;
      --cream:       #F5F2EC;
      --text:        #2C3A32;
      --muted:       #7A8C82;
      --border:      #DDD8CC;
      --error:       #C0392B;
    }
    html, body {
      min-height: 100%;
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      background: var(--cream);
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 20px;
      background:
        radial-gradient(ellipse 60% 55% at 90% 8%, rgba(201,168,76,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 6% 92%, rgba(14,31,22,0.05) 0%, transparent 55%),
        var(--cream);
    }

    /* ── Shell: split-screen card ─────────────────────────────────── */
    .shell {
      width: 100%;
      max-width: 920px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 18px 60px rgba(36,53,42,0.14);
      animation: fadeUp 0.7s ease forwards;
    }

    /* ── Left: brand panel (the signature) ────────────────────────── */
    .brand {
      position: relative;
      background:
        radial-gradient(ellipse 80% 60% at 20% 0%, rgba(201,168,76,0.14) 0%, transparent 55%),
        linear-gradient(160deg, #2b3f2f 0%, var(--green-deep) 100%);
      color: #EDE9DF;
      padding: 48px 44px;
      display: flex;
      flex-direction: column;
    }
    /* hairline gold frame — the "cabinet inlay" detail */
    .brand::after {
      content: '';
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(201,168,76,0.28);
      border-radius: 3px;
      pointer-events: none;
    }
    .brand-mark {
      width: 56px; height: 56px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(201,168,76,0.35);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 26px;
    }
    .brand-mark img { width: 40px; height: 40px; object-fit: contain; }
    .brand-eyebrow {
      font-size: 11px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 20px;
    }
    .brand-line {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
      font-size: 38px;
      line-height: 1.18;
      color: #F6F2E8;
      max-width: 12ch;
    }
    .brand-line em { color: var(--gold-soft); font-style: italic; }
    .brand-spacer { flex: 1; min-height: 40px; }
    .brand-list {
      display: flex;
      gap: 26px;
      padding-top: 22px;
      border-top: 1px solid rgba(201,168,76,0.22);
    }
    .brand-list span {
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(237,233,223,0.72);
    }

    /* ── Right: form ──────────────────────────────────────────────── */
    .form {
      padding: 56px 52px;
      display: flex;
      flex-direction: column;
    }
    .form-head { margin-bottom: 30px; }
    .card-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 34px;
      font-weight: 500;
      line-height: 1.1;
      color: var(--green-dark);
      margin-bottom: 8px;
    }
    .card-subtitle { font-size: 14px; color: var(--muted); }

    .error-msg, .info-msg {
      border-radius: 4px;
      padding: 11px 14px;
      font-size: 13px;
      margin-bottom: 18px;
      display: none;
    }
    .error-msg.show, .info-msg.show { display: block; }
    .error-msg { background: rgba(192,57,43,0.07); border: 1px solid rgba(192,57,43,0.25); color: var(--error); }
    .info-msg  { background: rgba(62,90,66,0.06); border: 1px solid rgba(62,90,66,0.22); color: var(--green-dark); }

    .field { margin-bottom: 20px; }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #58685e;
      margin-bottom: 8px;
    }
    .field input {
      width: 100%;
      background: #FAFAF8;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 14px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }
    .field input::placeholder { color: #C4C0B8; }
    .field input:focus {
      border-color: var(--green-mid);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(74,107,79,0.10);
    }
    .forgot {
      display: block;
      text-align: right;
      font-size: 13px;
      color: var(--gold);
      text-decoration: none;
      margin-top: -6px;
      margin-bottom: 26px;
      transition: color 0.2s;
    }
    .forgot:hover { color: #a8862f; text-decoration: underline; }

    .btn-login {
      width: 100%;
      background: var(--green-dark);
      border: none;
      border-radius: 4px;
      padding: 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #fff;
      cursor: pointer;
      transition: background 0.2s, transform 0.05s;
      min-height: 52px;
    }
    .btn-login:hover { background: var(--green-mid); }
    .btn-login:active { transform: translateY(1px); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

    .divider-or { display: flex; align-items: center; gap: 14px; margin: 24px 0; }
    .divider-or::before, .divider-or::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .divider-or span { font-size: 11px; letter-spacing: 0.15em; color: var(--muted); text-transform: uppercase; }

    .btn-apply {
      width: 100%;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #58685e;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
      min-height: 52px;
      text-align: center;
      display: block;
      line-height: 24px;
    }
    .btn-apply:hover { border-color: var(--gold); color: #a8862f; background: rgba(201,168,76,0.04); }

    .card-footer {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: #A9A69E;
      text-align: center;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) { .shell { animation: none; } }

    /* ── Responsive: stack under 780px ────────────────────────────── */
    /* Mobile: brand panel collapses to a short header band; weight goes to the form */
    @media (max-width: 780px) {
      .shell { grid-template-columns: 1fr; max-width: 440px; }
      .brand { padding: 26px 30px 22px; }
      .brand::after { inset: 10px; }
      .brand-mark { width: 44px; height: 44px; margin-bottom: 14px; }
      .brand-mark img { width: 30px; height: 30px; }
      .brand-eyebrow { font-size: 10px; margin-bottom: 12px; }
      .brand-line { font-size: 24px; max-width: 22ch; }
      .brand-spacer { display: none; }
      .brand-list { display: none; }   /* drop the row on mobile to keep the band short */
      .form { padding: 38px 32px; }
      .card-title { font-size: 30px; }
    }
    @media (max-width: 480px) {
      body { padding: 16px; }
      .brand { padding: 24px 26px 20px; }
      .brand-line { font-size: 22px; }
      .form { padding: 34px 26px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <!-- LEFT: brand panel -->
    <div class="brand">
      <div class="brand-mark">
        <img src="https://acwgemgpnusworpxxoai.supabase.co/storage/v1/object/public/assets/ProCraft-DC-Logo-white.png" alt="ProCraft DC"/>
      </div>
      <div class="brand-eyebrow">ProCraft Cabinetry · DC</div>
      <div class="brand-line">Built to last, <em>designed to elevate.</em></div>
      <div class="brand-spacer"></div>
      <div class="brand-list">
        <span>Configure</span>
        <span>Quote</span>
        <span>Get&nbsp;Paid</span>
      </div>
    </div>

    <!-- RIGHT: form -->
    <div class="form">
      <div class="form-head">
        <div class="card-title">Sign In</div>
        <div class="card-subtitle">Enter your credentials to access your account.</div>
      </div>

      <div class="error-msg" id="errorMsg"></div>
      <div class="info-msg" id="infoMsg"></div>

      <div class="field">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="you@company.com" autocomplete="email"/>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
      </div>
      <a href="#" class="forgot" id="forgotLink" onclick="forgotPassword(event)">Forgot password? / First time here?</a>
      <button class="btn-login" id="loginBtn">Sign In</button>

      <div class="divider-or"><span>or</span></div>
      <a href="https://dc.procraftcabinetry.com/become-a-dealer/" target="_blank" class="btn-apply">Apply to Become a Dealer</a>

      <div class="card-footer">© 2026 ProCraft Cabinetry DC · All rights reserved</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const { createClient } = supabase;
    const _supabase = createClient(
      window.SB_URL,
      window.SB_KEY
    );

    // ═══════════════════════════════════════════════════════════════════
    // CB-42 | Google reCAPTCHA v3 Login Gate
    // -------------------------------------------------------------------
    // 目的:Intuit / QuickBooks Payments 上架合規要求(CB-43 promote 前置)。
    //
    // 流程:頁面載入時預載 reCAPTCHA script(使右下角 badge 顯示,合規必需)
    //       → 使用者點 Sign In 時才 grecaptcha.execute() 取 token
    //       → POST verify-recaptcha Edge Function 驗 score
    //       → 通過才呼叫 Supabase Auth。
    //
    // ⚠️ script 預載、token 延後取,兩者必須分開:
    //    · script 若延後到點擊才載入 → badge 不會出現 → 違反 Google 條款
    //    · token 若在頁面載入時就取 → 120 秒後過期 → 使用者慢慢打字就失效
    //
    // ⚠️ Kill switch(window.RECAPTCHA_ENABLED,定義於 config.js)
    //    平常必須為 true。設為 false 會完全跳過 reCAPTCHA 驗證,
    //    僅限以下兩種情況使用:
    //      1. 緊急:reCAPTCHA 大量誤擋真人,導致 dealer 無法登入
    //      2. Debug:本地或排錯時暫時關閉
    //    使用後必須立即開 ticket 追蹤並在修復後改回 true。
    //
    // ⚠️ Fail-open 政策(Q-1 決議)
    //    網路層失敗(script 載入失敗 / timeout / fetch error / HTTP 5xx)
    //      → 放行,並以 console.error 留下 audit log
    //    明確拒絕(HTTP 4xx / Google 回 success:false / score 過低)
    //      → 擋下
    //    理由:避免 Google 或 Edge Function 故障造成全站無法登入。
    //
    // ⚠️ 已知限制(記錄用,非 blocker)
    //    此為前端 gate。Supabase Auth REST endpoint 本身仍為公開,
    //    直接呼叫可繞過本驗證。本 ticket 定位為合規勾選項,非安全控制。
    // ═══════════════════════════════════════════════════════════════════

    const RECAPTCHA_SITE_KEY   = window.RECAPTCHA_SITE_KEY || '';
    const RECAPTCHA_ENABLED    = (window.RECAPTCHA_ENABLED !== false) && !!RECAPTCHA_SITE_KEY;
    const RECAPTCHA_VERIFY_URL = (window.SB_URL || '') + '/functions/v1/verify-recaptcha';
    const RECAPTCHA_LOAD_TIMEOUT_MS = 10000;

    // 使用 recaptcha.net 而非 google.com:google.com 在部分地區(中國大陸)
    // 無法連線,會導致 script 永久 pending。recaptcha.net 為 Google 官方
    // 替代網域,使用同一組 site key。
    const RECAPTCHA_HOST = 'https://www.recaptcha.net';

    if (!RECAPTCHA_SITE_KEY) {
      console.error('[CB-42] RECAPTCHA_SITE_KEY not found in config.js — reCAPTCHA gate disabled.');
    } else if (window.RECAPTCHA_ENABLED === false) {
      console.error('[CB-42] reCAPTCHA gate is DISABLED via kill switch (RECAPTCHA_ENABLED = false).');
    }

    function logFailOpen(reason, detail) {
      console.error('[CB-42] Fail-open triggered', {
        reason: reason,
        detail: detail || null,
        timestamp: new Date().toISOString()
      });
    }

    // 單例 Promise:重複呼叫不會重複插入 script tag。
    let _recaptchaLoader = null;

    function loadRecaptcha() {
      if (_recaptchaLoader) return _recaptchaLoader;

      _recaptchaLoader = new Promise(function (resolve, reject) {
        if (window.grecaptcha && window.grecaptcha.execute) {
          resolve();
          return;
        }

        let settled = false;
        const timer = setTimeout(function () {
          if (settled) return;
          settled = true;
          reject(new Error('recaptcha_script_timeout'));
        }, RECAPTCHA_LOAD_TIMEOUT_MS);

        const s = document.createElement('script');
        s.src   = RECAPTCHA_HOST + '/recaptcha/api.js?render=' + encodeURIComponent(RECAPTCHA_SITE_KEY);
        s.async = true;
        s.defer = true;

        s.onload = function () {
          if (settled) return;
          if (!window.grecaptcha || !window.grecaptcha.ready) {
            settled = true;
            clearTimeout(timer);
            reject(new Error('recaptcha_object_missing'));
            return;
          }
          window.grecaptcha.ready(function () {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            resolve();
          });
        };

        s.onerror = function () {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          reject(new Error('recaptcha_script_error'));
        };

        document.head.appendChild(s);
      });

      // 載入失敗時清掉 cache,讓使用者重試時可以再試一次。
      _recaptchaLoader.catch(function () { _recaptchaLoader = null; });

      return _recaptchaLoader;
    }

    // 頁面載入即預載 script,讓右下角 reCAPTCHA badge 顯示(Google 條款要求)。
    // 此處「不」取 token,token 一律在使用者點擊當下才取,避免 120 秒過期。
    // 預載失敗不擋任何流程,點擊時會自動重試。
    if (RECAPTCHA_ENABLED) {
      loadRecaptcha().catch(function (e) {
        logFailOpen('recaptcha_preload_failed', String((e && e.message) || e));
      });
    }

    // 呼叫後端驗證。回傳 { ok, failOpen?, score?, reason? }
    async function verifyRecaptchaToken(token, action) {
      let res;
      try {
        res = await fetch(RECAPTCHA_VERIFY_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': window.SB_KEY
          },
          body: JSON.stringify({ token: token, action: action })
        });
      } catch (e) {
        logFailOpen('verify_network_error', String((e && e.message) || e));
        return { ok: true, failOpen: true };
      }

      if (res.status >= 500) {
        logFailOpen('verify_server_error', 'HTTP ' + res.status);
        return { ok: true, failOpen: true };
      }

      if (!res.ok) {
        console.error('[CB-42] Verification rejected by endpoint', { status: res.status });
        return { ok: false, reason: 'verify_http_' + res.status };
      }

      let data;
      try {
        data = await res.json();
      } catch (e) {
        logFailOpen('verify_invalid_json', String((e && e.message) || e));
        return { ok: true, failOpen: true };
      }

      if (data && data.success === true) {
        return { ok: true, score: data.score };
      }

      console.error('[CB-42] Verification failed', {
        score:  data ? data.score : null,
        reason: data ? data.reason : null
      });
      return { ok: false, reason: (data && data.reason) || 'verification_failed' };
    }

    // 完整 gate:取 token → 驗證。回傳 { ok, ... }
    async function recaptchaGate(action) {
      if (!RECAPTCHA_ENABLED) {
        return { ok: true, skipped: true };
      }

      let token;
      try {
        await loadRecaptcha();
        token = await window.grecaptcha.execute(RECAPTCHA_SITE_KEY, { action: action });
      } catch (e) {
        logFailOpen('recaptcha_client_error', String((e && e.message) || e));
        return { ok: true, failOpen: true };
      }

      if (!token) {
        logFailOpen('recaptcha_empty_token', 'action=' + action);
        return { ok: true, failOpen: true };
      }

      return await verifyRecaptchaToken(token, action);
    }

    // ═══════════════════════════════════════════════════════════════════
    // Login
    // ═══════════════════════════════════════════════════════════════════

    const loginBtn   = document.getElementById('loginBtn');
    const forgotLink = document.getElementById('forgotLink');
    const errMsg     = document.getElementById('errorMsg');
    const infoMsg    = document.getElementById('infoMsg');

    let busy = false;

    function showError(text) {
      infoMsg.classList.remove('show');
      errMsg.textContent = text;
      errMsg.classList.add('show');
    }

    function showInfo(text) {
      errMsg.classList.remove('show');
      infoMsg.textContent = text;
      infoMsg.classList.add('show');
    }

    function clearMessages() {
      errMsg.classList.remove('show');
      infoMsg.classList.remove('show');
    }

    function setBusy(state, label) {
      busy = state;
      loginBtn.disabled     = state;
      loginBtn.textContent  = label || 'Sign In';
      forgotLink.style.pointerEvents = state ? 'none' : '';
      forgotLink.style.opacity       = state ? '0.5' : '';
    }

    // Enter key support
    document.getElementById('email').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') document.getElementById('password').focus();
    });
    document.getElementById('password').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !busy) doLogin();
    });
    loginBtn.addEventListener('click', function () {
      if (!busy) doLogin();
    });

    // ─────────────────────────────────────────────────────────────────────
    // CB-53 U4 — 登入後回跳(Guard 3 的 login 端)
    //
    // ⚠️ B-14:staging 掛在子目錄 /procraft-dealer-portal-staging/,
    //    production 在網域根目錄;且 procraftben.github.io 是 GitHub Pages
    //    共享網域,同帳號每個 repo 共用同一個 origin。因此:
    //      • 基準必須用 new URL('.', location.href) 執行期推導,絕不硬寫路徑
    //      • 只比對 origin 不夠 —— 還要求 pathname 以 appBase.pathname 開頭,
    //        否則同 origin 的跨 repo 跳轉擋不住
    //
    // ⚠️ B-03:任一道校驗失敗一律靜默落回預設去處,不提示、不重試。
    // ⚠️ B-08:profile_completed 閘門不可被 redirect 繞過。
    // ─────────────────────────────────────────────────────────────────────
    const CB53_REDIRECT_WHITELIST = ['new-quote-step3.html'];

    function cb53GetSafeRedirect() {
      try {
        const raw = new URLSearchParams(window.location.search).get('redirect');
        if (!raw) return null;
        if (raw.indexOf('..') !== -1) return null;                         // 路徑穿越
        if (raw.charAt(0) === '/' || raw.charAt(0) === '\\') return null;  // //evil.com、絕對路徑

        const appBase = new URL('.', window.location.href);                // B-14: 執行期推導
        const target  = new URL(raw, appBase);

        if (target.origin !== window.location.origin) return null;
        if (target.pathname.indexOf(appBase.pathname) !== 0) return null;  // B-14: 前綴校驗

        const file = target.pathname.slice(appBase.pathname.length);
        if (CB53_REDIRECT_WHITELIST.indexOf(file) === -1) return null;

        return target.pathname + target.search;                            // 丟棄 hash
      } catch (_) {
        return null;
      }
    }

    // 登入後去處。既有優先序完全不變(admin → profile gate → dashboard),
    // 只在「admin 預設」與「dashboard 預設」兩處插入 redirect。
    function cb53ResolveLoginTarget(dealer) {
      if (['admin','super_admin'].includes(dealer?.role)) {
        return cb53GetSafeRedirect() || 'admin.html';
      }
      if (!dealer?.profile_completed) {
        return 'dealer-profile.html';        // B-08: 不可被 redirect 繞過
      }
      return cb53GetSafeRedirect() || 'dashboard.html';
    }

    async function doLogin() {
      if (busy) return;

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showError('Please enter your email and password.');
        return;
      }

      clearMessages();
      setBusy(true, 'Verifying...');

      try {
        // ── CB-42 gate ──
        const gate = await recaptchaGate('login');
        if (!gate.ok) {
          showError('Verification failed. Please refresh the page and try again.');
          return;
        }

        loginBtn.textContent = 'Signing in...';

        const { data, error } = await _supabase.auth.signInWithPassword({ email, password });

        if (error) {
          showError('Invalid email or password. Please try again.');
          return;
        }

        const { data: dealer } = await _supabase
          .from('dealers')
          .select('role, is_active, profile_completed')
          .eq('id', data.user.id)
          .single();

        if (!dealer?.is_active) {
          await _supabase.auth.signOut();
          showError('Your account has been deactivated. Please contact ProCraft DC.');
          return;
        }

        window.location.href = cb53ResolveLoginTarget(dealer);   // CB-53

      } catch (e) {
        console.error('[login] Unexpected error', e);
        showError('Something went wrong. Please try again.');
      } finally {
        setBusy(false, 'Sign In');
      }
    }

    // Already logged in?
    _supabase.auth.getSession().then(async function(result) {
      if (result.data.session) {
        const { data: dealer } = await _supabase
          .from('dealers')
          .select('role, is_active, profile_completed')
          .eq('id', result.data.session.user.id)
          .single();
        if (!dealer?.is_active) {
          await _supabase.auth.signOut();
          return;
        }
        window.location.href = cb53ResolveLoginTarget(dealer);   // CB-53
      }
    });

    // ═══════════════════════════════════════════════════════════════════
    // Forgot password
    // reCAPTCHA action = 'forgot_password'(與 login 分開計分)
    // ═══════════════════════════════════════════════════════════════════

    async function forgotPassword(e) {
      e.preventDefault();
      if (busy) return;

      const email = document.getElementById('email').value.trim();
      if (!email) {
        showError('Please enter your email address first.');
        return;
      }

      clearMessages();
      setBusy(true, 'Verifying...');

      try {
        const gate = await recaptchaGate('forgot_password');
        if (!gate.ok) {
          showError('Verification failed. Please refresh the page and try again.');
          return;
        }

        loginBtn.textContent = 'Sending...';

        await _supabase.auth.resetPasswordForEmail(email, {
          redirectTo: new URL('reset-password.html', window.location.href).href,
        });

        showInfo('If this email is registered, a reset link has been sent. Please check your inbox.');

      } catch (err) {
        console.error('[forgotPassword] Unexpected error', err);
        showError('Something went wrong. Please try again.');
      } finally {
        setBusy(false, 'Sign In');
      }
    }
  </script>
</body>
</html>
