  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FuSang Vision — 登入</title>
  <!-- v2 視覺（共用版型 §10 公開頁：品牌列 / 主視覺 / 右側卡片）-->
  <link rel="stylesheet" href="fs-v2.css" />
  <style>
    /* login 專屬：只剩細節，版型全在 fs-v2.css §10 */
    .fs-v2 .login-forgot { display: flex; justify-content: flex-end; margin: -8px 0 20px; }
    .fs-v2 .login-btn-arrow { font-family: var(--v2-font-latin); font-size: 15px; line-height: 1; transition: transform .2s; }
    .fs-v2 .login-btn:hover:not(:disabled) .login-btn-arrow { transform: translateX(4px); }
    @media (prefers-reduced-motion: reduce) { .fs-v2 .login-btn-arrow { transition: none; } }
  </style>
</head>
<body class="login-body fs-v2">

<!-- 品牌列（公開頁不放主選單）＋ 語言切換 -->
<header class="v2-auth-bar">
  <a class="v2-auth-brand" href="https://fusang-vision.com/" aria-label="FuSang Vision">
    <img src="assets/fusangvision_trans_graph_only_0706.png" alt="" />
    <span class="v2-auth-brand-name">FuSang Vision</span>
  </a>
  <div class="v2-auth-lang login-lang" id="login-lang" role="group" aria-label="Language">
    <button type="button" class="login-lang-opt" data-lang="zh-TW" lang="zh-TW">繁中</button>
    <button type="button" class="login-lang-opt" data-lang="zh-CN" lang="zh-CN">简中</button>
    <button type="button" class="login-lang-opt" data-lang="en" lang="en">EN</button>
    <button type="button" class="login-lang-opt" data-lang="ja" lang="ja">日本語</button>
  </div>
</header>

<main class="fs-page v2-auth-stage login-page" id="fs-main" tabindex="-1">

  <!-- 左：品牌語（壓在主視覺留白處）-->
  <div class="v2-auth-intro">
    <p class="v2-auth-eyebrow"><span data-i18n="login.craft">紫微斗數</span> · FuSang Vision</p>
    <h2 class="v2-auth-headline" data-i18n-html="login.heroTitle">
      不是預知命運，<br>而是<span class="accent">穩健有意識地</span><br>走向嚮往的生活。
    </h2>
    <p class="v2-auth-lead" data-i18n-html="login.heroSub">
      您的命盤已備妥。<br>以您專屬的能量地圖，理解此刻所在，看見前行方向。
    </p>
  </div>

  <!-- 右：登入卡片 -->
  <div class="v2-auth-card">
    <p class="v2-auth-card-eyebrow" data-i18n="login.welcomeBack">Welcome Back</p>
    <h1 class="v2-auth-title" data-i18n="login.title">登入</h1>
    <p class="v2-auth-sub" data-i18n="login.subtitle">繼續您的能量探索</p>

    <div id="login-error" class="v2-auth-msg v2-auth-msg--error login-error" role="alert"></div>
    <div id="login-success" class="v2-auth-msg v2-auth-msg--ok login-success" role="status"></div>

    <form id="login-form" novalidate>
      <div class="v2-field">
        <label for="email" data-i18n="login.email">電子郵件</label>
        <input type="email" id="email" name="email" autocomplete="email" required />
      </div>
      <div class="v2-field">
        <label for="password" data-i18n="login.password">密碼</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
      </div>
      <div class="login-forgot">
        <a id="forgot-link" class="v2-auth-link" role="button" tabindex="0" data-i18n="login.forgot">忘記密碼？</a>
      </div>
      <button type="submit" id="login-btn" class="v2-auth-submit login-btn">
        <span id="login-btn-text" data-i18n="login.submit">登入</span>
        <span class="login-btn-arrow" aria-hidden="true">→</span>
      </button>
    </form>

    <!-- 建立帳號：官網表單（2026-09 起由官網維護）-->
    <div class="v2-auth-alt">
      <span data-i18n="login.noChartQ">還沒有命盤？</span><br>
      <a href="https://fusang-vision.com/pages/create-account" data-i18n="login.createLink">建立您的本命盤</a>
    </div>
  </div>

</main>

<div id="site-footer"></div>

<script type="module">
  import { supabase, getSession } from './components.js';

  const F = window.FSI18N;

  // ── 頁內語言切換(只動 UI 字串;此頁無報告內容)──
  const langBox = document.getElementById('login-lang');
  function markLang() {
    const cur = F.getUILang();
    langBox.querySelectorAll('.login-lang-opt').forEach((b) => {
      b.classList.toggle('active', b.getAttribute('data-lang') === cur);
    });
    document.title = F.t('login.docTitle');
  }
  langBox.querySelectorAll('.login-lang-opt').forEach((b) => {
    b.addEventListener('click', () => F.setUILang(b.getAttribute('data-lang')));
  });
  markLang();
  window.addEventListener('i18n:changed', markLang);

  // ── 登入後分流：admin → admin-dashboard.html；其餘 → dashboard.html ──
  // admin_check RPC 失敗時保守導向 dashboard.html（admin 頁本身仍有後端把關）
  async function routeAfterAuth() {
    let target = 'dashboard.html';
    try {
      const { data: isAdmin, error } = await supabase.rpc('admin_check');
      if (!error && isAdmin === true) target = 'admin-dashboard.html';
    } catch (_) {}
    window.location.href = target;
  }

  // 已登入直接分流
  (async () => {
    const session = await getSession();
    if (session) await routeAfterAuth();
  })();

  const form = document.getElementById('login-form');
  const btn = document.getElementById('login-btn');
  const btnText = document.getElementById('login-btn-text');
  const errorBox = document.getElementById('login-error');
  const successBox = document.getElementById('login-success');
  const forgotLink = document.getElementById('forgot-link');

  function showError(msg) {
    successBox.classList.remove('active');
    errorBox.textContent = msg;
    errorBox.classList.add('active');
  }
  function showSuccess(msg) {
    errorBox.classList.remove('active');
    successBox.textContent = msg;
    successBox.classList.add('active');
  }
  function clearMessages() {
    errorBox.classList.remove('active');
    successBox.classList.remove('active');
  }
  function setLoading(loading) {
    btn.disabled = loading;
    btnText.textContent = loading ? F.t('login.loading') : F.t('login.submit');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearMessages();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !password) { showError(F.t('login.errEmptyFields')); return; }

    setLoading(true);

    const { data, error } = await supabase.auth.signInWithPassword({ email, password });

    if (error) {
      console.error('Login error:', error);
      let msg = F.t('login.errGeneric');
      if (error.message?.toLowerCase().includes('invalid login credentials')) {
        msg = F.t('login.errBadCreds');
      } else if (error.message?.toLowerCase().includes('email not confirmed')) {
        msg = F.t('login.errNotConfirmed');
      }
      showError(msg);
      setLoading(false);
      return;
    }

    if (data?.session) {
      await routeAfterAuth();
    } else {
      showError(F.t('login.errRetry'));
      setLoading(false);
    }
  });

  // v2：忘記密碼改為可用鍵盤觸發（Enter / 空白鍵）
  forgotLink.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); forgotLink.click(); }
  });

  forgotLink.addEventListener('click', async () => {
    clearMessages();
    const email = document.getElementById('email').value.trim();

    if (!email) { showError(F.t('login.errForgotNoEmail')); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showError(F.t('login.errBadEmail')); return; }

    forgotLink.style.pointerEvents = 'none';
    forgotLink.textContent = F.t('login.sending');

    const redirectTo = window.location.origin + window.location.pathname.replace(/login\.html$/, '') + 'set-password.html';
    const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo });

    forgotLink.style.pointerEvents = '';
    forgotLink.textContent = F.t('login.forgot');

    if (error) {
      console.error('Reset password error:', error);
      showError(F.t('login.errResetFail'));
      return;
    }

    showSuccess(F.t('login.resetSent'));
  });
</script>

<script type="module" src="components.js"></script>

</body>
</html>
