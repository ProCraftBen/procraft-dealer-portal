<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title data-i18n="pay.page.title">ProCraft — Payment</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold:#C9A84C; --gold-light:#E2C97E; --green-dark:#3e5a42; --green-mid:#4a6b4f;
      --cream:#F5F2EC; --text:#2C3A32; --muted:#7A8C82; --border:#DDD8CC; --bg:#F5F2EC; --white:#FFFFFF;
      --error:#C0392B; --ok:#16A34A;
      --status-draft:#9B59B6;
      --status-pending:#C9A84C; --status-processing:#3B82F6; --status-complete:#16A34A; --status-closed:#6B7280;
      --status-returned:#E07B39;
    }
    html, body { min-height: 100%; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); }

    .page { max-width: 720px; margin: 0 auto; padding: 32px 20px 60px; }

    .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); text-decoration: none; margin-bottom: 16px; transition: color 0.15s; }
    .back-link:hover { color: var(--green-dark); }

    .card { background: var(--white); border: 1px solid var(--border); border-radius: 4px; padding: 28px; }
    .card + .card { margin-top: 16px; }

    .card-title { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 400; color: var(--green-dark); margin-bottom: 4px; }
    .card-sub { font-size: 12px; color: var(--muted); margin-bottom: 22px; }

    /* Quote summary strip */
    .quote-strip { display: flex; flex-wrap: wrap; gap: 20px 32px; padding: 16px 18px; background: #F5F3EF; border: 1px solid var(--border); border-radius: 4px; margin-bottom: 22px; }
    .qs-item { display: flex; flex-direction: column; gap: 3px; }
    .qs-label { font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); }
    .qs-value { font-size: 14px; font-weight: 500; color: var(--text); }
    .qs-value.po { color: var(--green-dark); }
    .qs-value.total { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 500; color: var(--green-dark); }

    /* Method option cards */
    .methods { display: flex; flex-direction: column; gap: 12px; margin-bottom: 22px; }
    .method-opt { display: block; border: 1px solid var(--border); border-radius: 4px; padding: 16px 18px; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
    .method-opt:hover { border-color: var(--gold); }
    .method-opt.selected { border-color: var(--green-dark); background: rgba(62,90,66,0.03); }
    .method-opt input { position: absolute; opacity: 0; pointer-events: none; }
    .mo-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .mo-name { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; color: var(--text); }
    .mo-radio { width: 18px; height: 18px; border: 2px solid var(--border); border-radius: 50%; flex-shrink: 0; position: relative; transition: border-color 0.15s; }
    .method-opt.selected .mo-radio { border-color: var(--green-dark); }
    .method-opt.selected .mo-radio::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--green-dark); }
    .mo-total { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 500; color: var(--green-dark); white-space: nowrap; }
    .mo-fee { font-size: 12px; color: var(--muted); margin-top: 8px; padding-left: 28px; }

    /* Generic amount breakdown rows (card/ach detail, check) */
    .amount-rows { border: 1px solid var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 22px; }
    .amount-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; font-size: 13px; }
    .amount-row + .amount-row { border-top: 1px solid var(--border); }
    .amount-row .lbl { color: var(--muted); }
    .amount-row .val { font-weight: 500; }
    .amount-row.grand { background: #F5F3EF; }
    .amount-row.grand .lbl { color: var(--green-dark); font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; font-size: 11px; }
    .amount-row.grand .val { font-family: 'Cormorant Garamond', serif; font-size: 20px; color: var(--green-dark); }

    /* Buttons */
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: 3px; padding: 12px 22px; font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer; transition: background 0.2s, border-color 0.2s, color 0.2s; text-decoration: none; }
    .btn-primary { background: var(--green-dark); color: #fff; }
    .btn-primary:hover { background: var(--green-mid); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { border-color: var(--text); color: var(--text); }
    .btn .spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.35); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
    .btn.loading .spinner { display: inline-block; }
    .btn.loading .btn-text { opacity: 0.7; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Inline notices */
    .notice { border-radius: 3px; padding: 12px 16px; font-size: 13px; line-height: 1.55; margin-bottom: 18px; }
    .notice.error { background: rgba(192,57,43,0.07); border: 1px solid rgba(192,57,43,0.25); color: var(--error); }
    .notice.info  { background: rgba(59,130,246,0.06); border: 1px solid rgba(59,130,246,0.25); color: #2c5aa0; }
    .notice.warn  { background: rgba(201,168,76,0.10); border: 1px solid rgba(201,168,76,0.35); color: #8a6d1f; }
    .notice.ok    { background: rgba(22,163,74,0.08);  border: 1px solid rgba(22,163,74,0.3);  color: #15803d; }
    .notice.hidden { display: none; }

    /* Big status blocks (completed / blocked / success / waiting) */
    .state-block { text-align: center; padding: 26px 10px 8px; }
    .state-icon { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
    .state-icon svg { width: 28px; height: 28px; }
    .state-icon.ok    { background: rgba(22,163,74,0.1); }
    .state-icon.ok svg    { fill: var(--ok); }
    .state-icon.block { background: rgba(192,57,43,0.08); }
    .state-icon.block svg { fill: var(--error); }
    .state-icon.wait  { background: rgba(59,130,246,0.08); }
    .state-heading { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 400; color: var(--green-dark); margin-bottom: 8px; }
    .state-text { font-size: 13px; color: var(--muted); line-height: 1.6; max-width: 420px; margin: 0 auto 22px; }

    .wait-spinner { width: 30px; height: 30px; border: 3px solid rgba(59,130,246,0.2); border-top-color: var(--status-processing); border-radius: 50%; animation: spin 0.9s linear infinite; margin: 0 auto; }

    .status-badge { display: inline-block; padding: 4px 12px; border-radius: 2px; font-size: 10px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
    .status-badge.processing { background: rgba(59,130,246,0.1); color: var(--status-processing); }
    .status-badge.confirmed  { background: rgba(22,163,74,0.1);  color: var(--status-complete); }
    .status-badge.failed     { background: rgba(192,57,43,0.08); color: var(--error); }
    .status-badge.cancelled  { background: rgba(107,114,128,0.1); color: var(--status-closed); }

    /* Check upload */
    .pay-to { padding: 14px 16px; background: #F5F3EF; border: 1px solid var(--border); border-radius: 4px; margin-bottom: 8px; }
    .pay-to .lbl { font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .pay-to .val { font-size: 15px; font-weight: 500; color: var(--green-dark); }
    .check-help { font-size: 12px; color: var(--muted); line-height: 1.6; margin-bottom: 18px; }
    .qb-note { font-size: 12px; color: var(--muted); line-height: 1.55; margin-bottom: 18px; }

    .upload-zone { border: 1.5px dashed var(--border); border-radius: 4px; padding: 24px 18px; text-align: center; cursor: pointer; transition: border-color 0.15s, background 0.15s; margin-bottom: 8px; }
    .upload-zone:hover { border-color: var(--gold); background: rgba(201,168,76,0.03); }
    .upload-zone svg { width: 30px; height: 30px; fill: var(--muted); margin-bottom: 10px; }
    .upload-zone .uz-main { font-size: 13px; color: var(--text); }
    .upload-zone .uz-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .upload-zone.has-file { border-color: var(--green-dark); border-style: solid; background: rgba(62,90,66,0.03); }
    .uz-filename { font-size: 13px; color: var(--green-dark); font-weight: 500; word-break: break-all; }
    .heic-note { font-size: 11px; color: var(--muted); margin-bottom: 18px; line-height: 1.5; }
    .sample-check { margin-bottom: 18px; }
    .sample-check .sc-label { font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
    .sample-check img.sample-check-img { width: 100%; border: 1px solid var(--border); border-radius: 4px; display: block; }
    .sample-check .sc-box { width: 100%; aspect-ratio: 2.2 / 1; border: 1.5px dashed var(--border); border-radius: 4px;
      background: repeating-linear-gradient(45deg, #faf9f6, #faf9f6 10px, #f3f1ea 10px, #f3f1ea 20px);
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: var(--muted); gap: 4px; }
    .sample-check .sc-box .sc-main { font-size: 13px; }
    .sample-check .sc-box .sc-dim { font-size: 11px; }

    /* ── CB-56 項目 B:Proceed 前確認 modal(沿用 quotes.html 的 .modal-* 命名與視覺)── */
    .modal-overlay { position: fixed; inset: 0; background: rgba(44,58,50,0.5); z-index: 500; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.show { display: flex; }
    .modal-box { background: var(--white); border-radius: 4px; padding: 28px; width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto; }
    .modal-icon-wrap { width: 48px; height: 48px; background: rgba(59,130,246,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
    .modal-icon-wrap svg { width: 22px; height: 22px; fill: var(--status-processing); }
    .modal-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 400; color: var(--green-dark); margin-bottom: 10px; }
    .modal-amount { font-size: 13px; color: var(--text); line-height: 1.6; margin-bottom: 16px; }
    .modal-amount strong { color: var(--green-dark); font-weight: 500; }
    .modal-note { font-size: 12px; color: var(--muted); line-height: 1.6; margin-bottom: 10px; }
    .modal-note.last { margin-bottom: 22px; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }

    /* Toast */
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--green-dark); color: #fff; padding: 12px 22px; border-radius: 4px; font-size: 13px; opacity: 0; transition: opacity 0.3s, transform 0.3s; z-index: 600; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .page-loading { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 13px; }
    .page-loading .wait-spinner { margin: 0 auto 16px; }
  </style>
</head>
<body>

<!-- Unified Navigator -->
<div id="pcd-nav" data-page="quotes"></div>

<div class="page">
  <div id="payment-root">
    <div class="page-loading">
      <div class="wait-spinner"></div>
      <span data-i18n="pay.loading">Loading payment details…</span>
    </div>
  </div>
</div>

<!-- Unified Footer -->
<div id="pcd-footer"></div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- CB-56 項目 B:Proceed 確認 modal
     ⚠️ 必須放在 #payment-root 之外 —— root().innerHTML 每次換畫面都會整片抹掉,
        modal 若在裡面會連同事件監聽一起被銷毀。 -->
<div class="modal-overlay" id="payConfirmModal" role="dialog" aria-modal="true" aria-labelledby="payConfirmTitle">
  <div class="modal-box">
    <div class="modal-icon-wrap"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg></div>
    <div class="modal-title" id="payConfirmTitle" data-i18n="pay.modal.title">Confirm Payment Method</div>
    <div class="modal-amount" id="payConfirmAmount">&mdash;</div>
    <div class="modal-note"><span data-i18n="pay.modal.note_before">Confirming moves this order into</span> <strong>Payment Processing</strong><span data-i18n="pay.modal.note_after">. Nothing is charged at this step.</span></div>
    <div class="modal-note last" data-i18n="pay.modal.note_last">Once confirmed, you won&rsquo;t be able to change the payment method yourself &mdash; please contact us if you need to switch.</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="btnPayConfirmCancel" data-i18n="common.btn.cancel">Cancel</button>
      <button class="btn btn-primary" id="btnPayConfirmOk"><span class="btn-text" data-i18n="pay.modal.confirm_btn">Confirm Method</span></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="components/i18n.js?v=cb62c"></script>
<script src="components/navigator.js?v=cb62c"></script>
<script src="components/footer.js?v=cb62c"></script>
<script>
// =====================================================================
// payment.html  |  CB-43 T4 — Dealer 付款頁
// ---------------------------------------------------------------------
// URL 契約:payment.html?quote_id=xxx
// 連線一律走 config.js 的 window.SB_URL / window.SB_KEY / window.N8N_PAYMENT_WEBHOOK
//
// [CB-43 T4 / B1] Change Method 純自足設計:
//   本頁「永遠只認最新一筆 payment 列」。Change Method 只會「回到選單 → 產生新列」,
//   絕不 UPDATE 任何舊 payment 列(dealer RLS 也不允許 UPDATE payments)。
//   → 舊 Check 列殘留無害(不走 QuickBooks)。
//   → 舊 Card/ACH 列(及其 QuickBooks invoice)的 cancel / void 一律由 n8n 後續工作單負責,
//     T4 不處理、不呼叫任何 cancel Edge Function。
// =====================================================================

const { createClient } = window.supabase;
const _supabase = createClient(window.SB_URL, window.SB_KEY);

// ── module state ──
let userId         = null;   // 登入 dealer 的 auth uid
let quoteId        = null;   // query string 的 quote_id
let quote          = null;   // 當前 quote row
let latestPayment  = null;   // 最新一筆 payment(可能為 null)
let selectedMethod = null;   // 選單暫存:'card' / 'ach' / 'check'

// ── fee 契約(百分數) ──
let feeConfig = { card: 2.99, ach: 1, check: 0 };  // fallback 預設;init 時嘗試以 settings 覆寫(前端寬鬆)

// ── helpers ──
/**
 * CB-62:i18n 取字。i18n.js 未載入或字典未就緒時回傳英文 fallback。
 * 參數代入一律用函式形式的 replace,避免 $& / $' 被當成特殊樣式。
 */
function pcTxt(key, fallback, params) {
  if (typeof window.pcT === 'function') {
    const s = window.pcT(key, params || null, fallback);
    if (s) return s;
  }
  return String(fallback).replace(/\{(\w+)\}/g, function (whole, name) {
    return (params && params[name] != null) ? String(params[name]) : whole;
  });
}

function round2(x) { return Math.round((parseFloat(x || 0) + Number.EPSILON) * 100) / 100; }
function fmt(n)     { return '$' + parseFloat(n || 0).toFixed(2); }
function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function computeFee(method, base) {
  const pct  = feeConfig[method] != null ? feeConfig[method] : 0;
  const fee  = round2(base * (pct / 100));
  const total = round2(base + fee);
  return { pct, fee, total, base: round2(base) };
}
function methodLabel(m) {
  return m === 'card' ? pcTxt('pay.method.card', 'Credit / Debit Card')
       : m === 'ach'  ? pcTxt('pay.method.ach', 'ACH Bank Transfer')
       : m === 'check' ? pcTxt('pay.method.check', 'Check')
       : m || '—';
}
function root() { return document.getElementById('payment-root'); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// 各畫面共用的頂部返回連結
function backLinkHtml() {
  return `<a class="back-link" href="quote-detail.html?id=${encodeURIComponent(quoteId)}">${escapeHtml(pcTxt('pay.back_order', '← Back to Order'))}</a>`;
}

// quote 摘要條(PO# / Job Name / Order Total)
function quoteStripHtml() {
  const po  = escapeHtml(quote.po_number || quote.draft_number || '—');
  const job = escapeHtml(quote.job_name || '—');
  return `
    <div class="quote-strip">
      <div class="qs-item"><div class="qs-label">${escapeHtml(pcTxt('nq3.field.po_number', 'PO Number'))}</div><div class="qs-value po">${po}</div></div>
      <div class="qs-item"><div class="qs-label">${escapeHtml(pcTxt('nq3.field.job_name', 'Job Name'))}</div><div class="qs-value">${job}</div></div>
      <div class="qs-item"><div class="qs-label">${escapeHtml(pcTxt('nq3.sum.order_total', 'Order Total'))}</div><div class="qs-value total">${fmt(quote.grand_total)}</div></div>
    </div>`;
}

// =====================================================================
// init:auth 守門 → 取 quote_id → 查 quote + 最新 payment → renderGate
// =====================================================================
async function loadFeeConfig() {
  // 前端寬鬆:讀 settings 覆寫費率;讀失敗/不齊 → 保留 fallback 預設,不擋付款(WF1 才真正收費)
  try {
    const { data, error } = await _supabase
      .from('settings')
      .select('key, value')
      .in('key', ['fee_card_percent', 'fee_ach_percent', 'fee_check_percent']);
    if (error) throw error;
    const map = {};
    (data || []).forEach(r => { map[r.key] = parseFloat(r.value); });
    const next = { card: map.fee_card_percent, ach: map.fee_ach_percent, check: map.fee_check_percent };
    if ([next.card, next.ach, next.check].every(v => typeof v === 'number' && !isNaN(v))) {
      feeConfig = next;
    } else {
      console.warn('[payment] fee settings incomplete, using fallback feeConfig', next);
    }
  } catch (err) {
    console.warn('[payment] loadFeeConfig failed, using fallback feeConfig:', err);
  }
}

async function init() {
  // 1. session
  const { data: { session } } = await _supabase.auth.getSession();
  if (!session) { window.location.href = 'login.html'; return; }
  userId = session.user.id;

  // 2. dealer 守門(對齊 quotes.html)
  const { data: me } = await _supabase
    .from('dealers').select('role, is_active').eq('id', userId).single();
  if (!me?.is_active) { await _supabase.auth.signOut(); window.location.href = 'login.html'; return; }
  if (['admin', 'super_admin'].includes(me?.role)) { window.location.href = 'admin.html'; return; }

  // 3. quote_id
  quoteId = new URLSearchParams(window.location.search).get('quote_id');
  if (!quoteId) { renderError(pcTxt('pay.err.invalid_link_title', 'Invalid payment link'),
      pcTxt('pay.err.invalid_link_text', 'This link is missing an order number. Please open payment from your order page.')); return; }

  // 4. 讀 quote + 最新 payment
  await reloadData();

  // 4.5 讀 settings 費率(覆寫 feeConfig 顯示值;失敗保留 fallback)
  await loadFeeConfig();

  // 5. 依現況分流
  renderGate();
}

// 重新載入 quote + 最新 payment(refreshStatus / submit 後重用)
async function reloadData() {
  const { data: q, error: qErr } = await _supabase
    .from('quotes')
    .select('id, dealer_id, status, grand_total, po_number, draft_number, job_name')
    .eq('id', quoteId)
    .maybeSingle();

  if (qErr) { console.error('[payment] load quote error:', qErr); quote = null; return; }
  quote = q || null;
  if (!quote) { latestPayment = null; return; }

  const { data: pays, error: pErr } = await _supabase
    .from('payments')
    .select('id, payment_method, base_amount, fee_percentage, fee_amount, total_paid, status, created_at, quickbooks_payment_link')
    .eq('quote_id', quoteId)
    .order('created_at', { ascending: false })
    .limit(1);

  if (pErr) { console.error('[payment] load payments error:', pErr); latestPayment = null; return; }
  latestPayment = (pays && pays.length) ? pays[0] : null;
}

// =====================================================================
// renderGate:重複付款保護(一律只認最新一筆 payment 的 status)
// =====================================================================
function renderGate() {
  if (!quote) { renderError(pcTxt('pay.err.not_found_title', 'Order not found'),
      pcTxt('pay.err.not_found_text', "We couldn't load this order. The link may be incorrect, or you may not have access.")); return; }

  const s = quote.status;

  // 不可付款狀態
  if (s === 'Draft' || s === 'Returned' || s === 'Closed') {
    renderBlocked(pcTxt('pay.err.unavailable_title', 'Payment unavailable'),
      pcTxt('pay.err.unavailable_text', "This order can't accept payment in its current status. Please contact us if you have questions."));
    return;
  }

  // 已進入出貨處理 / 已結案 → 付款已完成
  // CB-55 B-4:'Order Completed' 必須明列。若省略會掉進函式最後的
  //   catch-all,dealer 開已完成訂單的付款頁會看到「Payment unavailable」,
  //   而不是完成畫面 —— 感謝信寄出後最容易被 dealer 撞見的一頁。
  if (s === 'Order Processing' || s === 'Order Completed') {
    renderCompleted();
    return;
  }

  // 一般:可建立新 payment
  if (s === 'Pending') {
    renderMethodSelect();
    return;
  }

  // 付款處理中 → 再看最新一筆 payment
  if (s === 'Payment Processing') {
    const ps = latestPayment ? latestPayment.status : null;
    if (ps === 'confirmed') { renderCompleted(); return; }
    if (ps === 'processing') { renderProcessingSummary(); return; }
    // failed / cancelled / 無紀錄 → 視同可再付
    renderMethodSelect();
    return;
  }

  // 其他未知狀態 → 保守擋下
  renderBlocked(pcTxt('pay.err.unavailable_title', 'Payment unavailable'),
      pcTxt('pay.err.unavailable_text', "This order can't accept payment in its current status. Please contact us if you have questions."));
}

// CB-56 項目 B:Proceed 前的確認 modal
// ---------------------------------------------------------------------
// 情境:dealer 點 Proceed 後 QuickBooks 視窗要數秒才跳出,dealer 常以為
//       沒反應就離開 → 付款未完成。這層 gate 只負責「先講清楚再送出」。
//
// ⚠️ 不改 proceedCardAch() 任何一行 —— loading / 錯誤 / 跳轉仍由它自己管。
// ⚠️ modal 開啟期間完全不碰 btnProceed(不加 loading、不 disable),
//    否則按 Cancel 後按鈕會殘留在不可用狀態(B-10)。
// ⚠️ 文案刻意寫 "will appear here shortly" 而非承諾必然出現 —— pay link
//    是 webhook 回應後才有,n8n 失敗時不會產生(B-11)。
// =====================================================================
let _pendingProceed = null;   // { method, f } —— 等待 Confirm 的付款意圖

function openPayConfirm(method, f) {
  const overlay = document.getElementById('payConfirmModal');
  // 保險:markup 不在(理論上不可能)就直接走原流程,不要卡住 dealer 付款
  if (!overlay) { submitSimplifiedPayment(method, f); return; }
  _pendingProceed = { method: method, f: f };
  document.getElementById('payConfirmAmount').innerHTML =
    `${escapeHtml(pcTxt('pay.row.method', 'Payment Method'))}: <strong>${escapeHtml(methodLabel(method))}</strong><br/>${escapeHtml(pcTxt('pay.amount_due_label', 'Amount Due:'))} <strong>${fmt(f.total)}</strong>`;
  overlay.classList.add('show');
  const ok = document.getElementById('btnPayConfirmOk');
  if (ok) ok.focus();
}

function closePayConfirm() {
  const overlay = document.getElementById('payConfirmModal');
  if (overlay) overlay.classList.remove('show');
  _pendingProceed = null;
}

// markup 是靜態的(在 #payment-root 之外),所以監聽器全域只綁一次,
// 不隨畫面重繪重綁 —— 避免重複綁定累加。
function wirePayConfirm() {
  const overlay = document.getElementById('payConfirmModal');
  if (!overlay) return;
  document.getElementById('btnPayConfirmCancel').addEventListener('click', closePayConfirm);
  document.getElementById('btnPayConfirmOk').addEventListener('click', () => {
    const pend = _pendingProceed;
    closePayConfirm();
    if (pend) submitSimplifiedPayment(pend.method, pend.f);
  });
  // 點背景 / ESC = Cancel(非破壞性動作,安全)
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closePayConfirm(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlay.classList.contains('show')) closePayConfirm();
  });
}

//    doAwaitingSelectMethod() 相同(規格來源:Payment PM,CB-89)。
//      本處                    dealer 自選(payment.html)
//      admin-payments.html     super_admin 代客戶選(CB-89)
//    🔴 兩處必須同步 —— 任一方變更寫入欄位、狀態值、寫序或費率來源時,
//       必須檢視另一方。
//
//    失效模式:兩處寫法漂移後,admin 代選與 dealer 自選會產生【不同的
//    payments 列】,而且不報錯、不當機 —— 同一張單的 Receipt 內容會因為
//    「是誰按的按鈕」而不同,要到客戶反映才會發現。
//
// 🔴 架構限制聲明(非 CB-89 造成,CB-89 只是必須在其上工作):
//    payments 的 admin 與 dealer policy 嚴格度【不對稱】。
//      dealer_insert_own_payments  WITH CHECK 綁死
//        status='processing' AND payment_method IN ('card','ach','check')
//      admin_insert_payments       WITH CHECK 只有 is_admin() —— 零欄位限制
//    也就是說本檔(dealer 路徑)有 DB 護欄,admin 路徑【沒有】——
//    那側 status / payment_method 的正確性完全依賴前端的具名常數。
//    已登記:F-162(防護錯覺)、F-163(policy 不對稱)。背景見 CB-66。
//
// ⚠️ round2():本檔 L234 的實作在 admin-payments.html 有一份逐字複製,
//    F-165 修正時三份必須一起改。見該處註解。
// ═══════════════════════════════════════════════════════════════════
async function submitSimplifiedPayment(method, f) {
  const btn   = document.getElementById('btnProceed');
  const errEl = document.getElementById('payError');
  if (errEl) errEl.classList.add('hidden');
  if (btn) { btn.classList.add('loading'); btn.disabled = true; }

  try {
    // ① UPDATE quotes —— 🔴 只寫 status 一欄(F2 Case 2 整列凍結)。
    //    .eq('status','Pending') 為前態守衛 + 併發保護(兩分頁同送,第二個 count=0 擋下)。
    //    count:'exact' 讓 RLS/trigger 靜默擋下(0 列)時 throw,不假成功;
    //    此時尚未建立 payment 列,不留孤兒。
    const { error: updErr, count: updCount } = await _supabase
      .from('quotes')
      .update({ status: 'Payment Processing' }, { count: 'exact' })
      .eq('id', quoteId)
      .eq('status', 'Pending');
    if (updErr) throw updErr;
    if (updCount === 0) {
      throw new Error(pcTxt('pay.err.status_update', "Couldn't update the order status. Please refresh and try again, or contact us."));
    }

    // ② INSERT payments —— 金額四欄 + method + status 照寫。
    //    quickbooks_invoice_id / quickbooks_payment_link 刻意不寫(留 NULL):
    //    confirm / cancel / Receipt / Export 都不讀這兩欄,天然相容。
    //    fee 一律走 computeFee(讀 settings),三方式不 hardcode。
    const { data: payRow, error: insErr } = await _supabase
      .from('payments')
      .insert({
        quote_id:       quoteId,
        payment_method: method,
        base_amount:    f.base,
        fee_percentage: f.pct,
        fee_amount:     f.fee,
        total_paid:     f.total,
        status:         'processing',
      })
      .select('id')
      .single();
    if (insErr) throw insErr;
    const paymentId = payRow.id;

    // ③ E1b —— 觸發源由 WF1 搬到此處。失敗只 log 不阻斷(對齊既有慣例)。
    try {
      const { data: { session } } = await _supabase.auth.getSession();
      await fetch(`${window.SB_URL}/functions/v1/send-payment-email`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${session.access_token}`,
        },
        body: JSON.stringify({ type: 'payment_submitted', quote_id: quoteId, payment_id: paymentId }),
      });
    } catch (emailErr) {
      console.error('[payment] send-payment-email failed (non-blocking):', emailErr);
    }

    // ④ 指示畫面
    renderInstruction(method, f);

  } catch (err) {
    console.error('[payment] submitSimplifiedPayment failed:', err);
    if (btn) { btn.classList.remove('loading'); btn.disabled = false; }
    if (errEl) {
      errEl.textContent = pcTxt('pay.err.submission_failed', 'Submission failed:') + ' '
      + (err.message || pcTxt('pay.err.unexpected', 'An unexpected error occurred. Please try again.'));
      errEl.classList.remove('hidden');
    }
  }
}

/* CB-61 SIMPLIFIED: auto-invoice disabled — proceedCardAch() 已無呼叫端。
   保留完整原碼供日後恢復(WF1 webhook → QB invoice → pay link → redirect)。
   恢復方式:把 openPayConfirm / wirePayConfirm 兩處呼叫改回 proceedCardAch。 */
async function proceedCardAch(method, f) {
  const btn = document.getElementById('btnProceed');
  const errEl = document.getElementById('payError');
  errEl.classList.add('hidden');
  btn.classList.add('loading');
  btn.disabled = true;

  // ① 金額不信 client:只送 quote_id + payment_method,金額全由 WF1 依 grand_total + settings 費率自算
  const payload = {
    quote_id:       quoteId,
    payment_method: method,
  };

  // ② 驗身分:帶 Supabase JWT,WF1 換回 uid 比對 quote.dealer_id
  const { data: { session } } = await _supabase.auth.getSession();
  if (!session) { window.location.href = 'login.html'; return; }

  try {
    // n8n 會:建 QuickBooks Invoice + 寫 payments 列 + 改 quote.status,並回傳 payment link。
    const resp = await fetch(window.N8N_PAYMENT_WEBHOOK, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + session.access_token,
      },
      body: JSON.stringify(payload),
    });

    if (!resp.ok) throw new Error('Webhook responded ' + resp.status);

    let data = {};
    try { data = await resp.json(); } catch (_) { data = {}; }
    const link = data.payment_link || data.paymentLink || data.url || data.link || null;

    if (!link) throw new Error('No payment link returned');

    // 成功:開新分頁跳 QuickBooks,本頁進入等待
    window.open(link, '_blank');
    renderWaiting(link);

  } catch (err) {
    console.error('[payment] card/ach webhook failed:', err);
    btn.classList.remove('loading');
    btn.disabled = false;
    errEl.textContent = pcTxt('pay.err.online_unavailable', 'Online payment is temporarily unavailable. Please try again later, or pay by check.');
    errEl.classList.remove('hidden');
  }
}

    ${backLinkHtml()}
    <div class="card">
      <div class="card-title">${escapeHtml(pcTxt('pay.check.title', 'Pay by Check'))}</div>
      <div class="card-sub">${escapeHtml(pcTxt('pay.check.sub', 'Upload a photo of your check — no need to mail it.'))}</div>
      ${quoteStripHtml()}

      <div class="pay-to">
        <div class="lbl">${escapeHtml(pcTxt('pay.check.payable_to', 'Make Check Payable To'))}</div>
        <div class="val">ProCraft Cabinetry DC LLC</div>
      </div>
      <div class="check-help">
        ${escapeHtml(pcTxt('pay.check.write_before', 'Please write the check for'))} <strong>${fmt(quote.grand_total)}</strong> ${escapeHtml(pcTxt('pay.check.write_after', 'payable to'))}
        <strong>ProCraft Cabinetry DC LLC</strong>${escapeHtml(pcTxt('pay.check.write_after_upload', ', then upload a clear photo or scan of the front of the check below.'))}
      </div>

     <div class="sample-check">
        <div class="sc-label">${escapeHtml(pcTxt('pay.check.sample', 'Sample Check'))}</div>
        <img src="assets/check-sample.png" alt="${escapeHtml(pcTxt('pay.check.sample_alt', 'Sample check example'))}" class="sample-check-img"/>
      </div>

      <input type="file" id="checkFileInput" accept="image/jpeg,image/png,application/pdf" style="display:none;"/>
      <div class="upload-zone" id="uploadZone">
        <svg viewBox="0 0 24 24"><path d="M19 13v6H5v-6H3v6a2 2 0 002 2h14a2 2 0 002-2v-6h-2zM11 4.83L8.41 7.41 7 6l5-5 5 5-1.41 1.41L13 4.83V16h-2V4.83z"/></svg>
        <div class="uz-main">${escapeHtml(pcTxt('pay.check.upload_main', 'Tap to upload check image'))}</div>
        <div class="uz-sub">${escapeHtml(pcTxt('pay.check.upload_sub', 'JPG, PNG or PDF · Max 5MB'))}</div>
      </div>
      <div class="heic-note">${escapeHtml(pcTxt('pay.check.formats', 'Accepted formats: JPG, PNG or PDF · File size under 5MB.'))}</div>

      <div class="notice error hidden" id="checkError"></div>

      <div class="btn-row">
        <button class="btn btn-primary" id="btnSubmitCheck" disabled>
          <span class="spinner"></span><span class="btn-text">${escapeHtml(pcTxt('pay.check.submit', 'Submit Check'))}</span>
        </button>
        <button class="btn btn-ghost" id="btnChangeMethod">${escapeHtml(pcTxt('pay.btn.change_method', 'Change Method'))}</button>
      </div>
    </div>`;

  const input = document.getElementById('checkFileInput');
  const zone  = document.getElementById('uploadZone');
  const errEl = document.getElementById('checkError');
  const submitBtn = document.getElementById('btnSubmitCheck');

  zone.addEventListener('click', () => input.click());
  input.addEventListener('change', () => {
    errEl.classList.add('hidden');
    const file = input.files && input.files[0];
    if (!file) { resetCheckFile(zone, submitBtn); return; }

    const ext = (file.name.split('.').pop() || '').toLowerCase();
    const mimeOk = CHECK_ALLOWED_MIME.includes(file.type);
    const extOk  = CHECK_ALLOWED_EXT.includes(ext);

    // HEIC 特別提示
    if (file.type === 'image/heic' || file.type === 'image/heif' || ext === 'heic' || ext === 'heif') {
      resetCheckFile(zone, submitBtn);
      errEl.textContent = pcTxt('pay.check.err_heic', "This photo format can't be uploaded. Please use JPG, PNG, or PDF instead.");
      errEl.classList.remove('hidden');
      input.value = '';
      return;
    }
    if (!mimeOk && !extOk) {
      resetCheckFile(zone, submitBtn);
      errEl.textContent = pcTxt('pay.check.err_type', 'Unsupported file type. Please upload a JPG, PNG, or PDF.');
      errEl.classList.remove('hidden');
      input.value = '';
      return;
    }
    if (file.size > CHECK_MAX_BYTES) {
      resetCheckFile(zone, submitBtn);
      errEl.textContent = pcTxt('pay.check.err_size', 'File is too large. Please upload a file under 5MB.');
      errEl.classList.remove('hidden');
      input.value = '';
      return;
    }

    // 通過
    _checkFile = file;
    zone.classList.add('has-file');
    zone.innerHTML = `
      <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
      <div class="uz-filename">${escapeHtml(file.name)}</div>
      <div class="uz-sub">${escapeHtml(pcTxt('pay.check.change_file', 'Tap to choose a different file'))}</div>`;
    zone.addEventListener('click', () => input.click()); // innerHTML 重寫後重新綁定
    submitBtn.disabled = false;
  });

  document.getElementById('btnChangeMethod').addEventListener('click', changeMethod);
  submitBtn.addEventListener('click', submitCheck);
}

function resetCheckFile(zone, submitBtn) {
  _checkFile = null;
  submitBtn.disabled = true;
  zone.classList.remove('has-file');
}

async function submitCheck() {
  if (!_checkFile) return;
  const btn   = document.getElementById('btnSubmitCheck');
  const errEl = document.getElementById('checkError');
  errEl.classList.add('hidden');
  btn.classList.add('loading');
  btn.disabled = true;

  const base = round2(quote.grand_total);

  try {
    // 1. 上傳 Storage:{auth_uid}/{quote_id}/{filename}
    const ext = (_checkFile.name.split('.').pop() || 'jpg').toLowerCase();
    const filename = `check_${Date.now()}.${ext}`;
    const path = `${userId}/${quoteId}/${filename}`;

    const { data: upData, error: upErr } = await _supabase
      .storage.from('payment-checks')
      .upload(path, _checkFile, { upsert: false, contentType: _checkFile.type || undefined });
    if (upErr) throw upErr;
    const storedPath = (upData && upData.path) ? upData.path : path;

    // 2. UPDATE quotes.status = 'Payment Processing'(先於 payments,避免孤兒 payment 列)
    //    加 count:'exact' 檢查影響列數:若被 RLS 靜默擋掉(0 列)則 throw,不假成功。
    //    .eq('status','Pending') 為意圖聲明 + 併發保護(兩分頁同送 Check,第二個 count=0 擋下)。
    //    dealer UPDATE 需 quotes 上的 A1 policy 放行(Pending → Payment Processing);
    //    見 migration:dealer_advance_quote_to_payment_processing。
    const { error: updErr, count: updCount } = await _supabase
      .from('quotes')
      .update({ status: 'Payment Processing' }, { count: 'exact' })
      .eq('id', quoteId)
      .eq('status', 'Pending');
    if (updErr) throw updErr;
    if (updCount === 0) {
      // count=0 代表 quote 已非 Pending(併發/已在處理中)或 RLS 未放行 —— 中止,且尚未建立 payments 列。
      throw new Error(pcTxt('pay.err.status_update', "Couldn't update the order status. Please refresh and try again, or contact us."));
    }

    // 3. INSERT payments(dealer 只能寫 status='processing'、method 三選一 — 符合 RLS)
    const { data: payRow, error: insErr } = await _supabase
      .from('payments')
      .insert({
        quote_id:       quoteId,
        payment_method: 'check',
        base_amount:    base,
        fee_percentage: 0,
        fee_amount:     0,
        total_paid:     base,
        check_image_url: storedPath,   // 存 storage path,非 public url
        status:         'processing',
      })
      .select('id')
      .single();
    if (insErr) throw insErr;
    const paymentId = payRow.id;

    // 4. 呼叫 send-payment-email(失敗只 log 不阻斷,對齊 send-quote-email 慣例)
    try {
      const { data: { session } } = await _supabase.auth.getSession();
      await fetch(`${window.SB_URL}/functions/v1/send-payment-email`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${session.access_token}`,
        },
        body: JSON.stringify({ type: 'payment_submitted', quote_id: quoteId, payment_id: paymentId }),
      });
    } catch (emailErr) {
      console.error('[payment] send-payment-email failed (non-blocking):', emailErr);
    }

    // 5. 成功畫面
    renderCheckSuccess();

  } catch (err) {
    console.error('[payment] submit check failed:', err);
    btn.classList.remove('loading');
    btn.disabled = false;
    errEl.textContent = pcTxt('pay.err.submission_failed', 'Submission failed:') + ' '
      + (err.message || pcTxt('pay.err.unexpected', 'An unexpected error occurred. Please try again.'));
    errEl.classList.remove('hidden');
  }
}

// =====================================================================
// 畫面:現況(Payment Processing + 最新 payment=processing)
// =====================================================================
function renderProcessingSummary() {
  const p = latestPayment;
  const isCardAch = (p.payment_method === 'card' || p.payment_method === 'ach');
  const contBtn = (isCardAch && p.quickbooks_payment_link)
    ? `<a class="btn btn-primary" href="${escapeHtml(p.quickbooks_payment_link)}" target="_blank" rel="noopener"><span class="btn-text">${escapeHtml(pcTxt('pay.proc.continue', 'Continue Payment'))}</span></a>`
    : '';
const refreshCls  = contBtn ? 'btn btn-ghost' : 'btn btn-primary';
  const btnRowStyle = contBtn ? 'flex-direction:column; align-items:stretch;' : '';

  // ── CB-56 項目 C:Transaction Fee 明細 ──
  // 一律讀 payment 列【存值】,不現算(對齊 pdf-builder receipt 的既有原則:
  // 付款當下的金額已凍結,重算會與 total_paid 產生漂移)。
  // fee_percentage 存的是百分數(2.99 / 1),不是小數 —— 不可再乘 100。
  // 任一欄位缺漏、或 base+fee 與 total_paid 對不上 → 退回單行 Amount。
  // 寧缺勿錯:推導只會把資料問題藏起來,所以刻意不用 total_paid - base 補算。
  const _base = (p.base_amount    == null) ? null : parseFloat(p.base_amount);
  const _fee  = (p.fee_amount     == null) ? null : parseFloat(p.fee_amount);
  const _paid = (p.total_paid     == null) ? null : parseFloat(p.total_paid);
  const _pct  = (p.fee_percentage != null) ? parseFloat(p.fee_percentage)
              : (feeConfig[p.payment_method] != null ? feeConfig[p.payment_method] : null);

  const _canBreakdown = isCardAch
    && [_base, _fee, _paid, _pct].every(v => typeof v === 'number' && !isNaN(v))
    && round2(_base + _fee) === round2(_paid);

  if (isCardAch && !_canBreakdown) {
    console.warn('[payment] fee breakdown unavailable — falling back to single Amount row', {
      base_amount: p.base_amount, fee_amount: p.fee_amount,
      total_paid: p.total_paid, fee_percentage: p.fee_percentage,
    });
  }

  // grand 行刻意用 "Total" 而非 "Total Paid" —— 此畫面 payment status 正是
  // processing,錢尚未確認收到;若後續失敗退回可再付,"Paid" 即為錯誤陳述。
  const amountRowsHtml = _canBreakdown
    ? `<div class="amount-row"><span class="lbl">${escapeHtml(pcTxt('nq3.sum.order_total', 'Order Total'))}</span><span class="val">${fmt(_base)}</span></div>
        <div class="amount-row"><span class="lbl">${escapeHtml(pcTxt('pay.row.fee', 'Transaction Fee ({pct}%)', { pct: _pct }))}</span><span class="val">${fmt(_fee)}</span></div>
        <div class="amount-row grand"><span class="lbl">${escapeHtml(pcTxt('nq3.col.total', 'Total'))}</span><span class="val">${fmt(_paid)}</span></div>`
    : `<div class="amount-row"><span class="lbl">${escapeHtml(pcTxt('pay.row.amount', 'Amount'))}</span><span class="val">${fmt(p.total_paid)}</span></div>`;

  root().innerHTML = `
    ${backLinkHtml()}
    <div class="card">
      <div class="card-title">${escapeHtml(pcTxt('pay.proc.title', 'Payment In Progress'))}</div>
      <div class="card-sub">${escapeHtml(pcTxt('pay.proc.text', 'A payment is already being processed for this order.'))}</div>
      ${quoteStripHtml()}

      <div class="amount-rows">
        <div class="amount-row"><span class="lbl">${escapeHtml(pcTxt('pay.row.method', 'Payment Method'))}</span><span class="val">${methodLabel(p.payment_method)}</span></div>
        <div class="amount-row"><span class="lbl">${escapeHtml(pcTxt('qd.field.status', 'Status'))}</span><span class="val"><span class="status-badge processing">${escapeHtml(pcTxt('pay.proc.status_processing', 'Processing'))}</span></span></div>
        ${amountRowsHtml}
      </div>

      <div class="notice info">${instructionHtml(p.payment_method)}</div>
      <div class="qb-note">${escapeHtml(pcTxt('pay.proc.contact_note', 'Need to change your payment method? Please contact us — this order is already in payment processing.'))}</div>

      <div class="btn-row" style="${btnRowStyle}">
        ${contBtn}
        <button class="${refreshCls}" id="btnRefresh"><span class="spinner"></span><span class="btn-text">${escapeHtml(pcTxt('pay.btn.refresh_status', 'Refresh Status'))}</span></button>
      </div>
    </div>`;

  // CB-61 SIMPLIFIED: Change Method 已從此畫面移除。簡化版「點下即鎖定」,
  //   要換方式必須由 super_admin cancel 退回 Waiting for Payment(既有機制)。
  //   留著只會讓 dealer 回選方式頁、再送出時被前態守衛 count=0 擋下而報錯 ——
  //   先給希望再報錯,且與選方式頁的鎖定提示自相矛盾。
  //   中間頁(renderCardAch / renderCheckSimple)的 Change Method 保留:
  //   那時尚未送出、狀態仍為 Pending,換方式合法。
  document.getElementById('btnRefresh').addEventListener('click', refreshStatus);
}

function renderCompleted() {
  // CB-55 B-4:Order Processing 與 Order Completed 共用此畫面,文案分流。
  //   對 dealer 而言兩者都是「不必再付款」,差別只在訂單進度。
  //   刻意讀 quote.status 而非改函式簽章 —— renderGate 有多處呼叫此函式
  //   (含 Payment Processing + payment confirmed 的路徑),改簽章會波及全部。
  const _isDone   = !!(quote && quote.status === 'Order Completed');
  const _heading  = _isDone
    ? pcTxt('pay.done.order_complete', 'Order Complete')
    : pcTxt('pay.done.payment_complete', 'Payment Complete');
  const _stateTxt = _isDone
    ? pcTxt('pay.done.text_completed', 'This order has been completed. Thank you for your business — no further payment is required.')
    : pcTxt('pay.done.text_paid', 'This order has already been paid. No further payment is required.');
  root().innerHTML = `
    ${backLinkHtml()}
    <div class="card">
      <div class="state-block">
        <div class="state-icon ok"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
        <div class="state-heading">${_heading}</div>
        <div class="state-text">${_stateTxt}</div>
      </div>
      <div class="btn-row" style="justify-content:center;">
        <a class="btn btn-ghost" href="quote-detail.html?id=${encodeURIComponent(quoteId)}">Back to Order</a>
      </div>
    </div>`;
}
